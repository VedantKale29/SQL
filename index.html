M.push({
code: 'F6', track: 'Track F · Foundations', title: 'Dates, times and the boundary bugs',
sub: 'Truncation, differences, half-open ranges — and why timestamps break queries that work on dates.',
lede: 'Date handling causes more silent wrong answers than any other area of SQL, because the query runs, returns plausible numbers, and is off by one day. The bench clock is frozen at <code>2026-02-15 09:30:00</code> so every result here is reproducible \u2014 <code>NOW()</code> and <code>CURRENT_DATE</code> return that constant rather than a real wall clock.',
ex: [
 { t: 'Extracting parts, and truncating to a grain',
   sql: "SELECT event_id, event_ts,\n       YEAR(event_ts) AS yr, MONTH(event_ts) AS mo, DAY(event_ts) AS dy,\n       HOUR(event_ts) AS hr, DAYNAME(event_ts) AS weekday,\n       DATE_TRUNC('HOUR', event_ts) AS hour_bucket,\n       DATE_TRUNC('MONTH', event_ts) AS month_bucket\nFROM events\nORDER BY event_ts",
   note: 'Extraction pulls one component out; truncation snaps the whole value down to a grain and keeps it a date. Truncation is what you group by — it sorts correctly and stays a date type, unlike a formatted string.' },
 { t: 'The BETWEEN bug, demonstrated',
   sql: "SELECT\n  (SELECT COUNT(*) FROM events WHERE event_ts BETWEEN '2026-02-01' AND '2026-02-03') AS with_between,\n  (SELECT COUNT(*) FROM events WHERE event_ts >= '2026-02-01' AND event_ts < '2026-02-04') AS half_open,\n  (SELECT COUNT(*) FROM events WHERE event_ts >= '2026-02-01' AND event_ts <= '2026-02-03') AS inclusive_end",
   note: "All three intend \"the first three days of February\". BETWEEN and the inclusive form both stop at 2026-02-03 00:00:00, so every event later on the 3rd is dropped \u2014 e-05 at 22:47 vanishes. Only the half-open form is right." },
 { t: 'Differences: days versus units',
   sql: "SELECT e.event_id, e.event_ts,\n       DATEDIFF(NOW(), e.event_ts) AS days_ago,\n       TIMESTAMPDIFF(HOUR, e.event_ts, NOW()) AS hours_ago,\n       TIMESTAMPDIFF(MINUTE, e.event_ts, NOW()) AS minutes_ago\nFROM events e\nORDER BY minutes_ago",
   note: 'DATEDIFF counts calendar-day boundaries crossed, not elapsed time: two events four hours apart across midnight are one day apart. TIMESTAMPDIFF measures real elapsed units. Choose based on what the question means.' },
 { t: 'Bucketing to a reporting grain',
   sql: "SELECT DATE_TRUNC('DAY', event_ts) AS day,\n       COUNT(*) AS events,\n       MIN(event_ts) AS first_event,\n       MAX(event_ts) AS last_event,\n       COUNT(DISTINCT wallet_id) AS wallets\nFROM events\nGROUP BY DATE_TRUNC('DAY', event_ts)\nORDER BY day",
   note: 'Grouping on the truncated timestamp, not on the raw one. Grouping on a raw timestamp gives one group per row \u2014 which is the single most common beginner mistake with time-series data.' },
 { t: 'Month ends and period boundaries',
   sql: "SELECT DATE_TRUNC('MONTH', event_ts) AS month_start,\n       LAST_DAY(event_ts) AS month_end,\n       QUARTER(event_ts) AS qtr,\n       DATE_ADD(DATE_TRUNC('MONTH', event_ts), INTERVAL 1 MONTH) AS next_month_start\nFROM events\nWHERE event_id IN ('e-01', 'e-07')",
   note: 'Never hard-code the 30th or 31st. LAST_DAY handles month lengths and leap years; adding a month to the truncated start gives you the exclusive upper bound for a half-open range.' }
],
body: [
 { h: 'The half-open rule', html:
   '<p>Every time range should be written <code>&gt;= start AND &lt; next_start</code>. It is correct for dates, timestamps and timestamps with sub-second precision, it needs no knowledge of month lengths, and it never double-counts a boundary row.</p>' +
   '<div class="pre code">WHERE ts BETWEEN \'2026-02-01\' AND \'2026-02-28\'\n   <u>drops everything after midnight on the 28th</u>\nWHERE ts &gt;= \'2026-02-01\' AND ts &lt; \'2026-03-01\'\n   <i>correct, and unchanged in a leap year</i>\nWHERE ts &gt;= DATE_TRUNC(\'MONTH\', d) AND ts &lt; DATE_ADD(DATE_TRUNC(\'MONTH\', d), INTERVAL 1 MONTH)\n   <i>correct and parameterised</i></div>' },
 { h: 'Truncate, do not format', html:
   '<p><code>DATE_FORMAT(ts, \'%Y-%m\')</code> produces a string. It groups correctly and sorts correctly for ISO layouts, but it is no longer a date: you cannot add an interval to it, joins against a date dimension fail, and any non-ISO format sorts wrong. <code>DATE_TRUNC</code> keeps the type. Format at the presentation layer, truncate in the query.</p>' },
 { h: 'Time zones \u2014 the part that bites in production', html:
   '<ul>' +
   '<li><strong>Store UTC.</strong> Convert at the edges only. A pipeline holding local times cannot be reasoned about once daylight saving moves.</li>' +
   '<li><strong>Partition on the reporting zone, not UTC</strong>, if the business defines "day" locally \u2014 otherwise every daily total is skewed by the offset.</li>' +
   '<li><strong>Daylight saving means some local days have 23 or 25 hours.</strong> Any query assuming 86,400 seconds per day is wrong twice a year.</li>' +
   '<li><strong>A naive timestamp has no zone.</strong> Two systems can disagree about what it means and neither is wrong.</li>' +
   '</ul>' +
   '<p>The bench stores naive UTC-style strings and has no time-zone functions, which is itself the honest position: the moment zones enter, the answer depends on the engine\u2019s zone database, and that is not something a study site should pretend to simulate.</p>' },
 { h: 'Dialect map', html:
   '<table><thead><tr><th>Task</th><th>MySQL</th><th>Postgres / Athena</th><th>Spark SQL</th></tr></thead><tbody>' +
   '<tr><td>Truncate to month</td><td>DATE_FORMAT(d, \'%Y-%m-01\')</td><td>DATE_TRUNC(\'month\', d)</td><td>date_trunc(\'MONTH\', d)</td></tr>' +
   '<tr><td>Add days</td><td>DATE_ADD(d, INTERVAL n DAY)</td><td>d + INTERVAL \'n\' DAY</td><td>date_add(d, n)</td></tr>' +
   '<tr><td>Difference in days</td><td>DATEDIFF(a, b)</td><td>a - b / date_diff(\'day\', b, a)</td><td>datediff(a, b)</td></tr>' +
   '<tr><td>Current time</td><td>NOW()</td><td>current_timestamp</td><td>current_timestamp()</td></tr>' +
   '</tbody></table>' }
],
call: '"I write every time range half-open \u2014 greater-or-equal the start and strictly less than the next start \u2014 because BETWEEN on a timestamp column silently drops everything after midnight on the last day, and that failure produces a plausible number rather than an error."',
warn: 'A query that is correct on a DATE column becomes wrong the day someone widens it to a TIMESTAMP. Nothing errors; the daily totals just start missing part of the final day. Half-open ranges are immune to that change, which is the real reason to write them that way by default.',
qf: [
 ['Why avoid BETWEEN on timestamps?', 'The upper bound is inclusive at midnight, so everything later on the final day is dropped.'],
 ['What is the safe range form?', '>= start AND < next_start — half-open, and correct for dates, timestamps and leap years alike.'],
 ['DATE_TRUNC or DATE_FORMAT for grouping?', 'DATE_TRUNC — it keeps the date type so you can still do arithmetic and join a date dimension.'],
 ['DATEDIFF vs TIMESTAMPDIFF?', 'DATEDIFF counts calendar boundaries crossed; TIMESTAMPDIFF measures elapsed units. They disagree across midnight.'],
 ['How should time zones be stored?', 'UTC throughout, converted only at the edges — and partition on the zone the business calls a day.'],
 ['Why not hard-code month ends?', 'Month lengths and leap years vary; LAST_DAY or an interval added to the truncated start is always right.']
]});

M.push({
code: 'F7', track: 'Track F · Foundations', title: 'Strings, patterns and regular expressions',
sub: 'Cleaning, parsing and matching text — and knowing when to stop doing it in SQL.',
lede: 'Raw data arrives dirty: padded, inconsistently cased, with the useful part buried inside a larger string. SQL has enough string handling to normalise and parse most of it, and knowing where that stops being the right tool is a data-engineering judgement worth demonstrating.',
ex: [
 { t: 'Normalising for a join key',
   sql: "SELECT address,\n       UPPER(address) AS upper_form,\n       LENGTH(address) AS len,\n       LEFT(address, 4) AS prefix,\n       RIGHT(address, 2) AS suffix,\n       CONCAT(chain, ':', address) AS composite_key\nFROM wallets\nORDER BY wallet_id",
   note: 'Case and whitespace differences are the classic cause of a join that silently matches nothing. Normalise both sides identically — and do it once, at load, not in every downstream query.' },
 { t: 'LIKE versus regex',
   sql: "SELECT rule_code,\n       CASE WHEN rule_code LIKE '%CHAIN%' THEN 1 ELSE 0 END AS like_match,\n       REGEXP_LIKE(rule_code, '^(STRUCT|PEEL)') AS regex_prefix,\n       REGEXP_LIKE(rule_code, '_') AS has_underscore\nFROM alerts\nGROUP BY rule_code\nORDER BY rule_code",
   note: "LIKE has exactly two wildcards and no alternation. Regex gives you anchors, alternation and character classes. Note has_underscore: in LIKE the underscore is a wildcard matching any character, in regex it is a literal — a genuine source of confusion." },
 { t: 'Extracting structure from text',
   sql: "SELECT idempotency_key,\n       REGEXP_SUBSTR(idempotency_key, '^[a-z]+') AS key_type,\n       REGEXP_SUBSTR(idempotency_key, '[0-9]+') AS key_number,\n       SPLIT_PART(idempotency_key, '-', 1) AS part1,\n       SPLIT_PART(idempotency_key, '-', 2) AS part2\nFROM ledger\nORDER BY entry_id",
   note: 'Two ways to decompose a compound key. SPLIT_PART is faster and clearer when the delimiter is reliable; regex is what you reach for when it is not.' },
 { t: 'Cleaning and validating in one pass',
   sql: "SELECT owner,\n       LOWER(TRIM(owner)) AS normalised,\n       LPAD(CAST(version AS CHAR), 4, '0') AS padded_version,\n       REPLACE(account_id, 'acc-', 'account_') AS renamed,\n       REGEXP_LIKE(account_id, '^acc-[0-9]+$') AS id_well_formed\nFROM accounts\nORDER BY account_id",
   note: 'A validation column expressed as a regex is a data-quality assertion you can aggregate: SUM(1 - id_well_formed) is the count of malformed identifiers, which belongs in a scheduled check (see D4).' },
 { t: 'A profiling query for a messy column',
   sql: "SELECT LENGTH(address) AS len,\n       COUNT(*) AS rows_with_len,\n       MIN(address) AS example,\n       SUM(CASE WHEN REGEXP_LIKE(address, '^0x[0-9a-f]+$') THEN 1 ELSE 0 END) AS well_formed\nFROM wallets\nGROUP BY LENGTH(address)\nORDER BY len",
   note: 'Grouping by length is the fastest way to find the odd rows in an unfamiliar text column. A length distribution with one or two outlier buckets is almost always where the parse errors live.' }
],
body: [
 { h: 'LIKE, regex, or neither', html:
   '<table><thead><tr><th>Need</th><th>Tool</th><th>Index-friendly</th></tr></thead><tbody>' +
   '<tr><td>Prefix match</td><td><code>LIKE \'abc%\'</code></td><td><b>Yes</b></td></tr>' +
   '<tr><td>Contains</td><td><code>LIKE \'%abc%\'</code></td><td>No</td></tr>' +
   '<tr><td>Alternation, anchors, classes</td><td><code>REGEXP_LIKE</code></td><td>No</td></tr>' +
   '<tr><td>Split on a reliable delimiter</td><td><code>SPLIT_PART</code></td><td>n/a</td></tr>' +
   '<tr><td>Ranked relevance over prose</td><td>Full-text index / a search engine</td><td>Its own index</td></tr>' +
   '</tbody></table>' +
   '<p>Only a prefix <code>LIKE</code> can use a B-tree. Everything else scans, which is fine on a filtered subset and expensive as the leading predicate on a large table.</p>' },
 { h: 'The wildcard mismatch', html:
   '<div class="pre code">LIKE   :  %  = any run of characters      _  = exactly one character\nREGEX  :  .* = any run of characters      .  = exactly one character\n          _  is a <b>literal underscore</b></div>' +
   '<p>Translating a LIKE pattern into a regex by hand and forgetting this is a recurring bug when someone migrates filters from MySQL to Athena.</p>' },
 { h: 'Where to stop', html:
   '<p>SQL string handling is right for <em class="hl">normalising</em> and <em class="hl">extracting a known shape</em>. It is the wrong tool for parsing free text, fuzzy name matching, or anything needing tokenisation and scoring. Those belong upstream in the transformation layer or in a search index \u2014 and a regex complex enough that nobody can modify it safely is a liability regardless of how well it performs.</p>' +
   '<p>Regex dialects also differ: MySQL, Postgres, Java (Spark) and Presto do not agree on every escape and named-group syntax. A pattern that works in your notebook may not work in the job.</p>' }
],
call: '"I normalise text once at load rather than in every downstream query, and I use a prefix LIKE where an index can serve it \u2014 regex only when I need alternation or anchors, because it always scans and the dialects do not agree on escapes."',
warn: 'Underscore is a single-character wildcard in LIKE and a literal in regex. A filter like `code LIKE \'PEEL_CHAIN\'` also matches PEELXCHAIN, and the bug survives review because the intended row does match. Escape it, or use equality.',
qf: [
 ['Which LIKE patterns can use an index?', 'Prefix patterns only — a leading wildcard forces a scan.'],
 ['LIKE vs regex?', 'LIKE has two wildcards and no alternation; regex adds anchors, classes and alternation but always scans.'],
 ['What does _ mean in each?', 'Any single character in LIKE; a literal underscore in regex.'],
 ['How do you profile an unfamiliar text column?', 'Group by LENGTH and by a well-formedness regex — outlier buckets are where the bad rows are.'],
 ['When should string work leave SQL?', 'Free-text parsing, fuzzy matching and anything needing tokenisation or scoring — that is a transformation layer or a search index.']
]});

/* ══════════════ TRACK A · AGGREGATION (continued) ══════════════ */

M.push({
code: 'A5', track: 'Track A · Aggregation', title: 'ROLLUP, CUBE and GROUPING SETS',
sub: 'Subtotals and grand totals in one pass — and telling a subtotal NULL from a real one.',
lede: 'A report that needs totals per category, per region, and overall is three queries unioned together \u2014 or one query with a grouping specification. Beyond convenience it is a genuine performance win: the engine scans once instead of three times. The catch is that the subtotal rows are marked with NULL, and your data may already contain NULLs.',
ex: [
 { t: 'The problem: three queries doing one job',
   sql: "SELECT chain, risk_band, COUNT(*) AS wallets FROM wallets GROUP BY chain, risk_band\nUNION ALL\nSELECT chain, NULL, COUNT(*) FROM wallets GROUP BY chain\nUNION ALL\nSELECT NULL, NULL, COUNT(*) FROM wallets\nORDER BY chain, risk_band",
   note: 'Correct, and it scans the table three times. This is what ROLLUP replaces.' },
 { t: 'ROLLUP — hierarchical subtotals',
   sql: "SELECT chain, risk_band, COUNT(*) AS wallets\nFROM wallets\nGROUP BY chain, risk_band WITH ROLLUP",
   note: 'One scan, same information. ROLLUP peels columns off the right: (chain, risk_band), then (chain), then (). Look at the ethereum rows — one of the NULLs is a subtotal and one is a genuinely unclassified wallet. That is the problem the next example solves.' },
 { t: 'GROUPING() — which NULLs are subtotals',
   sql: "SELECT CASE WHEN GROUPING(chain) = 1 THEN 'ALL CHAINS' ELSE chain END AS chain,\n       CASE WHEN GROUPING(risk_band) = 1 THEN 'ALL BANDS'\n            WHEN risk_band IS NULL THEN 'unclassified'\n            ELSE risk_band END AS band,\n       COUNT(*) AS wallets,\n       GROUPING(chain) AS g_chain,\n       GROUPING(risk_band) AS g_band\nFROM wallets\nGROUP BY chain, risk_band WITH ROLLUP",
   note: 'GROUPING() returns 1 when the column was rolled up and 0 when the NULL is real data. This is the only reliable way to label the rows, and it is exactly what an interviewer is probing when they ask about ROLLUP.' },
 { t: 'CUBE — every combination',
   sql: "SELECT chain, risk_band, COUNT(*) AS wallets,\n       GROUPING(chain) AS g_chain, GROUPING(risk_band) AS g_band\nFROM wallets\nGROUP BY CUBE(chain, risk_band)\nORDER BY g_chain, g_band, chain, risk_band",
   note: 'CUBE adds the sets ROLLUP omits — here, totals by risk_band across all chains. Two columns give four sets; n columns give 2^n, which is why CUBE on five columns is rarely what you want.' },
 { t: 'GROUPING SETS — exactly the sets you asked for',
   sql: "SELECT chain, risk_band, COUNT(*) AS wallets\nFROM wallets\nGROUP BY GROUPING SETS ((chain), (risk_band), ())\nORDER BY chain, risk_band",
   note: 'Neither hierarchical nor exhaustive: totals by chain, totals by band, and the grand total, with no chain-and-band combination at all. This is the form to reach for when you know precisely which rows the report needs.' }
],
body: [
 { h: 'The three specifications', html:
   '<table><thead><tr><th>Spec</th><th>Sets generated for (a, b)</th><th>Count</th></tr></thead><tbody>' +
   '<tr><td><code>GROUP BY a, b</code></td><td>(a,b)</td><td>1</td></tr>' +
   '<tr><td><code>ROLLUP(a, b)</code></td><td>(a,b), (a), ()</td><td>n+1</td></tr>' +
   '<tr><td><code>CUBE(a, b)</code></td><td>(a,b), (a), (b), ()</td><td>2\u207f</td></tr>' +
   '<tr><td><code>GROUPING SETS(\u2026)</code></td><td>whatever you list</td><td>your choice</td></tr>' +
   '</tbody></table>' +
   '<p>ROLLUP is for hierarchies where the columns nest \u2014 country, region, city; year, quarter, month. CUBE is for independent dimensions you want crossed every way. GROUPING SETS is the general form both are shorthand for.</p>' },
 { h: 'Why it is faster', html:
   '<p>The engine reads the input once and computes every set from the same scan, rather than re-scanning per union branch. On a large fact table that is the difference between one shuffle and three. It also means the subtotals are guaranteed consistent with the detail rows \u2014 union branches can drift if someone edits one and not the others.</p>' },
 { h: 'Dialect support', html:
   '<table><thead><tr><th>Engine</th><th>ROLLUP</th><th>CUBE / GROUPING SETS</th></tr></thead><tbody>' +
   '<tr><td>MySQL 8</td><td><code>WITH ROLLUP</code> only</td><td>No</td></tr>' +
   '<tr><td>Postgres, Spark SQL, Redshift</td><td>Yes</td><td>Yes</td></tr>' +
   '<tr><td>Athena / Trino</td><td>Yes</td><td>Yes</td></tr>' +
   '</tbody></table>' +
   '<p>MySQL\u2019s trailing <code>WITH ROLLUP</code> syntax also conflicts with <code>ORDER BY</code> in older versions \u2014 one more reason the portable habit is to write <code>GROUP BY ROLLUP(\u2026)</code> where the engine allows it.</p>' }
],
call: '"ROLLUP, CUBE and GROUPING SETS compute subtotals from a single scan instead of unioning several queries, and I always pair them with GROUPING() \u2014 otherwise a subtotal NULL is indistinguishable from a genuinely missing value in the data."',
warn: 'If the grouped column contains real NULLs, a plain ROLLUP result is ambiguous: you cannot tell a subtotal row from a real "unknown" group by looking at it. GROUPING() is not optional decoration, it is what makes the output interpretable.',
qf: [
 ['What does ROLLUP generate?', 'Hierarchical subtotals — it peels grouping columns off the right, giving n+1 sets.'],
 ['ROLLUP vs CUBE?', 'ROLLUP is hierarchical (n+1 sets); CUBE is every combination (2^n sets).'],
 ['What is GROUPING() for?', 'It returns 1 when a column was rolled up, distinguishing a subtotal NULL from a real NULL.'],
 ['Why is it faster than UNION ALL?', 'One scan and one shuffle produce every set, instead of one per branch — and the subtotals cannot drift from the detail.'],
 ['Which is most general?', 'GROUPING SETS — ROLLUP and CUBE are shorthand for particular lists of sets.'],
 ['Does MySQL support CUBE?', 'No — only WITH ROLLUP. Postgres, Spark, Redshift and Athena support all three.']
]});

M.push({
code: 'N1', track: 'Track N · Semi-structured data', title: 'JSON in SQL',
sub: 'Extracting fields from a payload column — and deciding what to promote to a real column.',
lede: 'Landing zones receive JSON: API responses, Kafka payloads, chain listeners. Modern SQL can read into it directly, which is convenient enough that teams query the raw payload forever and then wonder why the warehouse is slow. The engineering decision is not how to extract a field \u2014 it is which fields to <em class="hl">promote</em> to typed columns at the bronze-to-silver boundary.',
ex: [
 { t: 'Extracting scalars and nested fields',
   sql: "SELECT event_id, wallet_id,\n       JSON_VALUE(payload, '$.kind') AS kind,\n       JSON_VALUE(payload, '$.amount') AS amount,\n       JSON_VALUE(payload, '$.asset') AS asset,\n       JSON_VALUE(payload, '$.counterparty.id') AS counterparty,\n       JSON_VALUE(payload, '$.fee.usd') AS fee_usd\nFROM events\nORDER BY event_id",
   note: 'Dotted paths walk nested objects. Note e-08: the payload is malformed JSON, so every extraction returns NULL rather than aborting the query — that is Athena/Presto behaviour, and MySQL would instead raise an error.' },
 { t: 'Guarding against bad documents',
   sql: "SELECT event_id,\n       JSON_VALID(payload) AS is_valid,\n       JSON_TYPE(payload, '$.labels') AS labels_type,\n       JSON_LENGTH(payload, '$.labels') AS label_count,\n       JSON_KEYS(payload) AS top_level_keys\nFROM events\nORDER BY event_id",
   note: 'A schema profile of a schemaless column. e-08 is invalid; e-04 and e-06 are missing keys the others have. Both problems are invisible until you look — and both will produce NULLs downstream that nobody attributes to the parser.' },
 { t: 'Missing key versus JSON null versus invalid',
   sql: "SELECT event_id,\n       JSON_VALID(payload) AS valid,\n       JSON_CONTAINS_PATH(payload, '$.labels') AS has_labels,\n       JSON_VALUE(payload, '$.labels') AS labels_raw,\n       CASE WHEN JSON_VALID(payload) = 0 THEN 'unparseable'\n            WHEN JSON_CONTAINS_PATH(payload, '$.labels') = 0 THEN 'key absent'\n            WHEN JSON_LENGTH(payload, '$.labels') = 0 THEN 'present but empty'\n            ELSE 'populated' END AS diagnosis\nFROM events\nORDER BY event_id",
   note: 'Four states that all surface as NULL if you only extract. Distinguishing them is the difference between "the upstream schema changed" and "these events genuinely have no labels" — and the first is an incident.' },
 { t: 'Promoting JSON to typed columns',
   sql: "SELECT event_id, wallet_id, event_ts,\n       JSON_VALUE(payload, '$.kind') AS kind,\n       CAST(JSON_VALUE(payload, '$.amount') AS DECIMAL) AS amount_usd,\n       COALESCE(JSON_VALUE(payload, '$.counterparty.tag'), 'untagged') AS cp_tag,\n       COALESCE(JSON_LENGTH(payload, '$.labels'), 0) AS n_labels\nFROM events\nWHERE JSON_VALID(payload) = 1\n  AND JSON_VALUE(payload, '$.kind') = 'transfer'\nORDER BY amount_usd DESC",
   note: 'This is the silver-layer transformation: filter to valid documents, extract the fields the business queries, cast them, and supply defaults. Everything downstream reads real columns, and the raw payload is kept for replay.' },
 { t: 'Aggregating over extracted fields',
   sql: "SELECT COALESCE(JSON_VALUE(payload, '$.counterparty.tag'), 'untagged') AS cp_tag,\n       COUNT(*) AS events,\n       ROUND(SUM(CAST(JSON_VALUE(payload, '$.amount') AS DECIMAL)), 2) AS total_usd,\n       ROUND(AVG(CAST(JSON_VALUE(payload, '$.fee.usd') AS DECIMAL)), 2) AS avg_fee\nFROM events\nWHERE JSON_VALID(payload) = 1 AND JSON_VALUE(payload, '$.kind') = 'transfer'\nGROUP BY COALESCE(JSON_VALUE(payload, '$.counterparty.tag'), 'untagged')\nORDER BY total_usd DESC",
   note: 'It works, and on a large table it is slow: every row is parsed at query time and no column statistics exist to skip anything. Fine for exploration, wrong as a production dashboard query.' }
],
body: [
 { h: 'Why not query JSON forever', html:
   '<ul>' +
   '<li><strong>No column statistics.</strong> Parquet can skip row groups using min/max on a typed column; it cannot on a field buried in a string.</li>' +
   '<li><strong>Parse cost per row, per query.</strong> Paid again on every read, forever.</li>' +
   '<li><strong>No type safety.</strong> An upstream change from <code>9800.0</code> to <code>"9800.0"</code> breaks a cast silently, or worse, does not.</li>' +
   '<li><strong>Whole-column reads.</strong> Projecting one field still reads the entire payload column off disk.</li>' +
   '</ul>' +
   '<p>Keep the raw payload in bronze for replay and audit; promote the queried fields to typed columns in silver. That boundary is the answer to "how do you handle schemaless data in a lakehouse?"</p>' },
 { h: 'Path syntax and dialects', html:
   '<div class="pre code">$                    <i>the document root</i>\n$.counterparty.id    <i>nested object field</i>\n$.labels[0]          <i>array element by position</i>\n$.labels             <i>the whole array, as JSON text</i></div>' +
   '<table><thead><tr><th>Task</th><th>MySQL</th><th>Athena / Trino</th><th>Spark SQL</th></tr></thead><tbody>' +
   '<tr><td>Extract</td><td>JSON_EXTRACT / <code>-&gt;</code></td><td>json_extract</td><td>get_json_object</td></tr>' +
   '<tr><td>Extract unquoted</td><td>JSON_UNQUOTE / <code>-&gt;&gt;</code></td><td>json_extract_scalar</td><td>get_json_object</td></tr>' +
   '<tr><td>Parse to a struct</td><td>\u2014</td><td>CAST(json AS ROW(\u2026))</td><td>from_json(col, schema)</td></tr>' +
   '<tr><td>Invalid document</td><td>Raises an error</td><td>Returns NULL</td><td>Returns NULL</td></tr>' +
   '</tbody></table>' },
 { h: 'Schema drift is the real risk', html:
   '<p>A JSON column accepts anything, so an upstream producer can add, rename or retype a field without a single failure anywhere in the pipeline \u2014 the extraction just starts returning NULL. The defence is a scheduled profile: null rate per extracted field, and <code>JSON_KEYS</code> compared against an expected set. Alert on the delta, because nothing else will tell you.</p>' }
],
call: '"I keep the raw payload in bronze for replay and promote the queried fields to typed columns in silver \u2014 querying JSON directly means no column statistics, no row-group skipping, and a parse cost paid on every read forever."',
warn: 'A missing key, a JSON null, an empty array and an unparseable document all extract as SQL NULL. Without JSON_VALID and JSON_CONTAINS_PATH you cannot distinguish an upstream schema change from legitimately absent data — and the first one is an incident that will look exactly like normal sparse data.',
qf: [
 ['How do you extract a nested JSON field?', 'A path expression such as $.counterparty.id, via JSON_VALUE / json_extract_scalar / get_json_object depending on engine.'],
 ['Why not query JSON in production dashboards?', 'No column statistics, no row-group skipping, and a per-row parse cost on every read.'],
 ['Where should JSON be flattened?', 'At the bronze-to-silver boundary — raw kept for replay, queried fields promoted to typed columns.'],
 ['What does a malformed document return?', 'NULL in Athena and Spark; MySQL raises an error. Guard with JSON_VALID either way.'],
 ['How do you detect schema drift in a JSON column?', 'Profile the null rate per extracted field and compare JSON_KEYS against an expected set on a schedule.'],
 ['Missing key vs JSON null?', 'Both extract as SQL NULL — JSON_CONTAINS_PATH is what tells them apart.']
]});

M.push({
code: 'N2', track: 'Track N · Semi-structured data', title: 'Arrays, structs and explode',
sub: 'Nested collections in a columnar table — and the row multiplication that follows.',
lede: 'Parquet and Iceberg store arrays and structs natively, so a lakehouse table can hold a list of labels or a nested address without a join. Querying them means <em class="hl">unnesting</em> \u2014 turning one row with three elements into three rows \u2014 and that is fan-out by design, which makes it the same correctness question as J5 wearing different clothes.',
ex: [
 { t: 'The array as stored',
   sql: "SELECT event_id,\n       JSON_VALUE(payload, '$.labels') AS labels_json,\n       JSON_LENGTH(payload, '$.labels') AS n_labels,\n       JSON_VALUE(payload, '$.labels[0]') AS first_label,\n       JSON_VALUE(payload, '$.labels[1]') AS second_label\nFROM events\nWHERE JSON_VALID(payload) = 1\nORDER BY event_id",
   note: 'One row per event, the array intact. Indexing by position works but is brittle — it assumes an ordering the producer never promised. Position-based access is a code smell in array handling.' },
 { t: 'Filtering on array membership without unnesting',
   sql: "SELECT event_id, wallet_id,\n       JSON_VALUE(payload, '$.labels') AS labels,\n       CASE WHEN JSON_VALUE(payload, '$.labels') LIKE '%\"large\"%' THEN 1 ELSE 0 END AS is_large\nFROM events\nWHERE JSON_VALID(payload) = 1\nORDER BY is_large DESC, event_id",
   note: 'Containment as a predicate keeps one row per event — a semi-join over the array. Real engines give you contains(labels, \'large\') for this; the point is that it does not multiply rows, so aggregates stay correct.' },
 { t: 'Manual unnest — one row per element',
   sql: "WITH RECURSIVE idx AS (\n  SELECT 0 AS i UNION ALL SELECT i + 1 FROM idx WHERE i < 3\n)\nSELECT e.event_id, idx.i AS position,\n       JSON_VALUE(e.payload, CONCAT('$.labels[', idx.i, ']')) AS label\nFROM events e\nCROSS JOIN idx\nWHERE JSON_VALID(e.payload) = 1\n  AND JSON_VALUE(e.payload, CONCAT('$.labels[', idx.i, ']')) IS NOT NULL\nORDER BY e.event_id, idx.i",
   note: 'What UNNEST does, spelled out: cross join a position generator and keep the positions that exist. Seven valid events become eight rows — and only five events survive, because e-03 has an empty array and e-04 has no labels key at all. Both the fan-out and the silent row loss are visible in one result.' },
 { t: 'Aggregating labels safely',
   sql: "WITH RECURSIVE idx AS (\n  SELECT 0 AS i UNION ALL SELECT i + 1 FROM idx WHERE i < 3\n),\nexploded AS (\n  SELECT e.event_id, JSON_VALUE(e.payload, CONCAT('$.labels[', idx.i, ']')) AS label\n  FROM events e CROSS JOIN idx\n  WHERE JSON_VALID(e.payload) = 1\n    AND JSON_VALUE(e.payload, CONCAT('$.labels[', idx.i, ']')) IS NOT NULL\n)\nSELECT label, COUNT(*) AS occurrences, COUNT(DISTINCT event_id) AS events\nFROM exploded\nGROUP BY label\nORDER BY occurrences DESC, label",
   note: 'Explode, aggregate at the element grain, and stop. Note occurrences and events are counted separately — after an unnest those are different questions and conflating them is the classic error.' }
],
body: [
 { h: 'The real syntax, by engine', html:
   '<p>The bench has no array type, so the examples above emulate unnesting with a position generator. In a real lakehouse you would write:</p>' +
   '<div class="pre code">-- Athena / Trino\nSELECT e.event_id, l\nFROM events e\nCROSS JOIN UNNEST(e.labels) AS t(l)\n\n-- Spark SQL\nSELECT event_id, label\nFROM events\nLATERAL VIEW explode(labels) AS label\n-- or:  SELECT event_id, explode(labels) AS label FROM events\n\n-- keep rows with empty arrays\nLEFT JOIN UNNEST(...)        -- Trino\nLATERAL VIEW OUTER explode() -- Spark</div>' +
   '<p>The <code>OUTER</code> variants matter: a plain explode drops rows whose array is empty or null, which silently removes entities from your report exactly as an inner join does.</p>' },
 { h: 'Grain, again', html:
   '<table><thead><tr><th>Stage</th><th>One row is</th><th>Safe to SUM amounts?</th></tr></thead><tbody>' +
   '<tr><td>Before explode</td><td>One event</td><td>Yes</td></tr>' +
   '<tr><td>After explode</td><td>One event-label pair</td><td><b>No</b></td></tr>' +
   '<tr><td>After re-aggregating to event</td><td>One event</td><td>Yes</td></tr>' +
   '</tbody></table>' +
   '<p>Explode, do the element-level work, and collapse back before joining to anything with a measure. Or filter with a containment predicate and never explode at all \u2014 which is the cheaper answer whenever the question is "which events have this label?"</p>' },
 { h: 'Struct versus join', html:
   '<p>A struct is a nested record stored inline: <code>fee.gas</code>, <code>fee.usd</code>. It costs no join and reads only the sub-field you project, because columnar formats store nested fields as separate columns internally. That makes structs genuinely cheap and a reasonable default for tightly-coupled attributes.</p>' +
   '<p>Arrays are the expensive one: an array of structs is a one-to-many relationship hidden inside a row, and every query that touches it either explodes or works around it. Denormalising a small stable list is fine; denormalising an unbounded event history into an array is a modelling mistake.</p>' }
],
call: '"Exploding an array is deliberate fan-out \u2014 after the unnest a row is an event-label pair, not an event \u2014 so I do the element-level work and collapse back to the original grain before joining anything with a measure. Where the question is only membership I use a containment predicate and never explode."',
warn: 'A plain explode drops rows whose array is empty or NULL, exactly like an inner join. If your entity count falls after an unnest, that is why — use LATERAL VIEW OUTER explode in Spark or LEFT JOIN UNNEST in Trino.',
qf: [
 ['What does UNNEST / explode do to the grain?', 'One row per collection element instead of one per parent row — deliberate fan-out.'],
 ['How do you avoid exploding for a membership test?', 'A containment predicate such as contains(labels, \'large\') — it keeps one row per parent.'],
 ['Why did rows disappear after an explode?', 'A plain explode drops empty and NULL arrays; use the OUTER variant.'],
 ['Struct vs array cost?', 'Structs are cheap — stored as separate columns internally, no join, no fan-out. Arrays hide a one-to-many and force an unnest.'],
 ['After exploding, which counts differ?', 'COUNT(*) counts element pairs; COUNT(DISTINCT parent_id) counts parents. Conflating them is the usual bug.']
]});
/* ══════════════ TRACK T · TRANSACTIONS & CONCURRENCY ══════════════ */

M.push({
code: 'T1', track: 'Track T · Transactions & concurrency', title: 'ACID and isolation levels',
sub: 'What a transaction guarantees, what each isolation level allows, and what it costs.',
lede: 'Transactions are an OLTP topic that data engineers are asked about anyway, because the source systems you extract from run under one of these levels and it determines what a snapshot read can see. The four anomalies are the vocabulary; being able to name which level permits which is the whole question.',
ex: [
 { t: 'The state you are reasoning about',
   sql: "SELECT account_id, owner, balance, version, updated_at\nFROM accounts\nORDER BY account_id",
   note: 'Four balances with a version counter. Every anomaly below is about what a concurrent reader sees while another session is changing these rows.' },
 { t: 'Reconciling balances against the ledger',
   sql: "SELECT a.account_id, a.owner, a.balance,\n       ROUND(COALESCE(SUM(l.delta), 0), 2) AS ledger_total,\n       ROUND(a.balance - COALESCE(SUM(l.delta), 0), 2) AS discrepancy,\n       COUNT(l.entry_id) AS entries\nFROM accounts a\nLEFT JOIN ledger l ON l.account_id = a.account_id\nGROUP BY a.account_id, a.owner, a.balance\nORDER BY a.account_id",
   note: "acc-3 is out by 589.75. The balance is right and the ledger is wrong — entry 7 is a double-post under the same idempotency key, which is what a retry without a uniqueness constraint produces. This is the shape a failed transaction leaves behind." },
 { t: 'Finding the double-post',
   sql: "SELECT idempotency_key, COUNT(*) AS posts,\n       MIN(posted_at) AS first_post, MAX(posted_at) AS retry,\n       TIMESTAMPDIFF(SECOND, MIN(posted_at), MAX(posted_at)) AS seconds_apart\nFROM ledger\nGROUP BY idempotency_key\nHAVING COUNT(*) > 1",
   note: 'One second apart — the signature of an automatic retry after a timeout, not a user double-click. A unique constraint on idempotency_key would have made the second insert fail harmlessly instead of corrupting the total.' },
 { t: 'A consistent read across two aggregates',
   sql: "SELECT (SELECT ROUND(SUM(balance), 2) FROM accounts) AS total_balances,\n       (SELECT ROUND(SUM(delta), 2) FROM ledger) AS total_ledger,\n       (SELECT ROUND(SUM(balance), 2) FROM accounts)\n     - (SELECT ROUND(SUM(delta), 2) FROM ledger) AS gap",
   note: 'Both aggregates are computed inside one statement, so they see one snapshot. Run them as two separate statements against a live system under READ COMMITTED and they can disagree — that is the read-skew anomaly, and it is why reconciliation runs in a repeatable-read transaction.' }
],
body: [
 { h: 'ACID', html:
   '<table><thead><tr><th>Property</th><th>Guarantee</th></tr></thead><tbody>' +
   '<tr><td><b>Atomicity</b></td><td>All statements commit or none do</td></tr>' +
   '<tr><td><b>Consistency</b></td><td>Constraints hold before and after</td></tr>' +
   '<tr><td><b>Isolation</b></td><td>Concurrent transactions do not corrupt each other</td></tr>' +
   '<tr><td><b>Durability</b></td><td>A committed write survives a crash</td></tr>' +
   '</tbody></table>' +
   '<p>Isolation is the only one with a dial. The others are on or off; isolation is a spectrum you trade against throughput.</p>' },
 { h: 'The anomalies and the levels', html:
   '<table><thead><tr><th>Level</th><th>Dirty read</th><th>Non-repeatable read</th><th>Phantom</th></tr></thead><tbody>' +
   '<tr><td>READ UNCOMMITTED</td><td>Possible</td><td>Possible</td><td>Possible</td></tr>' +
   '<tr><td>READ COMMITTED</td><td>No</td><td>Possible</td><td>Possible</td></tr>' +
   '<tr><td>REPEATABLE READ</td><td>No</td><td>No</td><td>Possible*</td></tr>' +
   '<tr><td>SERIALIZABLE</td><td>No</td><td>No</td><td>No</td></tr>' +
   '</tbody></table>' +
   '<p>*MySQL InnoDB\u2019s REPEATABLE READ prevents phantoms in practice via next-key locking, which is a common interview follow-up.</p>' +
   '<div class="pre">dirty read          <i>you see another transaction\u2019s uncommitted write</i>\nnon-repeatable read <i>you read a row twice and it changed</i>\nphantom read        <i>you run a range query twice and new rows appeared</i>\nlost update         <i>two read-modify-writes, one silently overwrites the other</i></div>' },
 { h: 'The defaults differ, and it matters', html:
   '<table><thead><tr><th>System</th><th>Default</th></tr></thead><tbody>' +
   '<tr><td>PostgreSQL, Oracle, SQL Server</td><td>READ COMMITTED</td></tr>' +
   '<tr><td>MySQL InnoDB</td><td>REPEATABLE READ</td></tr>' +
   '<tr><td>Iceberg / Delta / Hudi tables</td><td>Snapshot isolation</td></tr>' +
   '</tbody></table>' +
   '<p>Reference syntax \u2014 not executable in this bench, which runs single SELECT statements only:</p>' +
   '<div class="pre code">SET TRANSACTION ISOLATION LEVEL REPEATABLE READ;\nBEGIN;\n  SELECT balance FROM accounts WHERE account_id = \'acc-1\' FOR UPDATE;\n  UPDATE accounts SET balance = balance - 100 WHERE account_id = \'acc-1\';\n  INSERT INTO ledger (account_id, delta, idempotency_key) VALUES (\'acc-1\', -100, \'pay-9001\');\nCOMMIT;</div>' },
 { h: 'What this means for a pipeline', html:
   '<p>An extract that runs a long scan under READ COMMITTED sees rows committed <em class="hl">during</em> the scan, so the snapshot is internally inconsistent \u2014 a parent row read before an insert and a child row read after it. Fixes: read under repeatable read or a snapshot, read from a replica pinned to a log position, or use CDC and reconstruct the state from the log. On the lakehouse side, Iceberg and Delta give you snapshot isolation for free, which is precisely why "consistent reads while writes are happening" is one of the standard arguments for a table format.</p>' }
],
call: '"Isolation level determines what a long-running extract can see mid-scan \u2014 under READ COMMITTED a single query can read a parent before an insert and its child after it, so the snapshot is internally inconsistent. That is why I read under snapshot isolation or take the change log instead."',
warn: 'Transaction control is not executable in this bench: it runs one SELECT at a time against fixed data, on purpose. Do not take the examples here as a demonstration of concurrency — they show the data states the anomalies leave behind. The concurrency itself has to be reasoned about, or tested against a real engine with two sessions.',
qf: [
 ['What does ACID stand for?', 'Atomicity, Consistency, Isolation, Durability.'],
 ['Name the read anomalies in order of severity.', 'Dirty read, non-repeatable read, phantom read — plus lost update, which is a write anomaly.'],
 ['Which level prevents non-repeatable reads but may allow phantoms?', 'REPEATABLE READ — though MySQL InnoDB blocks phantoms in practice via next-key locks.'],
 ['Default isolation in Postgres vs MySQL?', 'READ COMMITTED in Postgres; REPEATABLE READ in MySQL InnoDB.'],
 ['Why does isolation matter to a data engineer?', 'A long extract under READ COMMITTED produces an internally inconsistent snapshot; snapshot isolation or CDC avoids it.'],
 ['What isolation do Iceberg and Delta provide?', 'Snapshot isolation — readers see one consistent table version while writers commit new ones.']
]});

M.push({
code: 'T2', track: 'Track T · Transactions & concurrency', title: 'Locking, MVCC and optimistic concurrency',
sub: 'Two ways to stop concurrent writers corrupting each other, and when each is right.',
lede: 'Pessimistic concurrency locks the row and makes everyone wait. Optimistic concurrency lets everyone proceed and detects the collision at write time. The second is what you use in a distributed system, in a lakehouse, and in any pipeline where holding a lock across a network call is not acceptable \u2014 and it is expressible entirely in SQL you can write here.',
ex: [
 { t: 'The lost-update setup',
   sql: "SELECT account_id, owner, balance, version\nFROM accounts\nWHERE account_id = 'acc-1'",
   note: 'Two workers both read balance 4200 at version 7, both compute 4200 - 100, both write 4100. One deduction vanishes. Nothing errors. This is the lost update, and it is what both strategies below exist to prevent.' },
 { t: 'The optimistic write, as a predicate',
   sql: "SELECT account_id, balance, version,\n       CASE WHEN version = 7 THEN 'write accepted' ELSE 'CONFLICT - retry' END AS outcome_if_expecting_v7,\n       CASE WHEN version = 6 THEN 'write accepted' ELSE 'CONFLICT - retry' END AS outcome_if_expecting_v6\nFROM accounts\nWHERE account_id = 'acc-1'",
   note: "The whole technique in one column. The update carries WHERE version = <the version I read>; if another writer got there first the version has moved, the update matches zero rows, and the application retries. Zero rows affected is the conflict signal." },
 { t: 'Detecting stale reads across the table',
   sql: "SELECT account_id, owner, version, updated_at,\n       TIMESTAMPDIFF(MINUTE, updated_at, NOW()) AS minutes_since_write,\n       CASE WHEN TIMESTAMPDIFF(MINUTE, updated_at, NOW()) < 60 THEN 'hot - conflict likely'\n            ELSE 'cold' END AS contention\nFROM accounts\nORDER BY version DESC",
   note: 'acc-3 has been written twelve times and most recently 30 minutes ago — a hot row. Version numbers and recency together tell you where optimistic retries will actually cost you, and therefore where a different design is warranted.' },
 { t: 'Idempotency keys: the write-side defence',
   sql: "SELECT l.idempotency_key, COUNT(*) AS posts,\n       ROUND(SUM(l.delta), 2) AS applied,\n       ROUND(MIN(l.delta), 2) AS should_be,\n       CASE WHEN COUNT(*) > 1 THEN 'DUPLICATE - constraint missing' ELSE 'ok' END AS status\nFROM ledger l\nGROUP BY l.idempotency_key\nORDER BY posts DESC, l.idempotency_key",
   note: 'pay-4419 applied twice. A unique index on idempotency_key turns the retry into a harmless constraint violation the caller can ignore, instead of a second deduction. This is the cheapest correctness control in the whole topic.' },
 { t: 'The deadlock-free ordering rule',
   sql: "SELECT account_id, owner FROM accounts\nWHERE account_id IN ('acc-3', 'acc-1')\nORDER BY account_id",
   note: 'Trivial query, important habit: when a transaction must touch several rows, always acquire them in a deterministic order. Two transactions taking acc-1 then acc-3 can never deadlock; one taking them in the opposite order eventually will.' }
],
body: [
 { h: 'Pessimistic versus optimistic', html:
   '<table><thead><tr><th></th><th>Pessimistic (locking)</th><th>Optimistic (versioning)</th></tr></thead><tbody>' +
   '<tr><td>Mechanism</td><td><code>SELECT \u2026 FOR UPDATE</code></td><td><code>WHERE version = :expected</code></td></tr>' +
   '<tr><td>Conflict detected</td><td>Before the work</td><td>At write time</td></tr>' +
   '<tr><td>Waiting writers</td><td>Blocked</td><td>Proceed, may retry</td></tr>' +
   '<tr><td>Deadlock risk</td><td>Yes</td><td>No</td></tr>' +
   '<tr><td>Right for</td><td>High contention, short transactions</td><td>Low contention, distributed systems, long think-time</td></tr>' +
   '</tbody></table>' +
   '<div class="pre code">-- reference only, not executable here\nUPDATE accounts\n   SET balance = balance - 100, version = version + 1, updated_at = NOW()\n WHERE account_id = \'acc-1\'\n   AND version = 7;          <b>0 rows affected = someone beat you = retry</b></div>' },
 { h: 'MVCC in one paragraph', html:
   '<p>Multi-Version Concurrency Control means a write creates a <em class="hl">new version</em> of a row rather than overwriting it, and each transaction reads the version visible as of its snapshot. The consequence people are asked about: <strong>readers never block writers and writers never block readers</strong>. The cost is version accumulation, which is why Postgres needs <code>VACUUM</code> \u2014 and why Iceberg and Delta need <code>expire_snapshots</code> and compaction. It is the same idea at two scales.</p>' },
 { h: 'Deadlocks', html:
   '<p>A deadlock is a cycle: transaction A holds row 1 and wants row 2, B holds row 2 and wants row 1. The database detects the cycle and kills one of them, which surfaces to the application as an error it must retry. Three defences, in order of value:</p>' +
   '<ol><li><strong>Acquire rows in a consistent order</strong> \u2014 a total order makes cycles impossible.</li>' +
   '<li><strong>Keep transactions short</strong> \u2014 never hold a lock across an HTTP call or user think-time.</li>' +
   '<li><strong>Retry with backoff</strong> \u2014 deadlock victims are expected, not exceptional.</li></ol>' },
 { h: 'The lakehouse version', html:
   '<p>Iceberg and Delta are optimistic by construction. A writer reads the current snapshot, stages new files, and atomically swaps the metadata pointer <em class="hl">only if</em> the snapshot has not moved. If another writer committed first, the commit fails and the job retries \u2014 the same <code>WHERE version = :expected</code> pattern, applied to table metadata instead of a row. That is the sentence to have ready when someone asks how concurrent writes work on object storage.</p>' }
],
call: '"Optimistic concurrency carries the version I read into the WHERE clause, so a conflicting write matches zero rows and the job retries \u2014 that is exactly how Iceberg and Delta commit, swapping the metadata pointer only if the snapshot has not moved."',
warn: 'Optimistic concurrency without a bounded retry policy turns a hot row into a livelock: every worker retries, every retry conflicts, throughput collapses while nothing errors. Cap the retries and fall back to a queue or a pessimistic lock for genuinely contended rows.',
qf: [
 ['Pessimistic vs optimistic concurrency?', 'Pessimistic locks up front (SELECT … FOR UPDATE); optimistic detects a version change at write time and retries.'],
 ['What is the conflict signal in optimistic writes?', 'Zero rows affected — the version in the WHERE clause no longer matches.'],
 ['What is MVCC and what does it buy?', 'Writes create new row versions; readers never block writers and writers never block readers. The cost is version cleanup — VACUUM, or expire_snapshots.'],
 ['How do you prevent deadlocks?', 'Acquire rows in a consistent order, keep transactions short, and retry victims with backoff.'],
 ['What is an idempotency key for?', 'A unique constraint that turns a retried write into a harmless constraint violation rather than a duplicate effect.'],
 ['How do Iceberg and Delta handle concurrent writers?', 'Optimistic concurrency on the metadata pointer — commit succeeds only if the snapshot has not moved, otherwise the writer retries.']
]});

M.push({
code: 'R1', track: 'Track R · Reuse & routines', title: 'Views and materialised views',
sub: 'Naming a query so everyone uses the same definition — and when to pay to store the answer.',
lede: 'A view is a stored query with a name. It costs nothing to create, it is the cheapest way to stop five teams computing "active wallet" five different ways, and it is where the semantic layer starts. A materialised view is the same definition with the answer stored \u2014 faster to read, and now something that can be stale.',
ex: [
 { t: 'A view in use',
   sql: "SELECT * FROM v_current_risk ORDER BY wallet_id",
   note: 'This bench has two real views registered. v_current_risk hides the SCD Type 2 filter, so consumers never have to remember that is_current = 1 is the rule — and if the model changes to valid_to-based filtering, one definition changes rather than every query.' },
 { t: 'Views compose like tables',
   sql: "SELECT a.wallet_id, a.chain, a.out_txns, a.out_volume, r.risk_band, r.since\nFROM v_wallet_activity a\nJOIN v_current_risk r ON r.wallet_id = a.wallet_id\nWHERE a.out_volume > 0\nORDER BY a.out_volume DESC",
   note: 'Two views joined as if they were tables. The engine inlines both definitions and plans the whole thing as one query — a view is not a materialisation boundary unless you make it one.' },
 { t: 'The definition, spelled out',
   sql: "SELECT w.wallet_id, w.chain, w.risk_band,\n       COUNT(t.txn_id) AS out_txns,\n       COALESCE(ROUND(SUM(t.amount_usd), 2), 0) AS out_volume,\n       MAX(t.ts) AS last_sent\nFROM wallets w\nLEFT JOIN transfers t ON t.src_wallet = w.wallet_id\nGROUP BY w.wallet_id, w.chain, w.risk_band\nORDER BY out_volume DESC",
   note: 'This is exactly what v_wallet_activity contains. Compare the output with SELECT * FROM v_wallet_activity — identical, because a view is substitution, not storage.' },
 { t: 'Filtering through a view, and why it is usually fine',
   sql: "SELECT wallet_id, chain, out_txns, out_volume\nFROM v_wallet_activity\nWHERE chain = 'ethereum' AND out_volume > 1000\nORDER BY out_volume DESC",
   note: 'The predicate is pushed into the view definition by the optimiser, so this does not compute every wallet and then filter. The exception is a view containing a window function or DISTINCT, where pushdown is blocked and the whole thing must be computed first.' }
],
body: [
 { h: 'View, materialised view, table', html:
   '<table><thead><tr><th></th><th>View</th><th>Materialised view</th><th>Table</th></tr></thead><tbody>' +
   '<tr><td>Stores data</td><td>No</td><td>Yes</td><td>Yes</td></tr>' +
   '<tr><td>Always current</td><td><b>Yes</b></td><td>As of last refresh</td><td>As of last load</td></tr>' +
   '<tr><td>Read cost</td><td>Re-runs the query</td><td>A scan</td><td>A scan</td></tr>' +
   '<tr><td>Write cost</td><td>None</td><td>Refresh</td><td>Full pipeline</td></tr>' +
   '<tr><td>Can be indexed</td><td>No</td><td>Yes</td><td>Yes</td></tr>' +
   '</tbody></table>' +
   '<div class="pre code">CREATE VIEW v_current_risk AS\nSELECT wallet_id, risk_band, valid_from AS since\nFROM dim_wallet WHERE is_current = 1;\n\nCREATE MATERIALIZED VIEW mv_daily_volume AS\nSELECT DATE_TRUNC(\'DAY\', ts) AS d, src_wallet, SUM(amount_usd) AS vol\nFROM transfers GROUP BY 1, 2;\n\nREFRESH MATERIALIZED VIEW CONCURRENTLY mv_daily_volume;   <i>Postgres</i></div>' +
   '<p>Not executable here \u2014 the bench is read-only, so its two views are registered at load rather than created by DDL.</p>' },
 { h: 'When a materialised view is the right answer', html:
   '<ul>' +
   '<li>The aggregate is expensive and read far more often than the data changes.</li>' +
   '<li>Staleness measured in minutes or hours is acceptable to the consumer \u2014 <em class="hl">get that in writing</em>, because it is the entire trade.</li>' +
   '<li>You need an index on the result, which a plain view cannot have.</li>' +
   '</ul>' +
   '<p>If the refresh is expensive and incremental refresh is unsupported for your query shape, you have re-invented a batch pipeline with worse observability. At that point build the table properly, in the orchestrator, with quality gates.</p>' },
 { h: 'Views as the contract layer', html:
   '<p>The valuable use in a warehouse is <strong>decoupling</strong>: consumers query views, you reshape the physical tables underneath, and nothing downstream breaks. It is also where row and column security lives \u2014 a view that filters by region, or omits a PII column, is the simplest access control there is, and in Lake Formation it is expressed as a governed table or data filter rather than a view, but the intent is identical.</p>' +
   '<p>The cost is invisibility: a five-deep view stack produces a plan nobody can read and a scan nobody expected. Two or three levels is a design; six is technical debt.</p>' }
],
call: '"Views give me one definition of a business concept and a decoupling layer between physical tables and consumers, so I can reshape storage without breaking anyone. I materialise only when the read-to-change ratio justifies it and the consumer has agreed a staleness budget."',
warn: 'A view containing a window function, DISTINCT or a LIMIT blocks predicate pushdown: filtering the view computes the whole thing first and then discards. That is the case where an innocuous-looking WHERE clause scans the entire table.',
qf: [
 ['What is a view?', 'A named stored query — substitution, not storage, so it is always current.'],
 ['View vs materialised view?', 'The materialised one stores the result: faster reads, can be indexed, but stale between refreshes.'],
 ['When should you materialise?', 'When the aggregate is expensive, reads far outnumber changes, and the consumer accepts a stated staleness budget.'],
 ['What blocks predicate pushdown into a view?', 'Window functions, DISTINCT and LIMIT — the view must be fully computed before filtering.'],
 ['What is the architectural value of views?', 'Decoupling consumers from physical tables, one definition per business concept, and a place for row/column security.'],
 ['What is the risk?', 'Deep view stacks produce unreadable plans and unexpected scans.']
]});

M.push({
code: 'R2', track: 'Track R · Reuse & routines', title: 'Stored procedures, functions and UDFs',
sub: 'Logic that lives in the database — and the strong reasons a data platform mostly avoids it.',
lede: 'Every database can hold procedural code. The interview question is rarely the syntax; it is whether you know why a modern data platform keeps transformation logic in version-controlled SQL and orchestration rather than in database routines \u2014 and the narrow cases where a routine is still the right call.',
ex: [
 { t: 'The logic a routine would wrap',
   sql: "SELECT w.wallet_id, w.risk_band,\n       COUNT(t.txn_id) AS txns,\n       ROUND(COALESCE(SUM(t.amount_usd), 0), 2) AS volume,\n       SUM(CASE WHEN t.amount_usd >= 9000 THEN 1 ELSE 0 END) AS near_threshold,\n       CASE WHEN SUM(CASE WHEN t.amount_usd >= 9000 THEN 1 ELSE 0 END) >= 2 THEN 'ESCALATE'\n            WHEN COALESCE(SUM(t.amount_usd), 0) > 10000 THEN 'REVIEW'\n            ELSE 'CLEAR' END AS disposition\nFROM wallets w\nLEFT JOIN transfers t ON t.src_wallet = w.wallet_id\nGROUP BY w.wallet_id, w.risk_band\nORDER BY volume DESC",
   note: 'A scoring rule as set-based SQL. Wrapped in a procedure this becomes score_wallets(); left as SQL it is testable, diffable in a pull request, and runs identically on Athena and Spark. The second option is almost always better.' },
 { t: 'Parameterisation without a routine',
   sql: "WITH params AS (SELECT 9000 AS threshold, 2 AS min_hits)\nSELECT t.src_wallet,\n       COUNT(*) AS near_threshold_txns,\n       p.threshold, p.min_hits,\n       CASE WHEN COUNT(*) >= p.min_hits THEN 'ESCALATE' ELSE 'monitor' END AS disposition\nFROM transfers t CROSS JOIN params p\nWHERE t.amount_usd >= p.threshold\nGROUP BY t.src_wallet, p.threshold, p.min_hits\nORDER BY near_threshold_txns DESC",
   note: 'A parameters CTE gives you named, single-source constants without leaving SQL. In dbt these become variables; in Airflow, templated values. The rule stays declarative and the thresholds stay visible in the query text.' },
 { t: 'What a scalar UDF would replace',
   sql: "SELECT amount_usd,\n       CASE WHEN amount_usd >= 9000 THEN 'near-threshold'\n            WHEN amount_usd >= 1000 THEN 'large'\n            WHEN amount_usd >= 100  THEN 'medium'\n            ELSE 'small' END AS size_band\nFROM transfers\nORDER BY amount_usd DESC",
   note: 'A three-line CASE. As a scalar UDF it would be called once per row and, in most engines, block the optimiser from inlining or vectorising it — the same argument as avoiding Python UDFs in Spark, for the same reason.' },
 { t: 'Set-based beats row-by-row',
   sql: "SELECT src_wallet,\n       COUNT(*) AS txns,\n       ROUND(SUM(amount_usd), 2) AS volume,\n       ROUND(AVG(amount_usd), 2) AS avg_txn,\n       MAX(amount_usd) AS largest\nFROM transfers\nGROUP BY src_wallet\nORDER BY volume DESC",
   note: 'One statement, one pass. The procedural equivalent — a cursor looping wallets and running a query each — returns the same answer and is orders of magnitude slower. "Set-based, not row-based" is the phrase to use.' }
],
body: [
 { h: 'The three kinds of routine', html:
   '<table><thead><tr><th>Kind</th><th>Returns</th><th>Main risk</th></tr></thead><tbody>' +
   '<tr><td>Stored procedure</td><td>Nothing, or a result set</td><td>Business logic outside version control</td></tr>' +
   '<tr><td>Scalar UDF</td><td>One value per call</td><td>Per-row invocation; blocks optimisation</td></tr>' +
   '<tr><td>Table-valued function</td><td>A result set</td><td>Better \u2014 inlinable if written as one SELECT</td></tr>' +
   '</tbody></table>' +
   '<div class="pre code">-- reference only, not executable in this bench\nCREATE PROCEDURE score_wallets(IN threshold DECIMAL(12,2))\nBEGIN\n  SELECT src_wallet, COUNT(*) AS hits\n  FROM transfers WHERE amount_usd &gt;= threshold\n  GROUP BY src_wallet;\nEND;\n\nCREATE FUNCTION size_band(amt DECIMAL) RETURNS VARCHAR(20)\n  DETERMINISTIC\n  RETURN CASE WHEN amt &gt;= 9000 THEN \'near-threshold\' ELSE \'other\' END;</div>' },
 { h: 'Why data platforms avoid them', html:
   '<ol>' +
   '<li><strong>Version control.</strong> A procedure lives in the database. Which version is in production, who changed it, and what did the diff look like? dbt models and SQL files in git answer all three.</li>' +
   '<li><strong>Testability.</strong> A pure SELECT can be run against fixtures. A procedure with side effects needs a live database.</li>' +
   '<li><strong>Portability.</strong> Procedural dialects are entirely engine-specific \u2014 T-SQL, PL/pgSQL, PL/SQL share nothing. Athena and most lakehouse engines have no procedural language at all.</li>' +
   '<li><strong>Optimiser opacity.</strong> A scalar UDF is a black box the planner cannot see into or reorder.</li>' +
   '<li><strong>Observability.</strong> Logic inside a routine does not appear in lineage graphs, so nobody downstream knows it exists.</li>' +
   '</ol>' },
 { h: 'When a routine is still right', html:
   '<ul>' +
   '<li><strong>Genuinely iterative algorithms</strong> a recursive CTE cannot express \u2014 rare in analytics.</li>' +

<script>

'use strict';

function renderResult(host, meta, sql){

function wireModule(m){

/* ---------- scratchpad ---------- */

      '<div class="row"><button class="btn pri" id="x0-run">Run &#9654;</button>' +

function wireScratch(){

/* ---------- rail ---------- */
function pad2(n){ return String(n).length < 2 ? '0' + n : String(n); }

/* ---------- router ---------- */
function buildPager(i){
  var host = mods[i], p = host.querySelector('.pager');
  if(!p){ p = document.createElement('div'); p.className = 'pager'; host.appendChild(p); }
  p.innerHTML = '';
  function mk(j, dir){
    var b = document.createElement('button');
    b.className = 'pg' + (dir === 'next' ? ' nx' : '');
    if(j < 0 || j >= mods.length){ b.disabled = true; b.innerHTML = '<span>' + dir + '</span><b>—</b>'; }
    else {
      b.innerHTML = '<span>' + dir + ' · ' + mods[j].getAttribute('data-code') + '</span><b>' +
        esc(mods[j].getAttribute('data-t')) + '</b>';
      b.addEventListener('click', function(){ go(j); });
    }
    return b;
  }
  p.appendChild(mk(i - 1, 'previous'));
  p.appendChild(mk(i + 1, 'next'));
  if(!host.querySelector('.kbd')){
    var k = document.createElement('div'); k.className = 'kbd';

  }

var wired = {};
function go(i){
  if(i < 0 || i >= mods.length) return;
  cur = i;
  mods.forEach(function(m, j){ m.classList.toggle('on', j === i); });
  navBtns.forEach(function(b, j){ b.classList.toggle('on', j === i); });
  var code = mods[i].getAttribute('data-code');
  if(!wired[code]){
    wired[code] = true;
    if(code === 'X0') wireScratch();
    else { var m = MODS.filter(function(x){ return x.code === code; })[0]; if(m) wireModule(m); }
  }
  $('topLab').textContent = mods[i].getAttribute('data-grp') || '';
  $('topN').textContent = code + ' · ' + pad2(i + 1) + ' / ' + pad2(mods.length);
  $('tape').style.width = ((i + 1) / mods.length * 100) + '%';
  $('btnDone').classList.toggle('on', !!doneSet[code]);
  buildPager(i);
  window.scrollTo(0, 0);
  railOpen(false);

    try { history.replaceState(null, '', '#' + mods[i].id); } catch(e){ location.hash = mods[i].id; }

/* ---------- full-text search ---------- */
var SEARCH_IDX = [];
function buildSearchIndex(){
  MODS.forEach(function(m){
    var body = m.body.map(function(b){ return (b.h || '') + ' ' + b.html.replace(/<[^>]+>/g, ' '); }).join(' ');
    var ex = m.ex.map(function(e){ return e.t + ' ' + e.sql + ' ' + e.note; }).join(' ');
    SEARCH_IDX.push({ code:m.code, title:m.title, track:m.track,
      text:(m.title + ' ' + m.sub + ' ' + m.lede.replace(/<[^>]+>/g,' ') + ' ' + ex + ' ' + body + ' ' +
            m.call + ' ' + (m.warn||'') + ' ' + m.qf.map(function(p){ return p[0] + ' ' + p[1]; }).join(' ')).replace(/<[^>]+>/g,' ') });
    m.qf.forEach(function(p){ SEARCH_IDX.push({ code:m.code, title:p[0], track:m.track + ' · quick-fire', text:p[0] + ' ' + p[1], qa:p }); });
  });
}
function runSearch(){
  var q = $('srIn').value.trim().toLowerCase(), box = $('srRes');
  if(q.length < 2){ box.innerHTML = '<div class="hint">Type at least two characters. Searches every module, example, query and quick-fire answer.</div>'; return; }
  var hits = [];
  SEARCH_IDX.forEach(function(e){
    var i = e.text.toLowerCase().indexOf(q);
    if(i >= 0) hits.push({ e:e, i:i, score:(e.title.toLowerCase().indexOf(q) >= 0 ? 0 : 1) });
  });
  hits.sort(function(a,b){ return a.score - b.score || a.i - b.i; });
  if(!hits.length){ box.innerHTML = '<div class="hint">No match.</div>'; return; }
  box.innerHTML = hits.slice(0, 40).map(function(h){
    var t = h.e.text, s = Math.max(0, h.i - 60), snip = t.slice(s, h.i + 120).replace(/\s+/g,' ');
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    return '<button class="sr" data-code="' + h.e.code + '"><em>' + esc(h.e.track) + ' · ' + esc(h.e.code) + '</em>' +
      '<b>' + esc(h.e.title) + '</b><span>' + esc(snip).replace(re, '<mark>$1</mark>') + '…</span></button>';
  }).join('');
  [].slice.call(box.querySelectorAll('.sr')).forEach(function(b){
    b.addEventListener('click', function(){
      var code = b.getAttribute('data-code');
      for(var j = 0; j < mods.length; j++) if(mods[j].getAttribute('data-code') === code){ go(j); break; }
      ovl('srOvl', false);
    });
  });
}

/* ---------- drill ---------- */

  DRILL = [];

  for(var i = DRILL.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = DRILL[i]; DRILL[i] = DRILL[j]; DRILL[j] = t; }

    '<div class="drl-bar"><i style="width:' + ((di + 1) / DRILL.length * 100) + '%"></i></div>' +
    '<div class="drl-src">' + esc(d.src) + ' · ' + (di + 1) + ' of ' + DRILL.length + '</div>' +
    '<div class="drl-q">' + esc(d.q) + '</div>' +
    (shown ? '<div class="drl-a">' + esc(d.a) + '</div>' : '') +
    '<div class="orow">' +
      '<button class="obtn pri" id="drlShow">' + (shown ? 'Hide answer' : 'Show answer') + '</button>' +
      '<button class="obtn" id="drlNext">Next →</button>' +
      '<button class="obtn" id="drlJump">Open module</button>' +
      '<button class="obtn" id="drlShuf">Reshuffle</button>' +

  $('drlNext').addEventListener('click', function(){ di = (di + 1) % DRILL.length; shown = false; renderDrill(); });
  $('drlShuf').addEventListener('click', buildDrill);
  $('drlJump').addEventListener('click', function(){
    var code = d.src.split(' · ')[0];
    for(var j = 0; j < mods.length; j++) if(mods[j].getAttribute('data-code') === code){ go(j); break; }
    ovl('drlOvl', false);
  });
}

/* ---------- overlays ---------- */
function ovl(id, v){
  var el = $(id);
  el.classList.toggle('open', v);
  if(v && id === 'srOvl') setTimeout(function(){ $('srIn').focus(); $('srIn').select(); }, 30);
}

/* ---------- boot ---------- */
function boot(){
  buildRail();
  buildSearchIndex();
  wireFilter();

  $('burger').addEventListener('click', function(){ railOpen(!$('rail').classList.contains('open')); });
  $('scrim').addEventListener('click', function(){ railOpen(false); });

  $('btnSearch').addEventListener('click', function(){ ovl('srOvl', true); runSearch(); });
  $('srIn').addEventListener('input', runSearch);
  $('srX').addEventListener('click', function(){ ovl('srOvl', false); });
  $('btnDrill').addEventListener('click', function(){ ovl('drlOvl', true); if(!DRILL.length) buildDrill(); });
  $('drlX').addEventListener('click', function(){ ovl('drlOvl', false); });
  $('btnDone').addEventListener('click', function(){
    var code = mods[cur].getAttribute('data-code');
    doneSet[code] = !doneSet[code];
    navBtns[cur].classList.toggle('ok', !!doneSet[code]);
    $('btnDone').classList.toggle('on', !!doneSet[code]);
  });

  document.addEventListener('keydown', function(e){
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea';
    if(e.key === 'Escape'){ ovl('srOvl', false); ovl('drlOvl', false); return; }
    if(typing) return;
    if(e.key === '/'){ e.preventDefault(); ovl('srOvl', true); runSearch(); return; }
    if(e.key === 'd' || e.key === 'D'){ ovl('drlOvl', true); if(!DRILL.length) buildDrill(); return; }
    if(e.key === 'ArrowLeft') go(cur - 1);
    if(e.key === 'ArrowRight') go(cur + 1);
  });

  var start = 0;
  if(location.hash){
    var want = location.hash.slice(1).toLowerCase();
    for(var j = 0; j < mods.length; j++) if(mods[j].id === want){ start = j; break; }
  }
  go(start);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
</html>
