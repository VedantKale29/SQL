<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Bench — Vedant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070B14; --panel:#0F1626; --panel-2:#162033; --panel-3:#1B2740;
  --line:#223049; --line-soft:#1A2438;
  --text:#E4EBF5; --muted:#8496B0; --dim:#6C7F9C;
  --signal:#2FD8C6; --signal-soft:rgba(47,216,198,.10); --signal-line:rgba(47,216,198,.32);
  --flag:#F2B33D; --flag-soft:rgba(242,179,61,.10); --flag-line:rgba(242,179,61,.34);
  --wire:#7C9CF5; --wire-soft:rgba(124,156,245,.12);
  --alert:#FF7A7A; --ok:#56E39F; --violet:#B79CF7;
  --r:10px; --sb:296px;
  --d:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-weight:300;font-size:15.5px;line-height:1.68;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(900px 520px at 78% -8%, rgba(47,216,198,.055), transparent 62%),
    radial-gradient(760px 480px at 4% 102%, rgba(124,156,245,.05), transparent 60%),
    linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px) 0 0/100% 44px;}
::selection{background:rgba(47,216,198,.26)}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600;line-height:1.2;letter-spacing:-.015em}
a{color:var(--signal)}

/* shell */
.app{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh;position:relative}
.scrim{display:none;position:fixed;inset:0;background:rgba(4,7,13,.66);z-index:39;backdrop-filter:blur(2px)}
.scrim.open{display:block}
.rail{position:fixed;inset:0 auto 0 0;width:var(--sb);height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:contain;
  background:linear-gradient(180deg,#0A1120,#080D18);
  border-right:1px solid var(--line);overflow-y:auto;z-index:40;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;display:flex;flex-direction:column}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.brand{padding:22px 20px 15px;border-bottom:1px solid var(--line-soft)}
.brand b{display:block;font-family:'Space Grotesk';font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.brand b i{color:var(--signal);font-style:normal}
.brand span{display:block;font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.18em;color:var(--dim);margin-top:5px;text-transform:uppercase}
.find{padding:13px 14px 4px;position:sticky;top:0;background:linear-gradient(180deg,#0A1120 72%,transparent);z-index:2}
.find input{width:100%;background:#0A101C;border:1px solid var(--line);border-radius:8px;color:var(--text);
  font-family:'IBM Plex Mono';font-size:12px;padding:8px 11px;outline:none;transition:border-color .16s,box-shadow .16s}
.find input:focus{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.find input::placeholder{color:var(--dim)}
nav{flex:1}
.grp{padding:14px 14px 2px}
.grp.hide{display:none}
.grp-t{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;
  padding:0 8px 8px;display:flex;align-items:center;gap:8px}
.grp-t::after{content:'';flex:1;height:1px;background:var(--line-soft)}
.grp-t u{text-decoration:none;color:var(--line);letter-spacing:.06em}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font-family:'IBM Plex Sans';font-size:13.4px;font-weight:400;
  cursor:pointer;transition:background .16s,color .16s;position:relative;line-height:1.35}
.nv:hover{background:rgba(255,255,255,.035);color:var(--text)}
.nv em{font-family:'IBM Plex Mono';font-style:normal;font-size:10.5px;color:var(--dim);min-width:24px;letter-spacing:.04em;transition:color .16s}
.nv.on{background:var(--signal-soft);color:#fff;font-weight:500}
.nv.on em{color:var(--signal)}
.nv.on::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:19px;
  background:var(--signal);border-radius:0 3px 3px 0;box-shadow:0 0 12px var(--signal)}
.nv.done em{color:var(--signal)}
.nv.hide{display:none}
.nv.ok>em{color:var(--ok)}
.nv.ok>em::after{content:'✓';margin-left:3px;font-style:normal}
.rail-f{padding:16px 22px 26px;font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);line-height:1.8;border-top:1px solid var(--line-soft)}
.rail-f b{color:var(--signal);font-weight:500}

/* top bar */
.stage{grid-column:2;min-width:0}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:13px 40px;
  background:rgba(7,11,20,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.burger{display:none;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 9px;cursor:pointer;font-size:14px}
.top-lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape{flex:1;height:3px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:60px}
.tape i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--wire),var(--signal));border-radius:3px;
  transition:width .45s var(--d);box-shadow:0 0 10px rgba(47,216,198,.55)}
.top-n{font-family:'IBM Plex Mono';font-size:11px;color:var(--signal);white-space:nowrap}
.top-acts{display:flex;gap:6px;margin-left:auto;align-items:center}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 10px;cursor:pointer;
  font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;display:flex;align-items:center;gap:6px;min-height:32px;
  transition:border-color .15s,color .15s}
.tbtn:hover{border-color:var(--signal);color:var(--text)}
.tbtn.on{border-color:var(--ok);color:var(--ok);background:rgba(86,227,159,.08)}
.tbtn kbd{font:400 9px/1 'IBM Plex Mono',monospace;opacity:.5;border:1px solid var(--line);border-radius:3px;padding:2px 4px}

/* module */
.mod{display:none;padding:38px 40px 90px;max-width:1120px}
.mod.on{display:block;animation:in .42s var(--d)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--signal);
  display:flex;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow::after{content:'';flex:1;max-width:120px;height:1px;background:var(--signal-line)}
.mod h1{font-size:clamp(28px,4.4vw,40px);margin-bottom:12px}
.mod h1 small{display:block;font-size:13px;font-weight:400;color:var(--dim);font-family:'IBM Plex Mono';letter-spacing:.05em;margin-top:9px;line-height:1.6}
.lede{font-size:17px;color:#B9C7DA;font-weight:300;max-width:76ch;margin-bottom:30px}
.mod h2{font-size:19px;margin:34px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.mod h2::before{content:'';width:6px;height:6px;background:var(--signal);border-radius:2px;transform:rotate(45deg);flex:none}
.mod h3{font-size:15px;color:var(--signal);margin:22px 0 8px;font-weight:600}
.mod p{max-width:78ch;margin-bottom:13px;color:#C4D0E0}
.mod ul,.mod ol{max-width:78ch;margin:0 0 15px 20px;color:#C4D0E0}
.mod li{margin-bottom:7px}
.mod li::marker{color:var(--signal)}
strong{color:#fff;font-weight:600}
em.hl{font-style:normal;color:var(--flag)}
code{font-family:'IBM Plex Mono';font-size:.87em;background:var(--panel-2);border:1px solid var(--line);padding:1.5px 6px;border-radius:5px;color:var(--signal)}

/* bench panel */
.bench{background:linear-gradient(180deg,var(--panel),#0C1322);border:1px solid var(--line);border-radius:var(--r);
  margin:22px 0 26px;position:relative;overflow:hidden;box-shadow:0 18px 44px -26px rgba(0,0,0,.9)}
.bench::before,.bench::after{content:'';position:absolute;width:11px;height:11px;border:1.5px solid var(--signal-line);pointer-events:none}
.bench::before{top:46px;left:0;border-right:0;border-bottom:0}
.bench::after{bottom:0;right:0;border-left:0;border-top:0}
.bh{display:flex;align-items:center;gap:10px;padding:11px 16px;background:linear-gradient(90deg,rgba(47,216,198,.07),transparent);
  border-bottom:1px solid var(--line);font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--signal)}
.bh h5{font-family:'IBM Plex Mono';font-size:10px;font-weight:500;letter-spacing:.15em}
.bh .dot{width:6px;height:6px;border-radius:50%;background:var(--signal);box-shadow:0 0 9px var(--signal);animation:pulse 2.4s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
.bh .tag{margin-left:auto;color:var(--dim);letter-spacing:.1em;text-transform:none;font-size:9.5px}
.bb{padding:16px}

/* SQL editor */
.sqlbox{width:100%;background:#080E19;border:1px solid var(--line);border-left:2px solid var(--wire);border-radius:7px;
  color:#C8D6EA;font-family:'IBM Plex Mono';font-size:12.6px;line-height:1.66;padding:12px 14px;outline:none;resize:vertical;
  min-height:70px;tab-size:2;transition:border-color .16s}
.sqlbox:focus{border-color:var(--signal);border-left-color:var(--signal)}
.btn{background:var(--panel-3);border:1px solid var(--line);color:var(--text);padding:8px 15px;border-radius:8px;cursor:pointer;
  font-family:'IBM Plex Mono';font-size:11.5px;letter-spacing:.06em;transition:all .16s;white-space:nowrap}
.btn:hover{border-color:var(--signal);color:var(--signal);background:var(--signal-soft)}
.btn:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.btn.pri{background:var(--signal-soft);border-color:var(--signal-line);color:var(--signal)}
.btn.pri:hover{background:rgba(47,216,198,.2)}
.btn.sm{padding:5px 10px;font-size:10.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:11px 0}
.row.end{margin-bottom:0}
.meta{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-left:auto}
.meta b{color:var(--signal);font-weight:500}
.meta.bad b{color:var(--alert)}

/* result grid */
.out{margin-top:4px}
.rwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line-soft);border-radius:8px;background:#0A101C}
table.res{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono';font-size:12.2px;margin:0}
table.res th{background:var(--panel-2);color:var(--signal);font-size:9.8px;letter-spacing:.12em;text-transform:uppercase;
  text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap;position:sticky;top:0}
table.res td{padding:7px 11px;border-bottom:1px solid var(--line-soft);color:#C4D0E0;white-space:nowrap}
table.res tbody tr:last-child td{border-bottom:0}
table.res tbody tr:nth-child(odd){background:rgba(124,156,245,.032)}
table.res tbody tr:hover{background:var(--signal-soft)}
table.res td.n{text-align:right;color:#DCE4F0}
table.res td.null{color:var(--dim);font-style:italic}
.err{border:1px solid rgba(255,122,122,.4);border-left:2px solid var(--alert);background:rgba(255,122,122,.07);
  border-radius:7px;padding:11px 13px;font-family:'IBM Plex Mono';font-size:12px;color:#FFC2C2;white-space:pre-wrap}
.zero{font-family:'IBM Plex Mono';font-size:12px;color:var(--flag);border:1px dashed var(--flag-line);
  border-radius:7px;padding:11px 13px;background:var(--flag-soft)}

/* narrative / code */
.pre{font-family:'IBM Plex Mono';font-size:12.4px;background:#080E19;border:1px solid var(--line-soft);
  border-left:2px solid var(--signal);border-radius:7px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;
  color:#B9C7DA;line-height:1.66;margin:12px 0;overflow-x:auto}
.pre.code{border-left-color:var(--wire);color:#C8D6EA}
.pre.note{border-left-color:var(--flag);white-space:normal;font-family:'IBM Plex Sans';font-size:13.6px;color:#B9C7DA}
.pre b{color:var(--flag);font-weight:500}
.pre i{font-style:normal;color:var(--ok)}
.pre u{text-decoration:none;color:var(--alert)}

/* tables in prose */
.mod table:not(.res){width:100%;border-collapse:collapse;margin:14px 0;font-size:13.4px}
.mod table:not(.res) th{background:var(--panel-2);color:var(--signal);font-family:'IBM Plex Mono';font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:500}
.mod table:not(.res) td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:#C4D0E0;vertical-align:top}
.mod table:not(.res) tbody tr:nth-child(odd){background:rgba(124,156,245,.032)}
.mod table:not(.res) tbody tr:hover{background:var(--signal-soft)}

/* callouts */
.call{border:1px solid var(--flag-line);border-left:3px solid var(--flag);background:var(--flag-soft);border-radius:8px;
  padding:14px 16px;margin:20px 0;max-width:82ch}
.call h4{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--flag);margin-bottom:7px;font-weight:500}
.call p{color:#DCE4F0;margin:0;font-size:14.4px;max-width:none}
.call.warn{border-color:rgba(255,122,122,.34);border-left-color:var(--alert);background:rgba(255,122,122,.07)}
.call.warn h4{color:var(--alert)}

/* quick fire */
.qf{border:1px solid var(--line);border-radius:var(--r);margin:26px 0 8px;background:var(--panel);overflow:hidden}
.qf>summary{padding:13px 16px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;
  font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--flag)}
.qf>summary::-webkit-details-marker{display:none}
.qf>summary::before{content:'▸';color:var(--flag);transition:transform .2s;display:inline-block}
.qf[open]>summary::before{transform:rotate(90deg)}
.qf>summary:hover{background:var(--flag-soft)}
.qfb{padding:4px 16px 16px;border-top:1px solid var(--line)}
.qa{padding:11px 0;border-bottom:1px dashed var(--line-soft)}
.qa:last-child{border:0}
.qa q{display:block;color:#fff;font-weight:500;font-size:14px;quotes:none}
.qa q::before{content:'Q. ';color:var(--flag);font-family:'IBM Plex Mono';font-size:11px}
.qa p{margin:5px 0 0;color:var(--muted);font-size:13.6px;max-width:none}

/* pager */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:38px;padding-top:22px;border-top:1px solid var(--line)}
.pg{flex:1;max-width:320px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;
  cursor:pointer;text-align:left;transition:all .18s;color:var(--text);min-width:0}
.pg:hover{border-color:var(--signal);background:var(--signal-soft);transform:translateY(-2px)}
.pg span{display:block;font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.pg b{font-family:'Space Grotesk';font-size:14.5px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg.nx{text-align:right}
.pg[disabled]{opacity:.28;pointer-events:none}
.kbd{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);letter-spacing:.1em;text-align:center;margin-top:18px}

/* overlays */
.ovl{position:fixed;inset:0;background:rgba(4,7,13,.74);backdrop-filter:blur(3px);z-index:60;display:none;
  align-items:flex-start;justify-content:center;padding:6vh 16px 20px}
.ovl.open{display:flex}
.ovl-card{background:#0C1322;border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.ovl-hd{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line);
  font:500 12.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--text);flex-shrink:0}
.ovl-hd .x{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  width:30px;height:30px;cursor:pointer;font-size:13px;line-height:1}
.ovl-hd .x:hover{border-color:var(--alert);color:var(--alert)}
.ovl-bd{padding:14px 16px 18px;overflow-y:auto;overscroll-behavior:contain}
#srIn{width:100%;background:#080D18;border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--text);
  font-family:inherit;font-size:14.5px;outline:none;margin-bottom:12px}
#srIn:focus{border-color:var(--signal)}
.sr{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;
  padding:9px 11px;margin-bottom:5px;cursor:pointer;color:inherit}
.sr:hover,.sr.sel{background:rgba(47,216,198,.07);border-color:rgba(47,216,198,.30)}
.sr em{display:block;font:400 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.sr b{display:block;font-weight:500;font-size:14px;color:var(--text);line-height:1.4}
.sr span{display:block;font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:3px}
.sr mark{background:rgba(242,179,61,.24);color:var(--flag);border-radius:2px;padding:0 1px}
.hint{color:var(--dim);font-size:13px;line-height:1.6;padding:10px 2px}
.drl-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0 12px}
.drl-bar i{display:block;height:100%;background:var(--signal);width:0;transition:width .3s}
.drl-q{font-size:17px;line-height:1.5;font-weight:500;color:var(--text);margin:14px 0 6px}
.drl-src{font:400 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.drl-a{background:rgba(47,216,198,.06);border-left:2px solid var(--signal);border-radius:0 8px 8px 0;padding:12px 14px;
  font-size:14px;line-height:1.65;color:var(--muted);margin-bottom:14px}
.orow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:4px}
.obtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:8px 13px;cursor:pointer;
  font:500 12px/1 'IBM Plex Sans',sans-serif;min-height:38px}
.obtn:hover{border-color:var(--signal);color:var(--text)}
.obtn.pri{border-color:var(--signal);color:var(--signal)}

/* schema browser */
.sch{margin-bottom:16px}
.sch h4{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin-bottom:6px}
.sch p{font-size:12.8px;color:var(--muted);margin-bottom:7px}
.sch .cols{font-family:'IBM Plex Mono';font-size:11.5px;color:#B9C7DA;background:#080E19;border:1px solid var(--line-soft);
  border-radius:6px;padding:8px 10px;line-height:1.8}
.sch .cols b{color:var(--flag);font-weight:500}

/* mobile */
@media(max-width:760px){
  .mod table:not(.res){display:block;overflow-x:auto;font-size:12.5px}
  .mod h2{font-size:17px} .mod h3{font-size:14px}
  .lede{font-size:15.5px} .mod p,.mod li{font-size:14.5px}
  .pre{font-size:11.4px;padding:10px 11px}
  .sqlbox{font-size:11.8px}
  .bh{flex-wrap:wrap;row-gap:4px} .bh .tag{margin-left:0}
  .call{padding:12px 13px} .qa q{font-size:13.5px} .qa p{font-size:13px}
  .meta{margin-left:0;width:100%}
}
@media(max-width:940px){
  .app{grid-template-columns:1fr}
  .rail{width:min(88vw,300px);transform:translateX(-100%);transition:transform .26s var(--d);box-shadow:none;visibility:hidden}
  .rail.open{transform:none;visibility:visible;box-shadow:0 0 44px rgba(0,0,0,.6)}
  .burger{min-width:44px;min-height:40px;font-size:17px;line-height:1;display:block}
  .stage{grid-column:1}
  .top{padding:12px 18px}
  .mod{padding:26px 18px 70px}
  .top-acts .lbl{display:none}
  .tbtn{padding:5px 8px} .tbtn kbd{display:none}
  .ovl{padding:0}

<script>
/* ============================================================
   MINI-SQL — a real SQL subset interpreter in plain JS.
   No dependencies. Runs in node and in the browser.
   Supports: WITH [RECURSIVE], SELECT [DISTINCT], FROM, INNER/LEFT/
   RIGHT/FULL/CROSS/self joins, WHERE, GROUP BY, HAVING, ORDER BY,
   LIMIT/OFFSET, UNION [ALL], EXCEPT, INTERSECT, CASE, scalar/IN/
   EXISTS/correlated subqueries, aggregate functions, and the full
   window-function family with PARTITION BY / ORDER BY / frames.
   ============================================================ */
(function (root) {
'use strict';

/* ---------- tokenizer ---------- */
function tokenize(sql) {
  var t = [], i = 0, n = sql.length, j, w, s, q, two;
  while (i < n) {
    var c = sql[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '-' && sql[i + 1] === '-') { while (i < n && sql[i] !== '\n') i++; continue; }
    if (c === '#') { while (i < n && sql[i] !== '\n') i++; continue; }
    if (c === '/' && sql[i + 1] === '*') { i += 2; while (i < n && !(sql[i] === '*' && sql[i + 1] === '/')) i++; i += 2; continue; }
    if (c === "'") {
      s = ''; i++;
      while (i < n) {
        if (sql[i] === "'" && sql[i + 1] === "'") { s += "'"; i += 2; }
        else if (sql[i] === "'") { i++; break; }
        else s += sql[i++];
      }
      t.push({ t: 'str', v: s }); continue;
    }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(sql[i + 1] || ''))) {
      j = i; while (j < n && /[0-9.]/.test(sql[j])) j++;
      t.push({ t: 'num', v: parseFloat(sql.slice(i, j)) }); i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      j = i; while (j < n && /[A-Za-z0-9_$]/.test(sql[j])) j++;
      w = sql.slice(i, j);
      t.push({ t: 'id', v: w, u: w.toUpperCase() }); i = j; continue;
    }
    if (c === '`' || c === '"') {
      q = c; j = i + 1; s = '';
      while (j < n && sql[j] !== q) s += sql[j++];
      t.push({ t: 'id', v: s, u: s.toUpperCase(), quoted: true }); i = j + 1; continue;
    }
    two = sql.substr(i, 2);
    if (['<=', '>=', '<>', '!=', '||'].indexOf(two) >= 0) { t.push({ t: 'op', v: two }); i += 2; continue; }
    t.push({ t: 'op', v: c }); i++;
  }
  t.push({ t: 'eof', v: '' });
  return t;
}

var AGGS = ['COUNT', 'SUM', 'AVG', 'MIN', 'MAX', 'GROUP_CONCAT', 'STDDEV'];
var WINONLY = ['ROW_NUMBER', 'RANK', 'DENSE_RANK', 'NTILE', 'LAG', 'LEAD',
               'FIRST_VALUE', 'LAST_VALUE', 'NTH_VALUE', 'PERCENT_RANK', 'CUME_DIST'];
var RESERVED = ['SETS','ROLLUP','CUBE','FROM','WHERE','GROUP','HAVING','ORDER','LIMIT','OFFSET','UNION','EXCEPT',
  'INTERSECT','JOIN','LEFT','RIGHT','INNER','OUTER','FULL','CROSS','ON','USING','AS','AND',
  'OR','NOT','IN','IS','NULL','LIKE','BETWEEN','EXISTS','CASE','WHEN','THEN','ELSE','END',
  'SELECT','DISTINCT','WITH','RECURSIVE','BY','ASC','DESC','OVER','PARTITION','ROWS','RANGE',
  'PRECEDING','FOLLOWING','UNBOUNDED','CURRENT','ROW','INTERVAL','WINDOW','SET','VALUES','DELETE','UPDATE','INSERT','MERGE'];

/* ---------- parser ---------- */
function Parser(sql) {
  this.toks = tokenize(sql);
  this.p = 0;
  this.src = sql;
}
Parser.prototype.peek = function (k) { return this.toks[this.p + (k || 0)]; };
Parser.prototype.next = function () { return this.toks[this.p++]; };
Parser.prototype.isKw = function (u, k) { var t = this.peek(k); return t.t === 'id' && !t.quoted && t.u === u; };
Parser.prototype.isOp = function (v, k) { var t = this.peek(k); return t.t === 'op' && t.v === v; };
Parser.prototype.eatKw = function (u) { if (this.isKw(u)) { this.p++; return true; } return false; };
Parser.prototype.eatOp = function (v) { if (this.isOp(v)) { this.p++; return true; } return false; };
Parser.prototype.err = function (msg) {
  var t = this.peek();
  throw new Error('SQL parse error near "' + (t.v === '' ? '<end>' : t.v) + '": ' + msg);
};
Parser.prototype.wantKw = function (u) { if (!this.eatKw(u)) this.err('expected ' + u); };
Parser.prototype.wantOp = function (v) { if (!this.eatOp(v)) this.err('expected "' + v + '"'); };
Parser.prototype.ident = function () {
  var t = this.peek();
  if (t.t !== 'id') this.err('expected an identifier');
  this.p++; return t.v;
};

Parser.prototype.parseStatement = function () {
  var ctes = [], recursive = false;
  if (this.eatKw('WITH')) {
    if (this.eatKw('RECURSIVE')) recursive = true;
    do {
      var name = this.ident();
      var cols = null;
      if (this.isOp('(') && !this.isKw('SELECT', 1)) {
        this.wantOp('('); cols = [];
        do { cols.push(this.ident()); } while (this.eatOp(','));
        this.wantOp(')');
      }
      this.wantKw('AS');
      this.wantOp('(');
      var body = this.parseSetSelect();
      this.wantOp(')');
      ctes.push({ name: name, cols: cols, body: body });
    } while (this.eatOp(','));
  }
  var sel = this.parseSetSelect();
  sel.ctes = ctes; sel.recursive = recursive;
  if (this.peek().t !== 'eof' && !this.isOp(';')) this.err('unexpected trailing input');
  return sel;
};

Parser.prototype.parseSetSelect = function () {
  var left = this.parseSelect();
  while (this.isKw('UNION') || this.isKw('EXCEPT') || this.isKw('INTERSECT')) {
    var op = this.next().u;
    var all = this.eatKw('ALL');
    if (op !== 'UNION') this.eatKw('DISTINCT');
    var right = this.parseSelect(true);
    left = { type: 'setop', op: op, all: all, left: left, right: right };
  }
  // trailing ORDER BY / LIMIT applies to the whole set operation
  if (left.type === 'setop') {
    if (this.isKw('ORDER')) { this.next(); this.wantKw('BY'); left.orderBy = this.parseOrderList(); }
    if (this.eatKw('LIMIT')) left.limit = this.parseLimit();
  }
  return left;
};

Parser.prototype.parseLimit = function () {
  var a = this.parseExpr();
  if (this.eatKw('OFFSET')) { var b = this.parseExpr(); return { count: a, offset: b }; }
  if (this.eatOp(',')) { var c = this.parseExpr(); return { count: c, offset: a }; }
  return { count: a, offset: null };
};

Parser.prototype.parseOrderList = function () {
  var list = [];
  do {
    var e = this.parseExpr(), dir = 'ASC';
    if (this.eatKw('DESC')) dir = 'DESC'; else this.eatKw('ASC');
    list.push({ expr: e, dir: dir });
  } while (this.eatOp(','));
  return list;
};

Parser.prototype.parseSelect = function (noTail) {
  if (this.eatOp('(')) {
    var inner = this.parseSetSelect();
    this.wantOp(')');
    return inner;
  }
  this.wantKw('SELECT');
  var distinct = false;
  if (this.eatKw('DISTINCT')) distinct = true; else this.eatKw('ALL');
  var items = [];
  do {
    if (this.isOp('*')) { this.next(); items.push({ expr: { k: 'star', tbl: null } }); continue; }
    if (this.peek().t === 'id' && this.isOp('.', 1) && this.isOp('*', 2)) {
      var tb = this.next().v; this.next(); this.next();
      items.push({ expr: { k: 'star', tbl: tb } }); continue;
    }
    var e = this.parseExpr(), alias = null;
    if (this.eatKw('AS')) alias = this.ident();
    else if (this.peek().t === 'id' && RESERVED.indexOf(this.peek().u) < 0) alias = this.ident();
    items.push({ expr: e, alias: alias });
  } while (this.eatOp(','));

  var sel = { type: 'select', distinct: distinct, items: items, from: null, where: null,
              groupBy: null, having: null, orderBy: null, limit: null };
  if (this.eatKw('FROM')) sel.from = this.parseFrom();
  if (this.eatKw('WHERE')) sel.where = this.parseExpr();
  if (this.isKw('GROUP')) {
    this.next(); this.wantKw('BY');
    sel.groupBy = []; sel.groupSpec = null;
    if (this.isKw('ROLLUP') || this.isKw('CUBE')) {
      var kind = this.next().u;
      this.wantOp('('); var cols = [];
      do { cols.push(this.parseExpr()); } while (this.eatOp(','));
      this.wantOp(')');
      sel.groupBy = cols.slice(); sel.groupSpec = { kind: kind, cols: cols };
    } else if (this.isKw('GROUPING') && this.isKw('SETS', 1)) {
      this.next(); this.next();
      this.wantOp('('); var sets = [];
      do {
        this.wantOp('(');
        var one = [];
        if (!this.isOp(')')) { do { one.push(this.parseExpr()); } while (this.eatOp(',')); }
        this.wantOp(')');
        sets.push(one);
      } while (this.eatOp(','));
      this.wantOp(')');
      var all = []; sets.forEach(function (st) { st.forEach(function (c) { all.push(c); }); });
      sel.groupBy = all; sel.groupSpec = { kind: 'SETS', sets: sets };
    } else {
      do { sel.groupBy.push(this.parseExpr()); } while (this.eatOp(','));
      if (this.isKw('WITH') && this.isKw('ROLLUP', 1)) {
        this.next(); this.next();
        sel.groupSpec = { kind: 'ROLLUP', cols: sel.groupBy.slice() };
      }
    }
  }
  if (this.eatKw('HAVING')) sel.having = this.parseExpr();
  if (!noTail) {
    if (this.isKw('ORDER')) { this.next(); this.wantKw('BY'); sel.orderBy = this.parseOrderList(); }
    if (this.eatKw('LIMIT')) sel.limit = this.parseLimit();
  }
  return sel;
};

Parser.prototype.parseFrom = function () {
  var left = this.parseTableRef();
  for (;;) {
    var kind = null;
    if (this.isKw('CROSS') && this.isKw('JOIN', 1)) { this.next(); this.next(); kind = 'CROSS'; }
    else if (this.isKw('INNER') && this.isKw('JOIN', 1)) { this.next(); this.next(); kind = 'INNER'; }
    else if (this.isKw('LEFT')) { this.next(); this.eatKw('OUTER'); this.wantKw('JOIN'); kind = 'LEFT'; }
    else if (this.isKw('RIGHT')) { this.next(); this.eatKw('OUTER'); this.wantKw('JOIN'); kind = 'RIGHT'; }
    else if (this.isKw('FULL')) { this.next(); this.eatKw('OUTER'); this.wantKw('JOIN'); kind = 'FULL'; }
    else if (this.isKw('JOIN')) { this.next(); kind = 'INNER'; }
    else if (this.isOp(',')) { this.next(); kind = 'CROSS'; }
    else break;
    var right = this.parseTableRef(), on = null, using = null;
    if (this.eatKw('ON')) on = this.parseExpr();
    else if (this.eatKw('USING')) { this.wantOp('('); using = []; do { using.push(this.ident()); } while (this.eatOp(',')); this.wantOp(')'); }
    left = { type: 'join', kind: kind, left: left, right: right, on: on, using: using };
  }
  return left;
};

Parser.prototype.parseTableRef = function () {
  var node;
  if (this.isOp('(')) {
    this.next();
    if (this.isKw('SELECT') || this.isKw('WITH') || this.isOp('(')) {
      var s = this.parseSetSelect();
      this.wantOp(')');
      node = { type: 'sub', select: s, alias: null };
    } else {
      node = this.parseFrom();
      this.wantOp(')');
      return node;
    }
  } else {
    var name = this.ident();
    node = { type: 'table', name: name, alias: null };
  }
  if (this.eatKw('AS')) node.alias = this.ident();

.scrim.open{display:block}
.rail{position:fixed;inset:0 auto 0 0;width:var(--sb);height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:contain;
  background:linear-gradient(180deg,#0A1120,#080D18);
  border-right:1px solid var(--line);overflow-y:auto;z-index:40;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;display:flex;flex-direction:column}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.brand{padding:22px 20px 15px;border-bottom:1px solid var(--line-soft)}
.brand b{display:block;font-family:'Space Grotesk';font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.brand b i{color:var(--signal);font-style:normal}
.brand span{display:block;font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.18em;color:var(--dim);margin-top:5px;text-transform:uppercase}
.find{padding:13px 14px 4px;position:sticky;top:0;background:linear-gradient(180deg,#0A1120 72%,transparent);z-index:2}
.find input{width:100%;background:#0A101C;border:1px solid var(--line);border-radius:8px;color:var(--text);
  font-family:'IBM Plex Mono';font-size:12px;padding:8px 11px;outline:none;transition:border-color .16s,box-shadow .16s}
.find input:focus{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.find input::placeholder{color:var(--dim)}
nav{flex:1}
.grp{padding:14px 14px 2px}
.grp.hide{display:none}
.grp-t{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;
  padding:0 8px 8px;display:flex;align-items:center;gap:8px}
.grp-t::after{content:'';flex:1;height:1px;background:var(--line-soft)}
.grp-t u{text-decoration:none;color:var(--line);letter-spacing:.06em}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font-family:'IBM Plex Sans';font-size:13.4px;font-weight:400;
  cursor:pointer;transition:background .16s,color .16s;position:relative;line-height:1.35}
.nv:hover{background:rgba(255,255,255,.035);color:var(--text)}
.nv em{font-family:'IBM Plex Mono';font-style:normal;font-size:10.5px;color:var(--dim);min-width:24px;letter-spacing:.04em;transition:color .16s}
.nv.on{background:var(--signal-soft);color:#fff;font-weight:500}
.nv.on em{color:var(--signal)}
.nv.on::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:19px;
  background:var(--signal);border-radius:0 3px 3px 0;box-shadow:0 0 12px var(--signal)}
.nv.done em{color:var(--signal)}
.nv.hide{display:none}
.nv.ok>em{color:var(--ok)}
.nv.ok>em::after{content:'✓';margin-left:3px;font-style:normal}
.rail-f{padding:16px 22px 26px;font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);line-height:1.8;border-top:1px solid var(--line-soft)}
.rail-f b{color:var(--signal);font-weight:500}

/* top bar */
.stage{grid-column:2;min-width:0}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:13px 40px;
  background:rgba(7,11,20,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.burger{display:none;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 9px;cursor:pointer;font-size:14px}
.top-lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape{flex:1;height:3px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:60px}
.tape i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--wire),var(--signal));border-radius:3px;
  transition:width .45s var(--d);box-shadow:0 0 10px rgba(47,216,198,.55)}
.top-n{font-family:'IBM Plex Mono';font-size:11px;color:var(--signal);white-space:nowrap}
.top-acts{display:flex;gap:6px;margin-left:auto;align-items:center}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 10px;cursor:pointer;
  font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;display:flex;align-items:center;gap:6px;min-height:32px;
  transition:border-color .15s,color .15s}
.tbtn:hover{border-color:var(--signal);color:var(--text)}
.tbtn.on{border-color:var(--ok);color:var(--ok);background:rgba(86,227,159,.08)}
.tbtn kbd{font:400 9px/1 'IBM Plex Mono',monospace;opacity:.5;border:1px solid var(--line);border-radius:3px;padding:2px 4px}

/* module */
.mod{display:none;padding:38px 40px 90px;max-width:1120px}
.mod.on{display:block;animation:in .42s var(--d)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--signal);
  display:flex;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow::after{content:'';flex:1;max-width:120px;height:1px;background:var(--signal-line)}
.mod h1{font-size:clamp(28px,4.4vw,40px);margin-bottom:12px}
.mod h1 small{display:block;font-size:13px;font-weight:400;color:var(--dim);font-family:'IBM Plex Mono';letter-spacing:.05em;margin-top:9px;line-height:1.6}
.lede{font-size:17px;color:#B9C7DA;font-weight:300;max-width:76ch;margin-bottom:30px}
.mod h2{font-size:19px;margin:34px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.mod h2::before{content:'';width:6px;height:6px;background:var(--signal);border-radius:2px;transform:rotate(45deg);flex:none}
.mod h3{font-size:15px;color:var(--signal);margin:22px 0 8px;font-weight:600}
.mod p{max-width:78ch;margin-bottom:13px;color:#C4D0E0}
.mod ul,.mod ol{max-width:78ch;margin:0 0 15px 20px;color:#C4D0E0}
.mod li{margin-bottom:7px}
.mod li::marker{color:var(--signal)}
strong{color:#fff;font-weight:600}
em.hl{font-style:normal;color:var(--flag)}
code{font-family:'IBM Plex Mono';font-size:.87em;background:var(--panel-2);border:1px solid var(--line);padding:1.5px 6px;border-radius:5px;color:var(--signal)}

/* bench panel */
.bench{background:linear-gradient(180deg,var(--panel),#0C1322);border:1px solid var(--line);border-radius:var(--r);
  margin:22px 0 26px;position:relative;overflow:hidden;box-shadow:0 18px 44px -26px rgba(0,0,0,.9)}
.bench::before,.bench::after{content:'';position:absolute;width:11px;height:11px;border:1.5px solid var(--signal-line);pointer-events:none}
.bench::before{top:46px;left:0;border-right:0;border-bottom:0}
.bench::after{bottom:0;right:0;border-left:0;border-top:0}
.bh{display:flex;align-items:center;gap:10px;padding:11px 16px;background:linear-gradient(90deg,rgba(47,216,198,.07),transparent);
  border-bottom:1px solid var(--line);font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--signal)}
.bh h5{font-family:'IBM Plex Mono';font-size:10px;font-weight:500;letter-spacing:.15em}
.bh .dot{width:6px;height:6px;border-radius:50%;background:var(--signal);box-shadow:0 0 9px var(--signal);animation:pulse 2.4s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
.bh .tag{margin-left:auto;color:var(--dim);letter-spacing:.1em;text-transform:none;font-size:9.5px}
.bb{padding:16px}

/* SQL editor */
.sqlbox{width:100%;background:#080E19;border:1px solid var(--line);border-left:2px solid var(--wire);border-radius:7px;
  color:#C8D6EA;font-family:'IBM Plex Mono';font-size:12.6px;line-height:1.66;padding:12px 14px;outline:none;resize:vertical;
  min-height:70px;tab-size:2;transition:border-color .16s}
.sqlbox:focus{border-color:var(--signal);border-left-color:var(--signal)}
.btn{background:var(--panel-3);border:1px solid var(--line);color:var(--text);padding:8px 15px;border-radius:8px;cursor:pointer;
  font-family:'IBM Plex Mono';font-size:11.5px;letter-spacing:.06em;transition:all .16s;white-space:nowrap}
.btn:hover{border-color:var(--signal);color:var(--signal);background:var(--signal-soft)}
.btn:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.btn.pri{background:var(--signal-soft);border-color:var(--signal-line);color:var(--signal)}
.btn.pri:hover{background:rgba(47,216,198,.2)}
.btn.sm{padding:5px 10px;font-size:10.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:11px 0}
.row.end{margin-bottom:0}
.meta{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-left:auto}
.meta b{color:var(--signal);font-weight:500}
.meta.bad b{color:var(--alert)}

/* result grid */
.out{margin-top:4px}
.rwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line-soft);border-radius:8px;background:#0A101C}
table.res{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono';font-size:12.2px;margin:0}
table.res th{background:var(--panel-2);color:var(--signal);font-size:9.8px;letter-spacing:.12em;text-transform:uppercase;
  text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap;position:sticky;top:0}
table.res td{padding:7px 11px;border-bottom:1px solid var(--line-soft);color:#C4D0E0;white-space:nowrap}
table.res tbody tr:last-child td{border-bottom:0}
table.res tbody tr:nth-child(odd){background:rgba(124,156,245,.032)}
table.res tbody tr:hover{background:var(--signal-soft)}
table.res td.n{text-align:right;color:#DCE4F0}
table.res td.null{color:var(--dim);font-style:italic}
.err{border:1px solid rgba(255,122,122,.4);border-left:2px solid var(--alert);background:rgba(255,122,122,.07);
  border-radius:7px;padding:11px 13px;font-family:'IBM Plex Mono';font-size:12px;color:#FFC2C2;white-space:pre-wrap}
.zero{font-family:'IBM Plex Mono';font-size:12px;color:var(--flag);border:1px dashed var(--flag-line);
  border-radius:7px;padding:11px 13px;background:var(--flag-soft)}

/* narrative / code */
.pre{font-family:'IBM Plex Mono';font-size:12.4px;background:#080E19;border:1px solid var(--line-soft);
  border-left:2px solid var(--signal);border-radius:7px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;
  color:#B9C7DA;line-height:1.66;margin:12px 0;overflow-x:auto}
.pre.code{border-left-color:var(--wire);color:#C8D6EA}
.pre.note{border-left-color:var(--flag);white-space:normal;font-family:'IBM Plex Sans';font-size:13.6px;color:#B9C7DA}
.pre b{color:var(--flag);font-weight:500}
.pre i{font-style:normal;color:var(--ok)}
.pre u{text-decoration:none;color:var(--alert)}

/* tables in prose */
.mod table:not(.res){width:100%;border-collapse:collapse;margin:14px 0;font-size:13.4px}
.mod table:not(.res) th{background:var(--panel-2);color:var(--signal);font-family:'IBM Plex Mono';font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:500}
.mod table:not(.res) td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:#C4D0E0;vertical-align:top}
.mod table:not(.res) tbody tr:nth-child(odd){background:rgba(124,156,245,.032)}
.mod table:not(.res) tbody tr:hover{background:var(--signal-soft)}

/* callouts */
.call{border:1px solid var(--flag-line);border-left:3px solid var(--flag);background:var(--flag-soft);border-radius:8px;
  padding:14px 16px;margin:20px 0;max-width:82ch}
.call h4{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--flag);margin-bottom:7px;font-weight:500}
.call p{color:#DCE4F0;margin:0;font-size:14.4px;max-width:none}
.call.warn{border-color:rgba(255,122,122,.34);border-left-color:var(--alert);background:rgba(255,122,122,.07)}
.call.warn h4{color:var(--alert)}

/* quick fire */
.qf{border:1px solid var(--line);border-radius:var(--r);margin:26px 0 8px;background:var(--panel);overflow:hidden}
.qf>summary{padding:13px 16px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;
  font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--flag)}
.qf>summary::-webkit-details-marker{display:none}
.qf>summary::before{content:'▸';color:var(--flag);transition:transform .2s;display:inline-block}
.qf[open]>summary::before{transform:rotate(90deg)}
.qf>summary:hover{background:var(--flag-soft)}
.qfb{padding:4px 16px 16px;border-top:1px solid var(--line)}
.qa{padding:11px 0;border-bottom:1px dashed var(--line-soft)}
.qa:last-child{border:0}
.qa q{display:block;color:#fff;font-weight:500;font-size:14px;quotes:none}
.qa q::before{content:'Q. ';color:var(--flag);font-family:'IBM Plex Mono';font-size:11px}
.qa p{margin:5px 0 0;color:var(--muted);font-size:13.6px;max-width:none}

/* pager */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:38px;padding-top:22px;border-top:1px solid var(--line)}
.pg{flex:1;max-width:320px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;
  cursor:pointer;text-align:left;transition:all .18s;color:var(--text);min-width:0}
.pg:hover{border-color:var(--signal);background:var(--signal-soft);transform:translateY(-2px)}
.pg span{display:block;font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.pg b{font-family:'Space Grotesk';font-size:14.5px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg.nx{text-align:right}
.pg[disabled]{opacity:.28;pointer-events:none}
.kbd{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);letter-spacing:.1em;text-align:center;margin-top:18px}

/* overlays */
.ovl{position:fixed;inset:0;background:rgba(4,7,13,.74);backdrop-filter:blur(3px);z-index:60;display:none;
  align-items:flex-start;justify-content:center;padding:6vh 16px 20px}
.ovl.open{display:flex}
.ovl-card{background:#0C1322;border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.ovl-hd{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line);
  font:500 12.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--text);flex-shrink:0}
.ovl-hd .x{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  width:30px;height:30px;cursor:pointer;font-size:13px;line-height:1}
.ovl-hd .x:hover{border-color:var(--alert);color:var(--alert)}
.ovl-bd{padding:14px 16px 18px;overflow-y:auto;overscroll-behavior:contain}
#srIn{width:100%;background:#080D18;border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--text);
  font-family:inherit;font-size:14.5px;outline:none;margin-bottom:12px}
#srIn:focus{border-color:var(--signal)}
.sr{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;
  padding:9px 11px;margin-bottom:5px;cursor:pointer;color:inherit}
.sr:hover,.sr.sel{background:rgba(47,216,198,.07);border-color:rgba(47,216,198,.30)}
.sr em{display:block;font:400 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.sr b{display:block;font-weight:500;font-size:14px;color:var(--text);line-height:1.4}
.sr span{display:block;font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:3px}
.sr mark{background:rgba(242,179,61,.24);color:var(--flag);border-radius:2px;padding:0 1px}
.hint{color:var(--dim);font-size:13px;line-height:1.6;padding:10px 2px}
.drl-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0 12px}
.drl-bar i{display:block;height:100%;background:var(--signal);width:0;transition:width .3s}
.drl-q{font-size:17px;line-height:1.5;font-weight:500;color:var(--text);margin:14px 0 6px}
.drl-src{font:400 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.drl-a{background:rgba(47,216,198,.06);border-left:2px solid var(--signal);border-radius:0 8px 8px 0;padding:12px 14px;
  font-size:14px;line-height:1.65;color:var(--muted);margin-bottom:14px}
.orow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:4px}
.obtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:8px 13px;cursor:pointer;
  font:500 12px/1 'IBM Plex Sans',sans-serif;min-height:38px}
.obtn:hover{border-color:var(--signal);color:var(--text)}
.obtn.pri{border-color:var(--signal);color:var(--signal)}

/* schema browser */
.sch{margin-bottom:16px}
.sch h4{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin-bottom:6px}
.sch p{font-size:12.8px;color:var(--muted);margin-bottom:7px}
.sch .cols{font-family:'IBM Plex Mono';font-size:11.5px;color:#B9C7DA;background:#080E19;border:1px solid var(--line-soft);
  border-radius:6px;padding:8px 10px;line-height:1.8}
.sch .cols b{color:var(--flag);font-weight:500}

/* mobile */
@media(max-width:760px){
  .mod table:not(.res){display:block;overflow-x:auto;font-size:12.5px}
  .mod h2{font-size:17px} .mod h3{font-size:14px}
  .lede{font-size:15.5px} .mod p,.mod li{font-size:14.5px}
  .pre{font-size:11.4px;padding:10px 11px}
  .sqlbox{font-size:11.8px}
  .bh{flex-wrap:wrap;row-gap:4px} .bh .tag{margin-left:0}
  .call{padding:12px 13px} .qa q{font-size:13.5px} .qa p{font-size:13px}
  .meta{margin-left:0;width:100%}
}
@media(max-width:940px){
  .app{grid-template-columns:1fr}
  .rail{width:min(88vw,300px);transform:translateX(-100%);transition:transform .26s var(--d);box-shadow:none;visibility:hidden}
  .rail.open{transform:none;visibility:visible;box-shadow:0 0 44px rgba(0,0,0,.6)}
  .burger{min-width:44px;min-height:40px;font-size:17px;line-height:1;display:block}
  .stage{grid-column:1}
  .top{padding:12px 18px}
  .mod{padding:26px 18px 70px}
  .top-acts .lbl{display:none}
  .tbtn{padding:5px 8px} .tbtn kbd{display:none}
  .ovl{padding:0}
  .ovl-card{max-height:100dvh;height:100dvh;width:100%;border-radius:0;border:0}
}
@media(max-width:560px){
  .pager{flex-direction:column} .pg{max-width:none} .pg.nx{text-align:left}
  .mod{padding:22px 14px 60px}
  .top{padding:11px 14px;gap:10px} .top-lab{display:none} .brand span{display:none}
}
@media(hover:none){.btn{padding:10px 15px}.nv{padding:11px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">

<aside class="rail" id="rail">
  <div class="brand">
    <b>SQL <i>/</i> BENCH</b>
    <span>Vedant &middot; foundations &rarr; windows &rarr; pipeline SQL</span>
  </div>
  <div class="find"><input type="text" id="find" placeholder="filter modules&hellip;" autocomplete="off" spellcheck="false"></div>
  <nav id="nav"></nav>
  <div class="rail-f" id="railf">&mdash;</div>
</aside>

<main class="stage">
  <header class="top">
    <button class="burger" id="burger" aria-label="Open module list">&#9776;</button>
    <span class="top-lab" id="topLab">&mdash;</span>
    <div class="tape"><i id="tape"></i></div>
    <span class="top-n" id="topN">&mdash;</span>
    <div class="top-acts">
      <button class="tbtn" id="btnSearch" title="Search everything"><span>&#8981;</span><span class="lbl">Search</span><kbd>/</kbd></button>
      <button class="tbtn" id="btnDrill" title="Quick-fire drill"><span>&#9672;</span><span class="lbl">Drill</span><kbd>d</kbd></button>
      <button class="tbtn" id="btnDone" title="Mark this module complete"><span>&#10003;</span><span class="lbl">Done</span></button>
    </div>
  </header>
  <div id="mods"></div>
</main>
</div>

<div class="ovl" id="srOvl">
  <div class="ovl-card">

code: 'F1', track: 'Track F · Foundations', title: 'The logical order of execution',
sub: 'SQL is written in one order and evaluated in another. Almost every "trick" question is this one fact.',
lede: 'You write <code>SELECT</code> first, but the database runs it fifth. Nearly every confusing SQL error — "unknown column" on an alias, "invalid use of group function", a window function rejected in <code>WHERE</code> — is the execution order making itself felt. Learn this table once and a whole category of interview questions collapses into a single sentence.',

 { t: 'WHERE filters rows, HAVING filters groups',
   sql: "SELECT dept_id, COUNT(*) AS headcount, ROUND(AVG(salary)) AS avg_salary\nFROM employees\nWHERE salary > 60000\nGROUP BY dept_id\nHAVING COUNT(*) >= 2\nORDER BY avg_salary DESC",

   '<tr><td>BETWEEN a AND b</td><td>Inclusive range</td><td>Beware on timestamps — <code>BETWEEN d AND d+1</code> catches midnight twice</td></tr>' +
   '<tr><td>IN (…)</td><td>Set membership</td><td>Expands to ORs. Careful with NULLs (see F3)</td></tr>' +
   '<tr><td>LIKE</td><td>Pattern match</td><td><code>%</code> any run, <code>_</code> one character</td></tr>' +
   '<tr><td>IS NULL</td><td>Null test</td><td>The <em class="hl">only</em> way to test for NULL</td></tr>' +
   '</tbody></table>' }
],
call: '"I keep the indexed column bare on the left of the predicate — a range on hire_date rather than YEAR(hire_date), because a function on the column defeats the index and, on Athena, defeats partition pruning too."',
warn: 'BETWEEN on a DATETIME column is a classic production bug. `BETWEEN \'2026-01-01\' AND \'2026-01-31\'` silently drops everything that happened on the 31st after midnight. Use `>= start AND < next_start` for time ranges — always.',
qf: [
 ['What does sargable mean?', 'The predicate is written so the optimiser can use an index — the column appears bare, not wrapped in a function or expression.'],
 ['Why is LIKE \'%abc\' slow?', 'A leading wildcard means the engine cannot use the index prefix, so it scans.'],
 ['Rewrite YEAR(d) = 2022 to be index-friendly.', "d >= '2022-01-01' AND d < '2023-01-01'."],
 ['AND vs OR precedence?', 'AND binds tighter. Parenthesise any mixed condition — the default reading is rarely what you meant.'],
 ['Why avoid BETWEEN on timestamps?', 'The upper bound is inclusive at midnight, so you either drop a day of data or double-count a boundary row.']
]});

M.push({
code: 'F3', track: 'Track F · Foundations', title: 'NULL and three-valued logic',
sub: 'NULL is not a value — it is "unknown". Every surprising SQL result traces back to that.',
lede: 'SQL is not two-valued. Every comparison returns TRUE, FALSE, or <em class="hl">UNKNOWN</em>, and only TRUE passes a <code>WHERE</code>. Interviewers love this because it produces results that look like bugs: a <code>NOT IN</code> that returns zero rows, a <code>COUNT</code> that disagrees with another <code>COUNT</code> on the same table, a <code>!=</code> filter that silently drops rows.',
ex: [
 { t: 'The NOT IN trap — this returns nothing',
   sql: "SELECT name\nFROM employees\nWHERE dept_id NOT IN (SELECT dept_id FROM employees WHERE salary > 60000)",
   note: 'Kabir has a NULL dept_id, so the subquery list contains a NULL. `x NOT IN (a, b, NULL)` is UNKNOWN for every x, and UNKNOWN never passes WHERE. Zero rows. This is the single most-asked NULL question.' },
 { t: 'NOT EXISTS is null-safe — this works',
   sql: "SELECT e.name, e.dept_id\nFROM employees e\nWHERE NOT EXISTS (\n  SELECT 1 FROM departments d\n  WHERE d.dept_id = e.dept_id AND d.location = 'London'\n)\nORDER BY e.emp_id",
   note: 'EXISTS asks "did any row come back?" — a plain yes/no. No NULL can poison it. Same intent, correct answer.' },
 { t: 'NULLs in aggregates and comparisons',
   sql: "SELECT COUNT(*) AS all_rows,\n       COUNT(dept_id) AS non_null_dept,\n       COUNT(DISTINCT dept_id) AS distinct_depts,\n       AVG(salary) AS avg_all,\n       SUM(CASE WHEN dept_id IS NULL THEN 1 ELSE 0 END) AS null_depts\nFROM employees",
   note: 'COUNT(*) counts rows. COUNT(col) counts non-NULL values. AVG ignores NULLs entirely — which is why AVG over a column with missing data is not the average you think it is.' },
 { t: 'Defaults and safe division',
   sql: "SELECT w.wallet_id,\n       COALESCE(w.risk_band, 'unclassified') AS band,\n       COUNT(t.txn_id) AS out_txns,\n       ROUND(SUM(t.amount_usd) / NULLIF(COUNT(t.txn_id), 0), 2) AS avg_txn\nFROM wallets w\nLEFT JOIN transfers t ON t.src_wallet = w.wallet_id\nGROUP BY w.wallet_id, w.risk_band\nORDER BY out_txns DESC, w.wallet_id",
   note: 'COALESCE supplies a default. NULLIF(x, 0) turns a zero denominator into NULL so the division yields NULL instead of an error. Wallet w-8 shows the unclassified path; wallets with no outbound transfers show the divide-by-zero path.' }
],
body: [
 { h: 'The truth table', html:
   '<table><thead><tr><th>Expression</th><th>Result</th><th>Passes WHERE?</th></tr></thead><tbody>' +
   '<tr><td>NULL = NULL</td><td>UNKNOWN</td><td>No</td></tr>' +
   '<tr><td>NULL &lt;&gt; 5</td><td>UNKNOWN</td><td>No</td></tr>' +
   '<tr><td>NULL IS NULL</td><td>TRUE</td><td>Yes</td></tr>' +
   '<tr><td>TRUE OR UNKNOWN</td><td>TRUE</td><td>Yes</td></tr>' +
   '<tr><td>FALSE AND UNKNOWN</td><td>FALSE</td><td>No</td></tr>' +
   '<tr><td>TRUE AND UNKNOWN</td><td>UNKNOWN</td><td>No</td></tr>' +
   '</tbody></table>' +
   '<p>The practical rule: <strong>a row only survives WHERE if the predicate is exactly TRUE.</strong> UNKNOWN behaves like FALSE for filtering, but <em class="hl">not</em> for negation — <code>NOT UNKNOWN</code> is still UNKNOWN, which is precisely why NOT IN breaks.</p>' },
 { h: 'The toolkit', html:
   '<div class="pre code">COALESCE(a, b, c)   <i>first non-NULL argument — the general default</i>\nIFNULL(a, b)        <i>two-argument version (MySQL); Postgres/Spark: COALESCE</i>\nNULLIF(a, b)        <i>NULL when a = b — the divide-by-zero guard</i>\nx IS NOT DISTINCT FROM y   <i>null-safe equality (Postgres/Spark); MySQL: x &lt;=&gt; y</i></div>' },
 { h: 'Where NULLs bite in a pipeline', html:
   '<ul>' +
   '<li><strong>Outer joins manufacture NULLs.</strong> Every LEFT JOIN adds nullable columns downstream, even if both source tables were clean.</li>' +
   '<li><strong>GROUP BY collapses all NULLs into one group</strong> — unlike <code>=</code>, grouping treats NULLs as equal to each other.</li>' +
   '<li><strong>ORDER BY placement varies.</strong> MySQL sorts NULLs first ascending; Postgres sorts them last. Spell it out with <code>NULLS FIRST</code>/<code>NULLS LAST</code> where the dialect supports it.</li>' +
   '<li><strong>Parquet stores nullability in the schema.</strong> A column declared non-nullable that receives a NULL fails the write, not the read.</li>' +
   '</ul>' }
],
call: '"NULL means unknown, so comparisons return UNKNOWN rather than false, and only TRUE passes a WHERE. That is why NOT IN over a subquery containing a NULL returns zero rows — I use NOT EXISTS, which is null-safe."',
warn: 'The NOT IN failure is silent. You get an empty result, not an error, so it survives code review and ships. Any time you write NOT IN against a subquery, either add IS NOT NULL to the subquery or use NOT EXISTS.',
qf: [
 ['Why does NOT IN return no rows?', 'The subquery produced a NULL. x NOT IN (…NULL…) evaluates to UNKNOWN for every x, and UNKNOWN never passes WHERE.'],
 ['NOT IN vs NOT EXISTS?', 'NOT EXISTS is null-safe and usually optimises better. Default to it.'],
 ['COUNT(*) vs COUNT(col)?', 'COUNT(*) counts rows; COUNT(col) counts non-NULL values of that column.'],
 ['Does AVG ignore NULLs?', 'Yes — both the sum and the divisor skip them, so AVG is the mean of the present values only.'],
 ['How do you avoid divide-by-zero?', 'Divide by NULLIF(denominator, 0) — the result becomes NULL rather than an error.'],
 ['Does GROUP BY treat NULLs as equal?', 'Yes. All NULLs fall into a single group even though NULL = NULL is UNKNOWN.']
]});

M.push({
code: 'F4', track: 'Track F · Foundations', title: 'CASE and conditional logic',
sub: 'The workhorse of every banding, pivoting and rule-encoding query you will ever write.',
lede: '<code>CASE</code> is where business rules enter SQL. Risk bands, fraud thresholds, bucketed cohorts, conditional counts — all of it is CASE. It also composes: put a CASE inside an aggregate and you get pivoting, put it inside <code>ORDER BY</code> and you get custom sort orders that would otherwise need a lookup table.',
ex: [
 { t: 'Searched CASE — banding',
   sql: "SELECT name, salary,\n  CASE WHEN salary >= 120000 THEN 'senior'\n       WHEN salary >=  80000 THEN 'mid'\n       ELSE 'entry' END AS band\nFROM employees\nORDER BY salary DESC",
   note: 'Conditions are evaluated top to bottom and the first TRUE wins — so order matters. Without ELSE, unmatched rows get NULL, not an error.' },
 { t: 'CASE inside an aggregate = a pivot',
   sql: "SELECT d.dept_name,\n  COUNT(*) AS headcount,\n  SUM(CASE WHEN e.salary >= 100000 THEN 1 ELSE 0 END) AS six_figure,\n  SUM(CASE WHEN e.salary <  100000 THEN 1 ELSE 0 END) AS under,\n  ROUND(100.0 * SUM(CASE WHEN e.salary >= 100000 THEN 1 ELSE 0 END) / COUNT(*), 1) AS pct_six_figure\nFROM employees e\nJOIN departments d ON e.dept_id = d.dept_id\nGROUP BY d.dept_name\nORDER BY pct_six_figure DESC",
   note: 'This is how you turn rows into columns without a PIVOT clause. It works identically in MySQL, Postgres, Athena and Spark SQL.' },
 { t: 'CASE in ORDER BY — custom sort',
   sql: "SELECT alert_id, wallet_id, rule_code, severity\nFROM alerts\nORDER BY CASE severity WHEN 'high' THEN 1 WHEN 'medium' THEN 2 ELSE 3 END, raised_on",
   note: 'Alphabetically "high" sorts after "low". A CASE gives you the business ordering without adding a rank column to the table.' },
 { t: 'Simple CASE and the NULL gotcha',
   sql: "SELECT wallet_id, risk_band,\n  CASE risk_band WHEN 'high' THEN 'escalate' WHEN 'low' THEN 'auto-close' ELSE 'review' END AS action\nFROM wallets\nORDER BY wallet_id",
   note: 'Simple CASE compares with =, so a NULL risk_band never matches any WHEN — it falls to ELSE. If you need to branch on NULL, you must use searched CASE with IS NULL.' }
],
body: [
 { h: 'The two forms', html:
   '<div class="pre code">CASE WHEN cond THEN v1 WHEN cond2 THEN v2 ELSE v3 END   <i>searched — any predicate</i>\nCASE col WHEN a THEN v1 WHEN b THEN v2 ELSE v3 END      <i>simple — equality only</i></div>' +
   '<p>Simple CASE is shorter but strictly weaker: it can only test <code>=</code>, so it cannot match NULL and cannot express ranges. When in doubt, use the searched form.</p>' },
 { h: 'The patterns that recur', html:
   '<table><thead><tr><th>Goal</th><th>Shape</th></tr></thead><tbody>' +
   '<tr><td>Conditional count</td><td><code>SUM(CASE WHEN c THEN 1 ELSE 0 END)</code> or <code>COUNT(CASE WHEN c THEN 1 END)</code></td></tr>' +
   '<tr><td>Conditional sum</td><td><code>SUM(CASE WHEN c THEN amount ELSE 0 END)</code></td></tr>' +
   '<tr><td>Pivot to columns</td><td>One conditional aggregate per output column</td></tr>' +
   '<tr><td>Custom sort</td><td><code>ORDER BY CASE … END</code></td></tr>' +
   '<tr><td>Safe divide</td><td><code>x / NULLIF(y, 0)</code> — the CASE-free shorthand</td></tr>' +
   '</tbody></table>' }
],
call: '"Conditional aggregation — a CASE inside a SUM — is how I pivot without a PIVOT clause, and it is portable across MySQL, Postgres, Athena and Spark SQL, which matters when the same logic has to run in two engines."',
warn: 'Simple CASE never matches NULL, because it compares with =. A rule table with a NULL category silently falls through to ELSE and your "unmatched" bucket quietly absorbs real data. Use searched CASE with an explicit IS NULL branch.',
qf: [
 ['Simple vs searched CASE?', 'Simple compares one expression with = ; searched takes arbitrary predicates. Searched is strictly more capable.'],
 ['What if no WHEN matches and there is no ELSE?', 'The expression returns NULL.'],
 ['How do you pivot rows into columns without PIVOT?', 'Conditional aggregation — one SUM(CASE WHEN … ) per output column.'],
 ['COUNT(CASE WHEN c THEN 1 END) vs SUM(CASE WHEN c THEN 1 ELSE 0 END)?', 'Identical results. COUNT relies on NULLs being skipped; SUM is more obvious to a reader.'],
 ['Why can a simple CASE miss NULL rows?', 'It uses equality, and NULL = anything is UNKNOWN, so those rows fall to ELSE.']
]});

M.push({
code: 'F5', track: 'Track F · Foundations', title: 'Sorting, LIMIT and deterministic pagination',
sub: 'Why "the same query returned different rows" is almost always a missing tiebreaker.',
lede: 'Without <code>ORDER BY</code>, SQL guarantees <em class="hl">nothing</em> about row order — and in a distributed engine like Spark or Athena the order genuinely changes between runs. Add <code>LIMIT</code> on top of a non-deterministic sort and you get a pagination bug that only appears in production, under parallelism, with duplicate sort keys.',
ex: [
 { t: 'A non-deterministic top-N',
   sql: "SELECT name, dept_id, salary\nFROM employees\nORDER BY salary DESC\nLIMIT 5",
   note: 'Bhavin and Chetan both earn 98000. Which one appears at rank 4 is arbitrary — the engine may return either. On a single-node MySQL you may never notice; on Spark you will.' },
 { t: 'The deterministic version',
   sql: "SELECT name, dept_id, salary\nFROM employees\nORDER BY salary DESC, emp_id ASC\nLIMIT 5",
   note: 'Adding a unique tiebreaker (the primary key) makes the ordering total. The result is now reproducible across engines, runs and partitions.' },
 { t: 'Offset pagination and its cost',
   sql: "SELECT sale_id, emp_id, amount, sale_date\nFROM sales\nORDER BY sale_date, sale_id\nLIMIT 5 OFFSET 5",
   note: 'OFFSET 5 makes the engine produce and discard the first five rows. At OFFSET 500000 it produces and discards half a million — the cost grows with the page number.' },
 { t: 'Keyset pagination — constant cost',
   sql: "SELECT sale_id, emp_id, amount, sale_date\nFROM sales\nWHERE (sale_date > '2026-01-06')\n   OR (sale_date = '2026-01-06' AND sale_id > 104)\nORDER BY sale_date, sale_id\nLIMIT 5",
   note: 'Instead of counting rows to skip, you remember the last key you saw and seek past it. Page 10000 costs the same as page 1. This is how real APIs paginate.' }
],
body: [
 { h: 'The rules', html:
   '<ul>' +
   '<li><strong>No ORDER BY, no order.</strong> Not "usually insertion order" — no guarantee at all.</li>' +
   '<li><strong>ORDER BY must be total for LIMIT to be deterministic.</strong> Append a unique column as the final sort key.</li>' +
   '<li><strong>ORDER BY can use SELECT aliases and window functions</strong> — it runs at step 7.</li>' +
   '<li><strong>ORDER BY 1, 2</strong> sorts by output column position. Handy in ad-hoc work, fragile in a repo.</li>' +
   '</ul>' },
 { h: 'Offset vs keyset', html:
   '<table><thead><tr><th></th><th>OFFSET</th><th>Keyset (seek)</th></tr></thead><tbody>' +
   '<tr><td>Cost at page N</td><td>Grows linearly</td><td>Constant</td></tr>' +
   '<tr><td>Stable under inserts</td><td>No — rows shift between pages</td><td>Yes</td></tr>' +
   '<tr><td>Random page access</td><td>Yes</td><td>No — sequential only</td></tr>' +
   '<tr><td>Right for</td><td>Admin screens, small tables</td><td>APIs, exports, large scans</td></tr>' +
   '</tbody></table>' }
],
call: '"I always make the ORDER BY total by appending a unique key, because LIMIT on a partial ordering is non-deterministic — and in Spark or Athena that shows up as different rows on different runs, not just a different sequence."',
warn: 'A LIMIT without ORDER BY in a data pipeline is a correctness bug, not a performance choice. It is the classic cause of "the sample looked fine but the load was wrong" — and it will never reproduce locally on a single partition.',
qf: [
 ['Is row order guaranteed without ORDER BY?', 'No. Any order is legal, and distributed engines genuinely vary between runs.'],
 ['Why add a unique column to ORDER BY?', 'To make the ordering total so LIMIT picks the same rows every time.'],
 ['Why is OFFSET slow on deep pages?', 'The engine must generate and discard every skipped row; cost grows with the offset.'],
 ['What is keyset pagination?', 'Filter on the last key seen instead of skipping rows — constant cost per page and stable under concurrent inserts.'],
 ['Can ORDER BY use an alias?', 'Yes — it runs after SELECT.']
]});

/* ══════════════ TRACK J · JOINS ══════════════ */

M.push({
code: 'J1', track: 'Track J · Joins', title: 'INNER and LEFT joins',
sub: 'The two joins that cover ninety percent of real work — and exactly what each one keeps.',
lede: 'A join is a filtered cartesian product. Everything else — inner, left, anti — is a variation on which unmatched rows survive. Get precise about that and join bugs stop happening: the row count either matches your mental model or you have found a real data problem.',
ex: [
 { t: 'INNER JOIN — only matched rows survive',
   sql: "SELECT e.emp_id, e.name, d.dept_name, d.location\nFROM employees e\nJOIN departments d ON e.dept_id = d.dept_id\nORDER BY e.emp_id",
   note: 'Twelve employees in, eleven rows out. Kabir has a NULL dept_id and silently vanishes — an inner join is also a filter, and that is how data quietly disappears from a report.' },
 { t: 'LEFT JOIN — keep every left row',
   sql: "SELECT e.emp_id, e.name, e.dept_id, d.dept_name, d.location\nFROM employees e\nLEFT JOIN departments d ON e.dept_id = d.dept_id\nORDER BY e.emp_id",
   note: 'Twelve rows out. Kabir survives with NULLs on the right-hand columns. Note that the outer join manufactured NULLs that exist in neither source table.' },
 { t: 'The predicate placement trap',
   sql: "SELECT e.name, d.dept_name\nFROM employees e\nLEFT JOIN departments d\n  ON e.dept_id = d.dept_id AND d.location = 'London'\nORDER BY e.emp_id",
   note: "Filtering in ON keeps all twelve employees and nulls out the non-London departments. Move `d.location = 'London'` to WHERE and the LEFT JOIN collapses into an inner join — because the NULL rows fail the filter. This is the highest-value join detail to know." },
 { t: 'Aggregating over a LEFT JOIN',
   sql: "SELECT e.name, COUNT(s.sale_id) AS sale_count, COALESCE(SUM(s.amount), 0) AS revenue\nFROM employees e\nLEFT JOIN sales s ON e.emp_id = s.emp_id\nGROUP BY e.emp_id, e.name\nORDER BY revenue DESC, e.emp_id",
   note: 'COUNT(s.sale_id) is 0 for employees with no sales; COUNT(*) would wrongly return 1 because the outer-joined row still exists. Count the right-side key, not the row.' }
],
body: [
 { h: 'What each join keeps', html:
   '<table><thead><tr><th>Join</th><th>Keeps</th><th>Typical use</th></tr></thead><tbody>' +
   '<tr><td>INNER</td><td>Rows matched on both sides</td><td>Enriching facts with a dimension that is guaranteed complete</td></tr>' +
   '<tr><td>LEFT</td><td>All left rows; NULLs where the right has no match</td><td>Anything where the left side is the population you must not lose</td></tr>' +
   '<tr><td>RIGHT</td><td>Mirror of LEFT</td><td>Rare — rewrite as LEFT by swapping the tables</td></tr>' +
   '<tr><td>FULL OUTER</td><td>Everything from both sides</td><td>Reconciliation between two systems</td></tr>' +
   '<tr><td>CROSS</td><td>Every pairing</td><td>Date spines, calendar × entity scaffolds</td></tr>' +
   '</tbody></table>' },
 { h: 'ON versus WHERE — the rule', html:
   '<p>For an <strong>inner</strong> join the two are equivalent; the optimiser will push the predicate either way.</p>' +
   '<p>For an <strong>outer</strong> join they are completely different:</p>' +
   '<div class="pre code">LEFT JOIN d ON e.dept_id = d.dept_id AND d.location = \'London\'\n   <i>filter applied while matching — unmatched left rows survive with NULLs</i>\n\nLEFT JOIN d ON e.dept_id = d.dept_id\nWHERE d.location = \'London\'\n   <u>filter applied after — NULL rows fail it — the join is now effectively INNER</u></div>' +
   '<p>The one exception where the WHERE form is deliberate: <code>WHERE d.key IS NULL</code>, which is the anti-join (see J2).</p>' }
],
call: '"On an outer join, a predicate in ON filters during matching and preserves the unmatched rows, while the same predicate in WHERE runs afterwards and silently converts the outer join to an inner one."',
warn: 'COUNT(*) after a LEFT JOIN counts the manufactured NULL row as 1. Always count a non-nullable column from the right-hand table — COUNT(s.sale_id) — or your "employees with zero sales" report shows one sale each.',
qf: [
 ['What does an INNER JOIN drop?', 'Rows on either side with no match — including rows whose join key is NULL.'],
 ['LEFT JOIN with the filter in ON vs WHERE?', 'ON preserves unmatched left rows with NULLs; WHERE removes them, turning it into an inner join.'],
 ['Why is COUNT(*) wrong after a LEFT JOIN?', 'The unmatched row still exists, so it counts as one. Count a right-side key instead.'],
 ['How do you rewrite a RIGHT JOIN?', 'Swap the table order and use LEFT — easier to read and reason about.'],
 ['Is a join a filter?', 'An inner join is. That is exactly why rows disappear when a dimension is incomplete.']
]});

M.push({
code: 'J2', track: 'Track J · Joins', title: 'Anti-joins and semi-joins',
sub: '"Find rows in A with nothing in B" — three ways to write it, and which one to reach for.',
lede: 'The single most-asked join question in data interviews is some phrasing of <em class="hl">find the records that have no match</em>: customers who never ordered, wallets with no alerts, employees with no sales. There are three standard shapes and they differ in NULL safety and performance, not in intent.',
ex: [
 { t: 'LEFT JOIN + IS NULL — the classic',
   sql: "SELECT e.emp_id, e.name\nFROM employees e\nLEFT JOIN sales s ON e.emp_id = s.emp_id\nWHERE s.sale_id IS NULL\nORDER BY e.emp_id",
   note: 'Join everything, then keep only the rows where the right side failed to match. Works in every dialect including ancient ones.' },
 { t: 'NOT EXISTS — the one to default to',
   sql: "SELECT e.emp_id, e.name\nFROM employees e\nWHERE NOT EXISTS (SELECT 1 FROM sales s WHERE s.emp_id = e.emp_id)\nORDER BY e.emp_id",
   note: 'Same answer. It short-circuits on the first match, is null-safe, and reads as the question. This is the version to write.' },
 { t: 'NOT IN — correct here, dangerous in general',
   sql: "SELECT e.emp_id, e.name\nFROM employees e\nWHERE e.emp_id NOT IN (SELECT emp_id FROM sales)\nORDER BY e.emp_id",
   note: 'Works because sales.emp_id has no NULLs. Add one NULL to that column and this query returns zero rows with no error. See F3.' },
 { t: 'Semi-join — rows in A that DO have a match, without duplicating them',
   sql: "SELECT w.wallet_id, w.address, w.risk_band\nFROM wallets w\nWHERE EXISTS (SELECT 1 FROM alerts a WHERE a.wallet_id = w.wallet_id)\nORDER BY w.wallet_id",
   note: 'A plain JOIN would return w-2 twice and w-4 twice, because each has two alerts. EXISTS returns each wallet once — that is the difference between a join and a semi-join.' }
],
body: [
 { h: 'The three shapes compared', html:
   '<table><thead><tr><th>Shape</th><th>NULL-safe</th><th>Duplicates left rows</th><th>Verdict</th></tr></thead><tbody>' +
   '<tr><td>LEFT JOIN … IS NULL</td><td>Yes</td><td>Can, if B has repeats on the key</td><td>Universal, slightly verbose</td></tr>' +
   '<tr><td>NOT EXISTS</td><td><b>Yes</b></td><td>No</td><td><b>Default choice</b></td></tr>' +
   '<tr><td>NOT IN</td><td><b>No</b></td><td>No</td><td>Only with a guaranteed non-null key</td></tr>' +
   '</tbody></table>' },
 { h: 'Semi-join vs join — why it matters in a pipeline', html:
   '<p>"Which facts have at least one match?" is a <em class="hl">semi-join</em>. Writing it as a plain join silently fans out the fact table by the number of matches — the single most common cause of inflated revenue in a report.</p>' +
   '<div class="pre code">JOIN alerts a ON a.wallet_id = w.wallet_id   <u>w-2 appears twice — it has two alerts</u>\nWHERE EXISTS (SELECT 1 FROM alerts a …)      <i>w-2 appears once</i></div>' +
   '<p>Spark and most warehouses implement both as a hash join internally; <code>EXISTS</code> just tells the optimiser it may stop after the first match.</p>' }
],
call: '"I write anti-joins as NOT EXISTS rather than NOT IN — it is null-safe and it short-circuits — and I use EXISTS instead of a join whenever I only need existence, so the fact table does not fan out."',
warn: 'LEFT JOIN + IS NULL can still duplicate rows before the filter if the right table has multiple matches on the key. It happens to be safe here, but on a many-side table check the row count before and after.',
qf: [
 ['Write "rows in A with no match in B".', 'LEFT JOIN B ON key WHERE B.key IS NULL — or, preferably, NOT EXISTS.'],
 ['Why prefer NOT EXISTS to NOT IN?', 'NOT IN returns nothing if the subquery contains a NULL; NOT EXISTS is unaffected.'],
 ['What is a semi-join?', 'Keep left rows that have at least one match, without duplicating them — EXISTS or IN.'],
 ['What is an anti-join?', 'Keep left rows that have no match — NOT EXISTS or LEFT JOIN … IS NULL.'],
 ['When is NOT IN acceptable?', 'When the subquery column is provably NOT NULL, and even then NOT EXISTS costs nothing extra.']
]});

M.push({
code: 'J3', track: 'Track J · Joins', title: 'CROSS, FULL OUTER and the date spine',
sub: 'The joins that create rows instead of filtering them — and the reporting problem they solve.',
lede: 'A <code>CROSS JOIN</code> looks like a mistake until you need one. Every "show zero for days with no activity" report is built on a cross join between a calendar and an entity list, because you cannot aggregate rows that do not exist. <code>FULL OUTER</code> solves the other shape: reconciling two systems that each hold rows the other is missing.',
ex: [
 { t: 'The gap you are trying to fix',
   sql: "SELECT sale_date, COUNT(*) AS sales, SUM(amount) AS revenue\nFROM sales\nWHERE sale_date < '2026-01-14'\nGROUP BY sale_date\nORDER BY sale_date",
   note: 'The 7th to the 10th of January are simply absent — not zero, absent. A chart drawn from this silently closes the gap and misrepresents the trend.' },
 { t: 'A date spine from a recursive CTE',
   sql: "WITH RECURSIVE cal AS (\n  SELECT DATE('2026-01-04') AS d\n  UNION ALL\n  SELECT DATE_ADD(d, INTERVAL 1 DAY) FROM cal WHERE d < '2026-01-13'\n)\nSELECT cal.d AS sale_date,\n       COUNT(s.sale_id) AS sales,\n       COALESCE(SUM(s.amount), 0) AS revenue\nFROM cal\nLEFT JOIN sales s ON s.sale_date = cal.d\nGROUP BY cal.d\nORDER BY cal.d",
   note: 'Generate every date, LEFT JOIN the facts onto it, and the missing days appear as genuine zeros. In a warehouse you would join a real dim_date table instead of generating one.' },
 { t: 'CROSS JOIN — every entity × every day',
   sql: "WITH RECURSIVE cal AS (\n  SELECT DATE('2026-01-04') AS d\n  UNION ALL\n  SELECT DATE_ADD(d, INTERVAL 1 DAY) FROM cal WHERE d < '2026-01-06'\n),\nreps AS (SELECT emp_id, name FROM employees WHERE dept_id = 30)\nSELECT r.name, c.d, COALESCE(SUM(s.amount), 0) AS revenue\nFROM reps r\nCROSS JOIN cal c\nLEFT JOIN sales s ON s.emp_id = r.emp_id AND s.sale_date = c.d\nGROUP BY r.name, c.d\nORDER BY r.name, c.d",
   note: 'Three reps × three days = nine rows guaranteed, whether or not anyone sold anything. This is the standard scaffold for a dense reporting grid.' },
 { t: 'FULL OUTER — reconciliation',
   sql: "SELECT COALESCE(s.txn_id, t.txn_id) AS txn_id,\n       s.amount_usd AS staging_amount,\n       t.amount_usd AS curated_amount,\n       CASE WHEN t.txn_id IS NULL THEN 'missing in curated'\n            WHEN s.txn_id IS NULL THEN 'missing in staging'\n            ELSE 'in both' END AS status\nFROM stg_transfers s\nFULL OUTER JOIN transfers t ON s.txn_id = t.txn_id\nWHERE s.txn_id IS NULL OR t.txn_id IS NULL\nORDER BY txn_id",
   note: 'The reconciliation query every data engineer writes eventually: which keys exist on one side only. MySQL has no FULL OUTER — emulate it with LEFT UNION RIGHT.' }
],
body: [
 { h: 'When a cross join is correct', html:
   '<ul>' +
   '<li><strong>Dense reporting grids.</strong> Entity × calendar, so every cell exists before you aggregate.</li>' +
   '<li><strong>Parameter sweeps.</strong> Thresholds × segments, to score a rule across a matrix.</li>' +
   '<li><strong>Small lookup expansion.</strong> Applying every FX rate to every currency pair.</li>' +
   '</ul>' +
   '<p>It is wrong whenever it happens by accident — a missing <code>ON</code> clause produces the same thing and multiplies your row count instead of adding to it.</p>' },
 { h: 'FULL OUTER in MySQL', html:
   '<div class="pre code">SELECT … FROM a LEFT  JOIN b ON a.k = b.k\nUNION\nSELECT … FROM a RIGHT JOIN b ON a.k = b.k</div>' +
   '<p>UNION (not UNION ALL) removes the duplicated matched rows. Postgres, Redshift, Athena and Spark SQL all support FULL OUTER natively.</p>' }
],
call: '"Missing days are not zeros — they are absent rows. I build a date spine and LEFT JOIN the facts onto it, so the report shows a real zero instead of quietly closing the gap."',
warn: 'An accidental cross join — a JOIN with no ON clause, or an ON that matches on the wrong column — does not error. It returns rows, just N × M of them. The tell is a result set far larger than either input.',
qf: [
 ['Why do you need a date spine?', 'Aggregation cannot produce rows for days with no facts; you must generate the days and outer-join the facts.'],
 ['When is CROSS JOIN legitimate?', 'Deliberate expansion — calendars, parameter grids, small lookup fan-out.'],
 ['How do you emulate FULL OUTER in MySQL?', 'LEFT JOIN UNION RIGHT JOIN — UNION, not UNION ALL, so matched rows are not duplicated.'],
 ['How do you spot an accidental cross join?', 'Output row count is roughly the product of the inputs rather than the size of the driving table.'],
 ['What does FULL OUTER give you operationally?', 'A reconciliation view — keys present on one side only, in a single pass.']
]});

M.push({
