code: 'J4', track: 'Track J · Joins', title: 'Self joins and graph traversal',
sub: 'One table joined to itself — managers, previous rows, and wallet-to-wallet hops.',
lede: 'A self join is a plain join where both sides are the same table under different aliases. It answers "relate each row to another row in the same table" — the employee-to-manager question in an interview, and the wallet-to-wallet question in your fraud research. Two hops of a self join is the first step towards a graph query.',
ex: [
 { t: 'Employee to manager',
   sql: "SELECT e.emp_id, e.name AS employee, m.name AS manager, m.salary AS manager_salary\nFROM employees e\nLEFT JOIN employees m ON e.manager_id = m.emp_id\nORDER BY e.emp_id",
   note: 'LEFT, not INNER — otherwise the four people with no manager disappear. Aliasing the same table twice is what makes this work.' },
 { t: 'Employees earning more than their manager',
   sql: "SELECT e.name AS employee, e.salary, m.name AS manager, m.salary AS manager_salary\nFROM employees e\nJOIN employees m ON e.manager_id = m.emp_id\nWHERE e.salary > m.salary",
   note: 'A staple interview question, and here it correctly returns nothing — no one out-earns their manager in this data. An empty result that you can explain is a correct answer.' },
 { t: 'Two-hop transfer chains',
   sql: "SELECT a.src_wallet AS hop0, a.dst_wallet AS hop1, b.dst_wallet AS hop2,\n       a.amount_usd AS leg1, b.amount_usd AS leg2\nFROM transfers a\nJOIN transfers b ON a.dst_wallet = b.src_wallet\nWHERE a.src_wallet <> b.dst_wallet\n  AND b.ts >= a.ts\n  AND b.amount_usd >= a.amount_usd * 0.9\nORDER BY a.txn_id, b.txn_id",
   note: 'A layering pattern: money arrives and leaves again at nearly the same value shortly after. Two self joins on transfers is the SQL version of a two-hop graph walk — and the reason people reach for a graph database at hop four.' },
 { t: 'Pairs without double counting',
   sql: "SELECT a.name AS emp_a, b.name AS emp_b, a.dept_id, a.salary\nFROM employees a\nJOIN employees b ON a.dept_id = b.dept_id AND a.emp_id < b.emp_id\nWHERE a.salary = b.salary\nORDER BY a.dept_id",
   note: 'The `a.emp_id < b.emp_id` condition is the trick: it keeps each pair once instead of twice, and stops every row from matching itself.' }
],
body: [
 { h: 'The three self-join rules', html:
   '<ul>' +
   '<li><strong>Always alias both sides.</strong> Without aliases the parser cannot tell which column you mean.</li>' +
   '<li><strong>Exclude the self-match.</strong> <code>a.id &lt;&gt; b.id</code>, or <code>a.id &lt; b.id</code> when you want unordered pairs once.</li>' +
   '<li><strong>Use LEFT when the relationship is optional.</strong> Top-of-hierarchy rows have a NULL parent.</li>' +
   '</ul>' },
 { h: 'Where self joins stop scaling', html:
   '<p>Each additional hop is another join. Three hops on a transfers table of N rows is roughly N³ intermediate work before filtering — it becomes untenable fast, which is the honest reason graph engines exist.</p>' +
   '<table><thead><tr><th>Depth</th><th>Right tool</th></tr></thead><tbody>' +
   '<tr><td>1–2 hops, fixed</td><td>Self join</td></tr>' +
   '<tr><td>Variable depth, tree</td><td>Recursive CTE (S4)</td></tr>' +
   '<tr><td>Variable depth, cyclic graph, large</td><td>GraphFrames / a graph database / a GNN</td></tr>' +
   '</tbody></table>' }
],
call: '"A self join is how you relate a row to another row in the same table — manager lookups, or two-hop transfer chains in a wallet graph. Past two hops the intermediate result explodes, which is when I move the traversal out of SQL."',
warn: 'Forgetting the self-exclusion predicate means every row joins to itself and your "pairs" result contains N phantom matches. If a pairing query returns exactly the table size plus something, that is the bug.',
qf: [
 ['What is a self join?', 'A table joined to itself under two aliases, to relate rows within one table.'],
 ['Why LEFT for manager lookups?', 'People at the top have a NULL manager_id and an inner join would drop them.'],
 ['How do you avoid duplicate pairs?', 'Join with a.id < b.id, which also excludes self-matches.'],
 ['When does a self join stop being the answer?', 'At variable or deep traversal — use a recursive CTE for trees, a graph engine for large cyclic graphs.'],
 ['How would you find a two-hop layering chain?', 'Join transfers to itself on a.dst = b.src, with time ordering and a value-similarity condition.']
]});

M.push({
code: 'J5', track: 'Track J · Joins', title: 'Fan-out: the duplicated-fact bug',
sub: 'Why your revenue number doubled, and how to prove a join is safe before you ship it.',
lede: 'This is the bug that reaches production more often than any other SQL error, and it is never reported as a SQL error — it is reported as "the numbers look too high". Joining a fact table to something that is not unique on the join key multiplies the fact rows, and every downstream SUM inherits the multiplication.',
ex: [
 { t: 'Establish the truth first',
   sql: "SELECT COUNT(*) AS transfer_rows, ROUND(SUM(amount_usd), 2) AS true_volume\nFROM transfers",
   note: 'Sixteen rows, and this is the correct total volume. Note the number — the next query breaks it.' },
 { t: 'The fan-out',
   sql: "SELECT COUNT(*) AS rows_after_join, ROUND(SUM(t.amount_usd), 2) AS inflated_volume\nFROM transfers t\nLEFT JOIN alerts a ON a.wallet_id = t.src_wallet",
   note: 'Both numbers are now higher than the truth above. The alerts table has two rows for w-2 and two for w-4, so every transfer from those wallets is counted twice. No error, no warning — just a wrong number.' },
 { t: 'Prove which side is not unique',
   sql: "SELECT wallet_id, COUNT(*) AS alert_rows\nFROM alerts\nGROUP BY wallet_id\nHAVING COUNT(*) > 1\nORDER BY alert_rows DESC",
   note: 'Run this before any join you are unsure about. If the right-hand table returns rows here on your join key, the join will fan out. This is the whole diagnostic.' },
 { t: 'Fix one: aggregate before joining',
   sql: "WITH alert_counts AS (\n  SELECT wallet_id, COUNT(*) AS alert_count, MAX(severity) AS worst_severity\n  FROM alerts GROUP BY wallet_id\n)\nSELECT COUNT(*) AS rows_after_join, ROUND(SUM(t.amount_usd), 2) AS volume\nFROM transfers t\nLEFT JOIN alert_counts a ON a.wallet_id = t.src_wallet",
   note: 'Collapse the many-side to one row per key first, then join. Row count and volume are back to the truth, and you still get the alert context.' },
 { t: 'Fix two: semi-join when you only need a flag',
   sql: "SELECT t.txn_id, t.src_wallet, t.amount_usd,\n       CASE WHEN EXISTS (SELECT 1 FROM alerts a WHERE a.wallet_id = t.src_wallet)\n            THEN 1 ELSE 0 END AS src_has_alert\nFROM transfers t\nORDER BY src_has_alert DESC, t.txn_id",
   note: 'If the question is "is there an alert?" rather than "how many?", EXISTS answers it with zero fan-out risk.' }
],
body: [
 { h: 'The grain rule', html:
   '<p>Every join changes the <em class="hl">grain</em> — what one row means. Before you write a join, say the grain out loud:</p>' +
   '<div class="pre">before: one row per transfer\njoin to alerts on src_wallet (not unique per wallet)\nafter:  one row per <b>transfer × alert on its source wallet</b>\n\n→ any SUM(amount_usd) after this point is wrong</div>' +
   '<p>A join is safe if and only if the right-hand table is <strong>unique on the join key</strong>. That is a fact about the data, not about the SQL, so you check it rather than assume it.</p>' },
 { h: 'The three fixes', html:
   '<table><thead><tr><th>Situation</th><th>Fix</th></tr></thead><tbody>' +
   '<tr><td>You need an aggregate from the many-side</td><td>Pre-aggregate in a CTE, then join one-to-one</td></tr>' +
   '<tr><td>You only need existence</td><td><code>EXISTS</code> — a semi-join</td></tr>' +
   '<tr><td>You need one specific related row</td><td>Rank in a window and take rank 1 before joining</td></tr>' +
   '</tbody></table>' },
 { h: 'The guard you can automate', html:
   '<p>In a pipeline, make it a test rather than a habit. A row-count assertion before and after a join is one of the cheapest data-quality gates there is, and it catches upstream duplicate-key regressions that no schema check will.</p>' +
   '<div class="pre code">assert count_after == count_before      <i>one-to-one or one-to-optional join</i>\nassert count_after &gt;= count_before     <i>deliberate expansion — document why</i></div>' }
],
call: '"Before joining I check that the right-hand table is unique on the join key, because a non-unique key fans out the fact rows and every downstream SUM inherits the multiplication — it is silent, and it is the most common cause of an inflated metric."',
warn: 'SELECT DISTINCT is not a fix for fan-out. It hides duplicate rows but leaves the aggregate wrong wherever the duplicated rows differ in any column, and it adds a sort. If you find yourself adding DISTINCT to make a number look right, you have a grain bug.',
qf: [
 ['What is join fan-out?', 'A join to a table that is not unique on the key multiplies the fact rows, inflating every downstream aggregate.'],
 ['How do you detect it?', 'GROUP BY the join key on the right table with HAVING COUNT(*) > 1 — and compare row counts before and after.'],
 ['How do you fix it?', 'Pre-aggregate the many-side to one row per key, use EXISTS if you only need a flag, or rank and take the top row.'],
 ['Does SELECT DISTINCT fix it?', 'No. It masks duplicate rows and leaves aggregates wrong; it is a symptom, not a cure.'],
 ['What is "grain"?', 'What exactly one row represents. Every join changes it, and stating it out loud prevents most join bugs.']
]});
/* ══════════════ TRACK A · AGGREGATION ══════════════ */

M.push({
code: 'A1', track: 'Track A · Aggregation', title: 'GROUP BY and the aggregate functions',
sub: 'Collapsing rows into groups — and the rule about what may appear in the SELECT list.',
lede: 'Aggregation is the point of analytical SQL. The mechanics are easy; the two things that trip candidates are the <em class="hl">single-value rule</em> (every SELECT expression must be either grouped or aggregated) and the fact that different aggregates treat NULLs differently.',
ex: [
 { t: 'The standard shape',
   sql: "SELECT d.dept_name,\n       COUNT(*) AS headcount,\n       ROUND(AVG(e.salary)) AS avg_salary,\n       MIN(e.salary) AS lowest,\n       MAX(e.salary) AS highest,\n       SUM(e.salary) AS payroll\nFROM employees e\nJOIN departments d ON e.dept_id = d.dept_id\nGROUP BY d.dept_name\nORDER BY payroll DESC",
   note: 'Every non-aggregated column in SELECT (dept_name) appears in GROUP BY. That is the rule, and MySQL is the only common engine that will sometimes let you break it.' },
 { t: 'Grouping on an expression',
   sql: "SELECT DATE_FORMAT(sale_date, '%Y-%m') AS month,\n       COUNT(*) AS sales,\n       SUM(amount) AS revenue,\n       ROUND(AVG(amount), 2) AS avg_ticket\nFROM sales\nGROUP BY DATE_FORMAT(sale_date, '%Y-%m')\nORDER BY month",
   note: 'You can group by any expression. Repeat it in GROUP BY, or use the ordinal (GROUP BY 1) in ad-hoc work — MySQL and Spark accept the alias too, Postgres does not.' },
 { t: 'Multi-column grouping',
   sql: "SELECT w.chain, w.risk_band, COUNT(*) AS wallets\nFROM wallets w\nGROUP BY w.chain, w.risk_band\nORDER BY w.chain, wallets DESC",
   note: 'The group key is the tuple. Note that the NULL risk_band forms its own group — GROUP BY treats NULLs as equal even though NULL = NULL is UNKNOWN.' },
 { t: 'Grouping over a join, with the grain stated',
   sql: "SELECT e.name,\n       COUNT(s.sale_id) AS sales,\n       ROUND(AVG(s.amount), 2) AS avg_sale,\n       MAX(s.sale_date) AS last_sale\nFROM employees e\nJOIN sales s ON s.emp_id = e.emp_id\nGROUP BY e.emp_id, e.name\nORDER BY sales DESC",
   note: 'Group by the key (emp_id) as well as the display column (name). Grouping on name alone would merge two people who happen to share a name — a real bug in real data.' }
],
body: [
 { h: 'The aggregates and their NULL behaviour', html:
   '<table><thead><tr><th>Function</th><th>NULL handling</th><th>Note</th></tr></thead><tbody>' +
   '<tr><td>COUNT(*)</td><td>Counts rows including all-NULL ones</td><td>The only one that ignores column values</td></tr>' +
   '<tr><td>COUNT(col)</td><td>Skips NULLs</td><td>Useful as a "how many populated" check</td></tr>' +
   '<tr><td>COUNT(DISTINCT col)</td><td>Skips NULLs, dedupes</td><td>Expensive — needs a sort or hash set</td></tr>' +
   '<tr><td>SUM / AVG</td><td>Skip NULLs</td><td>AVG divides by the non-null count</td></tr>' +
   '<tr><td>MIN / MAX</td><td>Skip NULLs</td><td>Work on strings and dates too</td></tr>' +
   '</tbody></table>' +
   '<p>An aggregate over an empty group returns NULL — except <code>COUNT</code>, which returns 0. That asymmetry is worth remembering when a report shows blanks instead of zeros.</p>' },
 { h: 'The single-value rule', html:
   '<p>After grouping, each group is one output row, so every SELECT expression must produce exactly one value per group: it is either <strong>in the GROUP BY</strong> or <strong>inside an aggregate</strong>. Anything else is ambiguous.</p>' +
   '<div class="pre code">SELECT dept_id, name, COUNT(*) FROM employees GROUP BY dept_id\n   <u>which name? Postgres/Spark: error. MySQL without ONLY_FULL_GROUP_BY: silently picks one</u>\n\nSELECT dept_id, MAX(name), COUNT(*) FROM employees GROUP BY dept_id\n   <i>unambiguous</i></div>' },
 { h: 'ROLLUP — subtotals for free', html:
   '<p>Where supported (MySQL, Postgres, Spark, Redshift), <code>GROUP BY … WITH ROLLUP</code> adds subtotal and grand-total rows with NULLs in the rolled-up columns. Useful for finance-style reports; the giveaway in an interview is knowing <code>GROUPING()</code> distinguishes a real NULL from a rollup NULL.</p>' }
],
call: '"After a GROUP BY, every projected expression must be grouped or aggregated. MySQL will sometimes let that slide, which is why I enable ONLY_FULL_GROUP_BY — the same query in Postgres or Spark would simply reject it."',
warn: 'COUNT(DISTINCT x) is not free. It cannot be computed from partial sums, so in a distributed engine it forces a shuffle of the distinct values. On a lakehouse, approximate variants (APPROX_COUNT_DISTINCT / approx_count_distinct) are the standard answer at scale.',
qf: [
 ['What must appear in GROUP BY?', 'Every SELECT expression that is not inside an aggregate.'],
 ['COUNT(*) vs COUNT(col) vs COUNT(DISTINCT col)?', 'Rows / non-NULL values / distinct non-NULL values.'],
 ['What does SUM return over an empty group?', 'NULL. COUNT returns 0 — that asymmetry catches people.'],
 ['Does GROUP BY put all NULLs in one group?', 'Yes, unlike equality comparison.'],
 ['Why is COUNT(DISTINCT) expensive at scale?', 'It is not decomposable into partial aggregates, so it needs a shuffle; use an approximate function when precision is not required.']
]});

M.push({
code: 'A2', track: 'Track A · Aggregation', title: 'WHERE vs HAVING',
sub: 'Filter rows before grouping or groups after — and why picking wrong changes the answer.',
lede: 'Both clauses filter, so candidates treat them as interchangeable and get caught. They run at different steps over different things: <code>WHERE</code> sees individual rows, <code>HAVING</code> sees whole groups. Move a condition between them and the result changes — deliberately.',
ex: [
 { t: 'WHERE — filter rows, then group what is left',
   sql: "SELECT dept_id, COUNT(*) AS senior_headcount, ROUND(AVG(salary)) AS avg_senior_salary\nFROM employees\nWHERE salary >= 90000\nGROUP BY dept_id\nORDER BY dept_id",
   note: 'Only high earners enter the grouping, so the counts and averages describe high earners. Departments with no high earners disappear entirely — they have no rows to group.' },
 { t: 'HAVING — group everything, then drop whole groups',
   sql: "SELECT dept_id, COUNT(*) AS headcount, ROUND(AVG(salary)) AS avg_salary\nFROM employees\nGROUP BY dept_id\nHAVING AVG(salary) >= 90000\nORDER BY avg_salary DESC",
   note: 'Every employee is counted, then departments whose average falls below 90000 are removed as units. Different question, different answer — compare the counts with the previous example.' },
 { t: 'Both at once — the common real shape',
   sql: "SELECT e.dept_id, COUNT(*) AS recent_hires, ROUND(AVG(e.salary)) AS avg_salary\nFROM employees e\nWHERE e.hire_date >= '2021-01-01'\nGROUP BY e.dept_id\nHAVING COUNT(*) >= 2\nORDER BY recent_hires DESC",
   note: 'WHERE narrows the population (recent hires only), HAVING narrows the groups (departments with at least two of them). Read as: "of recent hires, which departments have two or more?"' },
 { t: 'HAVING on something not in SELECT',
   sql: "SELECT src_wallet, COUNT(*) AS outbound\nFROM transfers\nGROUP BY src_wallet\nHAVING SUM(amount_usd) > 20000\nORDER BY outbound DESC, src_wallet",
   note: 'HAVING can reference any aggregate, not only the ones you projected. The filter is on total volume; the output shows only the count.' }
],
body: [
 { h: 'The distinction in one table', html:
   '<table><thead><tr><th></th><th>WHERE</th><th>HAVING</th></tr></thead><tbody>' +
   '<tr><td>Runs at</td><td>Step 2 — before grouping</td><td>Step 4 — after grouping</td></tr>' +
   '<tr><td>Operates on</td><td>Individual rows</td><td>Whole groups</td></tr>' +
   '<tr><td>Can use aggregates</td><td>No</td><td>Yes</td></tr>' +
   '<tr><td>Can use SELECT aliases</td><td>No</td><td>MySQL yes, standard no</td></tr>' +
   '<tr><td>Effect on empty groups</td><td>Removes source rows, so groups vanish</td><td>Removes the group after it is formed</td></tr>' +
   '</tbody></table>' },
 { h: 'Performance: filter early', html:
   '<p>Anything that can go in <code>WHERE</code> should. It reduces the row set <em class="hl">before</em> the grouping shuffle, which in a distributed engine is the expensive part. Putting a row-level predicate in HAVING is not wrong, it is just slower — you paid to group rows you then threw away.</p>' +
   '<div class="pre code">GROUP BY dept_id HAVING dept_id = 10     <u>groups all departments, then keeps one</u>\nWHERE dept_id = 10 GROUP BY dept_id      <i>groups one department</i></div>' }
],
call: '"WHERE filters rows before the grouping shuffle, HAVING filters groups after it, so I push every row-level predicate into WHERE — in a distributed engine that shrinks the data before the expensive step."',
warn: 'Moving a condition from WHERE to HAVING can change the result, not just the speed. WHERE removes rows so a group may never form; HAVING removes a group that did form. If a department disappeared from your report, check which clause you used.',
qf: [
 ['WHERE vs HAVING?', 'WHERE filters rows before grouping and cannot see aggregates; HAVING filters groups after and can.'],
 ['Can HAVING reference a column not in SELECT?', 'Yes, as long as it is grouped or wrapped in an aggregate.'],
 ['Which is faster for a row-level predicate?', 'WHERE — it cuts data before the shuffle.'],
 ['Can you use HAVING without GROUP BY?', 'Yes; the whole result acts as one group.'],
 ['Does swapping WHERE and HAVING always give the same rows?', 'No. WHERE can prevent a group from existing at all.']
]});

M.push({
code: 'A3', track: 'Track A · Aggregation', title: 'Conditional aggregation and pivoting',
sub: 'Turning rows into columns with CASE inside an aggregate — the portable PIVOT.',
lede: 'Reports want columns; tables store rows. The bridge is a <code>CASE</code> inside an aggregate, one per output column. It is more verbose than a <code>PIVOT</code> clause and infinitely more portable — the same statement runs on MySQL, Postgres, Athena, Redshift and Spark SQL unchanged.',
ex: [
 { t: 'Rows to columns',
   sql: "SELECT w.chain,\n  COUNT(*) AS wallets,\n  SUM(CASE WHEN w.risk_band = 'high'   THEN 1 ELSE 0 END) AS high,\n  SUM(CASE WHEN w.risk_band = 'medium' THEN 1 ELSE 0 END) AS medium,\n  SUM(CASE WHEN w.risk_band = 'low'    THEN 1 ELSE 0 END) AS low,\n  SUM(CASE WHEN w.risk_band IS NULL    THEN 1 ELSE 0 END) AS unclassified\nFROM wallets w\nGROUP BY w.chain\nORDER BY wallets DESC",
   note: 'One conditional aggregate per column. The IS NULL branch matters — without it, unclassified wallets are counted in the total but in none of the bands, and the row does not add up.' },
 { t: 'Conditional sums and a rate',
   sql: "SELECT src_wallet,\n  COUNT(*) AS txns,\n  ROUND(SUM(CASE WHEN is_flagged = 1 THEN amount_usd ELSE 0 END), 2) AS flagged_volume,\n  ROUND(SUM(CASE WHEN is_flagged = 0 THEN amount_usd ELSE 0 END), 2) AS clean_volume,\n  ROUND(100.0 * SUM(is_flagged) / COUNT(*), 1) AS flag_rate_pct\nFROM transfers\nGROUP BY src_wallet\nORDER BY flag_rate_pct DESC, flagged_volume DESC",
   note: 'When the flag is already 0/1, SUM(flag) is the count of flagged rows and AVG(flag) is the rate directly — a shortcut worth knowing.' },
 { t: 'A monthly matrix',
   sql: "SELECT e.name,\n  SUM(CASE WHEN DATE_FORMAT(s.sale_date,'%Y-%m') = '2026-01' THEN s.amount ELSE 0 END) AS jan,\n  SUM(CASE WHEN DATE_FORMAT(s.sale_date,'%Y-%m') = '2026-02' THEN s.amount ELSE 0 END) AS feb,\n  SUM(CASE WHEN DATE_FORMAT(s.sale_date,'%Y-%m') = '2026-03' THEN s.amount ELSE 0 END) AS mar,\n  SUM(s.amount) AS total\nFROM employees e\nJOIN sales s ON s.emp_id = e.emp_id\nGROUP BY e.emp_id, e.name\nORDER BY total DESC",
   note: 'The classic cross-tab. Note that the columns are hard-coded — a pivot in SQL always requires knowing the columns in advance, which is why dynamic pivots are generated by application code.' },
 { t: 'Filtering inside COUNT DISTINCT',
   sql: "SELECT rule_code,\n  COUNT(*) AS alerts,\n  COUNT(DISTINCT wallet_id) AS distinct_wallets,\n  COUNT(DISTINCT CASE WHEN severity = 'high' THEN wallet_id END) AS high_sev_wallets\nFROM alerts\nGROUP BY rule_code\nORDER BY alerts DESC",
   note: 'A CASE without ELSE yields NULL, and COUNT DISTINCT skips NULLs — so this counts distinct wallets among high-severity alerts only. A neat, very common idiom.' }
],
body: [
 { h: 'The two idioms', html:
   '<div class="pre code">SUM(CASE WHEN cond THEN 1 ELSE 0 END)     <i>count of matching rows</i>\nCOUNT(CASE WHEN cond THEN 1 END)          <i>same thing — NULLs are skipped</i>\nSUM(CASE WHEN cond THEN amt ELSE 0 END)   <i>conditional total</i>\nAVG(CASE WHEN cond THEN 1.0 ELSE 0 END)   <i>rate, 0–1</i>\nCOUNT(DISTINCT CASE WHEN cond THEN id END)<i>distinct within a subset</i></div>' +
   '<p>Postgres and Spark also support <code>COUNT(*) FILTER (WHERE cond)</code>, which is cleaner but not portable to MySQL.</p>' },
 { h: 'Pivot vs unpivot', html:
   '<p><strong>Pivot</strong> (rows → columns) is conditional aggregation. <strong>Unpivot</strong> (columns → rows) is a <code>UNION ALL</code> of one SELECT per column, or <code>LATERAL VIEW explode</code> in Spark. Long format is almost always the better storage choice; pivot at the presentation layer, not in the warehouse.</p>' }
],
call: '"I pivot with conditional aggregation rather than a PIVOT clause — one SUM with a CASE per column — because it is identical across MySQL, Athena and Spark SQL, and the same transformation then runs in both my batch and ad-hoc paths."',
warn: 'A pivot always hard-codes its columns. If a new risk band appears next month, the report silently omits it and the columns no longer sum to the total. Add a total column and a reconciliation check, or generate the SQL from the distinct values.',
qf: [
 ['How do you pivot without a PIVOT clause?', 'One conditional aggregate per output column: SUM(CASE WHEN … THEN … ELSE 0 END).'],
 ['SUM(flag) when flag is 0/1?', 'The count of flagged rows; AVG(flag) is the rate.'],
 ['How do you count distinct within a subset?', 'COUNT(DISTINCT CASE WHEN cond THEN id END) — the CASE yields NULL outside the subset and COUNT skips it.'],
 ['What is the weakness of a SQL pivot?', 'Columns are fixed at write time; new categories are silently dropped.'],
 ['Portable alternative to FILTER (WHERE …)?', 'CASE inside the aggregate — FILTER is Postgres/Spark only.']
]});

M.push({
code: 'A4', track: 'Track A · Aggregation', title: 'Counting correctly',
sub: 'COUNT(*), COUNT(col), COUNT(DISTINCT) — three different questions that look the same.',
lede: 'Almost every disputed number in a data team traces back to a counting definition. Distinct users or user-sessions? Rows or populated values? Counted before or after the join? A candidate who can articulate this precisely is signalling something more valuable than SQL syntax.',
ex: [
 { t: 'The three counts side by side',
   sql: "SELECT COUNT(*) AS rows_total,\n       COUNT(analyst_id) AS assigned_alerts,\n       COUNT(DISTINCT analyst_id) AS distinct_analysts,\n       COUNT(DISTINCT wallet_id) AS distinct_wallets,\n       COUNT(*) - COUNT(analyst_id) AS unassigned\nFROM alerts",
   note: 'Six alert rows, five assigned, two analysts, four wallets. Every number answers a different question and only one of them is "how many alerts".' },
 { t: 'Counting after a join — the trap',
   sql: "SELECT COUNT(*) AS joined_rows,\n       COUNT(DISTINCT t.txn_id) AS actual_transfers\nFROM transfers t\nLEFT JOIN alerts a ON a.wallet_id = t.src_wallet",
   note: 'The joined row count exceeds the true transfer count because of fan-out. COUNT(DISTINCT key) recovers the truth — but relying on it is a patch; fix the grain instead (see J5).' },
 { t: 'Counting the zero cases',
   sql: "SELECT w.wallet_id, w.risk_band,\n       COUNT(a.alert_id) AS alerts\nFROM wallets w\nLEFT JOIN alerts a ON a.wallet_id = w.wallet_id\nGROUP BY w.wallet_id, w.risk_band\nORDER BY alerts DESC, w.wallet_id",
   note: 'COUNT(a.alert_id) gives a true 0 for wallets with no alerts. COUNT(*) here would return 1 for those wallets, because the outer-joined NULL row still counts.' },
 { t: 'Ratios that survive empty groups',
   sql: "SELECT w.chain,\n       COUNT(DISTINCT w.wallet_id) AS wallets,\n       COUNT(a.alert_id) AS alerts,\n       ROUND(1.0 * COUNT(a.alert_id) / NULLIF(COUNT(DISTINCT w.wallet_id), 0), 2) AS alerts_per_wallet\nFROM wallets w\nLEFT JOIN alerts a ON a.wallet_id = w.wallet_id\nGROUP BY w.chain\nORDER BY alerts_per_wallet DESC",
   note: 'The 1.0 multiplier forces float division in engines that do integer division. NULLIF guards the empty denominator. Both are habits worth having.' }
],
body: [
 { h: 'Pick the right count', html:
   '<table><thead><tr><th>Question</th><th>Expression</th></tr></thead><tbody>' +
   '<tr><td>How many rows?</td><td><code>COUNT(*)</code></td></tr>' +
   '<tr><td>How many have a value?</td><td><code>COUNT(col)</code></td></tr>' +
   '<tr><td>How many different values?</td><td><code>COUNT(DISTINCT col)</code></td></tr>' +
   '<tr><td>How many after an outer join, with zeros?</td><td><code>COUNT(right_table.key)</code></td></tr>' +
   '<tr><td>How many matching a condition?</td><td><code>COUNT(CASE WHEN cond THEN 1 END)</code></td></tr>' +
   '</tbody></table>' },
 { h: 'Integer division', html:
   '<p>MySQL and Postgres divide integers as integers: <code>3 / 4</code> is 0. Multiply by <code>1.0</code>, or cast, before dividing counts. Athena/Presto and Spark behave the same way for integer types. This is a genuinely common silent bug in rate calculations.</p>' },
 { h: 'At scale', html:
   '<p>Exact <code>COUNT(DISTINCT)</code> requires seeing every value, which means a shuffle. Every warehouse offers a HyperLogLog approximation — <code>APPROX_COUNT_DISTINCT</code> in Athena/Presto and Spark, <code>APPROXIMATE COUNT(DISTINCT …)</code> in Redshift — typically within about two percent, at a fraction of the cost. Knowing when approximate is acceptable is a platform-engineering judgement, not a SQL one.</p>' }
],
call: '"COUNT(*) counts rows, COUNT(col) counts populated values, COUNT(DISTINCT col) counts unique values — and after a LEFT JOIN I count the right-hand key so that no-match rows come through as a genuine zero."',
warn: 'If you find yourself adding COUNT(DISTINCT id) to make a number match, stop — you are compensating for a fan-out. Fix the join grain instead; the distinct count masks the problem only for that one metric, and every SUM in the same query is still wrong.',
qf: [
 ['COUNT(*) vs COUNT(col)?', 'Rows versus non-NULL values of that column.'],
 ['Why does COUNT(*) return 1 for a no-match LEFT JOIN row?', 'The outer join produced a row with NULLs, and COUNT(*) counts rows regardless of content.'],
 ['Why multiply by 1.0 in a ratio?', 'Integer division truncates; forcing a float gives the real rate.'],
 ['Cheap alternative to COUNT(DISTINCT) at scale?', 'APPROX_COUNT_DISTINCT — HyperLogLog, roughly two percent error, no full shuffle of distinct values.'],
 ['Is COUNT(DISTINCT) a valid fix for duplicated rows?', 'No — it patches one metric and leaves the underlying grain bug in place.']
]});
/* ══════════════ TRACK S · SUBQUERIES & CTEs ══════════════ */

M.push({
code: 'S1', track: 'Track S · Subqueries & CTEs', title: 'Scalar, list and derived-table subqueries',
sub: 'A query inside a query — in the SELECT list, in WHERE, or standing in for a table.',
lede: 'Subqueries come in three shapes depending on what they return: one value, one column, or a whole table. Knowing which shape you have tells you where it is legal and roughly what it costs — and it is the vocabulary an interviewer expects you to use.',
ex: [
 { t: 'Scalar subquery in WHERE',
   sql: "SELECT name, dept_id, salary\nFROM employees\nWHERE salary > (SELECT AVG(salary) FROM employees)\nORDER BY salary DESC",
   note: 'The inner query returns exactly one value, computed once for the whole statement. If it ever returned more than one row, the query would error.' },
 { t: 'Scalar subquery in the SELECT list',
   sql: "SELECT name, salary,\n       (SELECT ROUND(AVG(salary)) FROM employees) AS company_avg,\n       salary - (SELECT ROUND(AVG(salary)) FROM employees) AS vs_avg\nFROM employees\nORDER BY vs_avg DESC",
   note: 'Legal and readable, but a window function — AVG(salary) OVER () — does the same job in one pass. Prefer the window version once you know it.' },
 { t: 'List subquery with IN',
   sql: "SELECT wallet_id, address, risk_band\nFROM wallets\nWHERE wallet_id IN (SELECT DISTINCT src_wallet FROM transfers WHERE amount_usd > 9000)\nORDER BY wallet_id",
   note: 'Returns one column, used as a set. Semantically a semi-join: each wallet appears once no matter how many large transfers it sent.' },
 { t: 'Derived table — a subquery in FROM',
   sql: "SELECT band, COUNT(*) AS wallets, ROUND(AVG(vol), 2) AS avg_volume\nFROM (\n  SELECT w.wallet_id,\n         COALESCE(w.risk_band, 'unclassified') AS band,\n         COALESCE(SUM(t.amount_usd), 0) AS vol\n  FROM wallets w\n  LEFT JOIN transfers t ON t.src_wallet = w.wallet_id\n  GROUP BY w.wallet_id, w.risk_band\n) per_wallet\nGROUP BY band\nORDER BY avg_volume DESC",
   note: 'Aggregating twice at two grains: first per wallet, then per band. A derived table must have an alias — that is the error people hit first.' }
],
body: [
 { h: 'The three shapes', html:
   '<table><thead><tr><th>Shape</th><th>Returns</th><th>Legal in</th></tr></thead><tbody>' +
   '<tr><td>Scalar</td><td>One row, one column</td><td>SELECT list, WHERE, HAVING, anywhere a value fits</td></tr>' +
   '<tr><td>List / column</td><td>One column, many rows</td><td><code>IN</code>, <code>ANY</code>, <code>ALL</code></td></tr>' +
   '<tr><td>Derived table</td><td>A full result set</td><td><code>FROM</code>, <code>JOIN</code> — must be aliased</td></tr>' +
   '</tbody></table>' },
 { h: 'Two-level aggregation', html:
   '<p>"Average of the per-wallet totals" is not <code>AVG(amount)</code> — that is the average transfer. You must aggregate to the wallet grain first, then average those. Any question phrased <em class="hl">"average number of X per Y"</em> is a two-level aggregation and needs a derived table or CTE.</p>' },
 { h: 'Derived table vs CTE', html:
   '<p>Functionally equivalent. A CTE is named at the top and can be referenced more than once, which usually makes it the better choice — see S3. Modern optimisers treat them almost identically; the old advice that CTEs are "optimisation fences" is out of date in MySQL 8, Postgres 12+, Spark and Athena.</p>' }
],
call: '"Any question of the form \'average X per Y\' is two-level aggregation — I aggregate to the Y grain in a derived table or CTE first, then aggregate that, because averaging the raw rows answers a different question."',
warn: 'A scalar subquery that unexpectedly returns two rows fails at runtime, not at parse time — so it passes review and breaks when the data changes. If the subquery could ever return more than one row, add a LIMIT 1 with an explicit ORDER BY, or restructure as a join.',
qf: [
 ['What is a scalar subquery?', 'One returning a single row and column, usable anywhere a value is expected.'],
 ['What must a derived table have?', 'An alias.'],
 ['How do you compute "average sales per employee"?', 'Aggregate per employee first, then average that result — two levels.'],
 ['IN (subquery) is semantically what?', 'A semi-join — membership, with no fan-out.'],
 ['Are CTEs slower than derived tables?', 'Not in current MySQL 8, Postgres 12+, Spark or Athena. The optimisation-fence warning is outdated.']
]});

M.push({
code: 'S2', track: 'Track S · Subqueries & CTEs', title: 'Correlated subqueries and EXISTS',
sub: 'A subquery that reads the outer row — powerful, expressive, and the classic performance trap.',
lede: 'A correlated subquery references a column from the outer query, so it cannot be computed once — conceptually it runs per outer row. That makes it the most direct way to express "for each row, check something related", and also the reason a query that reads beautifully takes four minutes.',
ex: [
 { t: 'Correlated: above your own department average',
   sql: "SELECT e.name, e.dept_id, e.salary\nFROM employees e\nWHERE e.salary > (\n  SELECT AVG(e2.salary) FROM employees e2 WHERE e2.dept_id = e.dept_id\n)\nORDER BY e.dept_id, e.salary DESC",
   note: 'The inner query depends on e.dept_id from the outer row, so it is re-evaluated per department. Reads exactly like the question.' },
 { t: 'The window-function rewrite',
   sql: "WITH x AS (\n  SELECT name, dept_id, salary,\n         AVG(salary) OVER (PARTITION BY dept_id) AS dept_avg\n  FROM employees\n)\nSELECT name, dept_id, salary, ROUND(dept_avg) AS dept_avg\nFROM x\nWHERE salary > dept_avg\nORDER BY dept_id, salary DESC",
   note: 'Identical rows, one pass over the data instead of one pass per group. This rewrite — correlated aggregate to window function — is the single highest-value SQL optimisation to be able to demonstrate.' },
 { t: 'EXISTS — stop at the first match',
   sql: "SELECT w.wallet_id, w.risk_band\nFROM wallets w\nWHERE EXISTS (\n  SELECT 1 FROM transfers t\n  WHERE t.src_wallet = w.wallet_id AND t.amount_usd > 9000\n)\nORDER BY w.wallet_id",
   note: 'SELECT 1 is idiomatic: EXISTS only cares whether a row came back, never what is in it. The engine can stop scanning after the first hit.' },
 { t: 'Correlated scalar in the SELECT list',
   sql: "SELECT e.name,\n       (SELECT COUNT(*) FROM sales s WHERE s.emp_id = e.emp_id) AS sales,\n       (SELECT MAX(s.sale_date) FROM sales s WHERE s.emp_id = e.emp_id) AS last_sale\nFROM employees e\nWHERE e.dept_id = 30\nORDER BY sales DESC",
   note: 'Two correlated subqueries means two passes over sales per employee. One LEFT JOIN with GROUP BY does it in a single pass — and this is exactly the pattern an interviewer will ask you to rewrite.' }
],
body: [
 { h: 'Correlated or not?', html:
   '<p>The test is one question: <strong>does the inner query reference an outer column?</strong> If yes it is correlated and conceptually runs per row; if no it is computed once and reused.</p>' +
   '<div class="pre code">WHERE salary &gt; (SELECT AVG(salary) FROM employees)            <i>uncorrelated — one evaluation</i>\nWHERE salary &gt; (SELECT AVG(salary) FROM employees e2\n                 WHERE e2.dept_id = e.dept_id)               <u>correlated — per outer row</u></div>' +
   '<p>"Conceptually" matters: modern optimisers frequently <em class="hl">decorrelate</em> these into a join plus aggregate automatically. Do not claim it is always slow — say it risks being slow, and that you would check the plan.</p>' },
 { h: 'The rewrite table', html:
   '<table><thead><tr><th>Correlated pattern</th><th>Rewrite as</th></tr></thead><tbody>' +
   '<tr><td>Aggregate over the row\u2019s own group</td><td>Window function with PARTITION BY</td></tr>' +
   '<tr><td>Existence check</td><td>EXISTS (already optimal) or a semi-join</td></tr>' +
   '<tr><td>Several per-row lookups on one table</td><td>One LEFT JOIN + GROUP BY</td></tr>' +
   '<tr><td>"Latest related row"</td><td>ROW_NUMBER() = 1 in a CTE, then join</td></tr>' +
   '</tbody></table>' },
 { h: 'IN vs EXISTS', html:
   '<p>Largely interchangeable for existence. <code>EXISTS</code> is NULL-safe and short-circuits; <code>IN</code> reads better with a literal list. For the negated forms the difference is decisive: <code>NOT EXISTS</code> is safe, <code>NOT IN</code> is not (see F3).</p>' }
],
call: '"A correlated aggregate — comparing each row to its own group\u2019s average — is the textbook case for a window function: same result, one pass instead of one per group. I would confirm it on the plan, since modern optimisers often decorrelate it anyway."',
warn: 'Do not say "correlated subqueries are always slow". MySQL 8, Postgres and Spark all decorrelate many of them into joins. The defensible statement is that it depends on the plan, and that the window rewrite removes the uncertainty.',
qf: [
 ['What makes a subquery correlated?', 'It references a column from the outer query, so it cannot be evaluated independently.'],
 ['Why SELECT 1 inside EXISTS?', 'EXISTS only tests whether a row exists; the projection is never used.'],
 ['How do you rewrite a correlated group aggregate?', 'As a window function with PARTITION BY, then filter in an outer query.'],
 ['IN vs EXISTS?', 'Similar for existence; EXISTS short-circuits and is NULL-safe. For negation, NOT EXISTS is the only safe choice.'],
 ['Are correlated subqueries always slow?', 'No — optimisers frequently decorrelate them. The honest answer is to check the execution plan.']
]});

M.push({
code: 'S3', track: 'Track S · Subqueries & CTEs', title: 'Common table expressions',
sub: 'WITH — naming each step so a complex query becomes readable and testable.',
lede: 'A CTE is a named subquery declared before the main statement. It buys three things: readability, reuse of the same intermediate result in more than one place, and — most importantly for pipeline work — a query you can debug by running one block at a time.',
ex: [
 { t: 'One CTE, referenced twice',
   sql: "WITH dept_stats AS (\n  SELECT dept_id, ROUND(AVG(salary)) AS avg_sal, COUNT(*) AS headcount\n  FROM employees\n  WHERE dept_id IS NOT NULL\n  GROUP BY dept_id\n)\nSELECT e.name, e.dept_id, e.salary, s.avg_sal, s.headcount,\n       e.salary - s.avg_sal AS vs_dept\nFROM employees e\nJOIN dept_stats s ON e.dept_id = s.dept_id\nWHERE e.salary > s.avg_sal\nORDER BY vs_dept DESC",
   note: 'The aggregate is computed once and both joined and filtered against. As a derived table you would have had to repeat it or nest it.' },
 { t: 'Chained CTEs — each step readable',
   sql: "WITH flagged AS (\n  SELECT * FROM transfers WHERE is_flagged = 1\n),\nby_wallet AS (\n  SELECT src_wallet AS wallet_id, COUNT(*) AS flagged_txns, SUM(amount_usd) AS flagged_volume\n  FROM flagged GROUP BY src_wallet\n),\nenriched AS (\n  SELECT b.*, w.risk_band, w.chain\n  FROM by_wallet b JOIN wallets w ON w.wallet_id = b.wallet_id\n)\nSELECT wallet_id, chain, risk_band, flagged_txns, ROUND(flagged_volume, 2) AS flagged_volume\nFROM enriched\nORDER BY flagged_volume DESC",
   note: 'Three named steps: filter, aggregate, enrich. Each can be tested alone by selecting from it — this is what makes CTEs the right shape for pipeline SQL and for dbt models.' },
 { t: 'Two independent CTEs combined',
   sql: "WITH sent AS (\n  SELECT src_wallet AS wallet_id, COUNT(*) AS out_n, SUM(amount_usd) AS out_vol\n  FROM transfers GROUP BY src_wallet\n),\nreceived AS (\n  SELECT dst_wallet AS wallet_id, COUNT(*) AS in_n, SUM(amount_usd) AS in_vol\n  FROM transfers GROUP BY dst_wallet\n)\nSELECT w.wallet_id, w.risk_band,\n       COALESCE(s.out_n, 0) AS sent_n, COALESCE(r.in_n, 0) AS recv_n,\n       ROUND(COALESCE(r.in_vol, 0) - COALESCE(s.out_vol, 0), 2) AS net_flow\nFROM wallets w\nLEFT JOIN sent s ON s.wallet_id = w.wallet_id\nLEFT JOIN received r ON r.wallet_id = w.wallet_id\nORDER BY net_flow DESC",
   note: 'Net flow per wallet — a genuine fraud feature. Two aggregations at the same grain, joined back onto the dimension. A negative net flow with high volume is the pass-through signature.' }
],
body: [
 { h: 'Why CTEs are the right default', html:
   '<ul>' +
   '<li><strong>Debuggable.</strong> Replace the final SELECT with <code>SELECT * FROM by_wallet</code> and inspect any step.</li>' +
   '<li><strong>Reusable.</strong> One definition, referenced multiple times in the same statement.</li>' +
   '<li><strong>Linear.</strong> Reads top to bottom, unlike nested subqueries which read inside out.</li>' +
   '<li><strong>The dbt idiom.</strong> Model files are conventionally a chain of CTEs ending in one final SELECT — worth naming if the role touches dbt.</li>' +
   '</ul>' },
 { h: 'The limits', html:
   '<p>A CTE is not a temp table: it is not indexed and, in most engines, not persisted. If the same expensive CTE is referenced many times and the plan shows it being recomputed, materialise it deliberately — a temp table, or <code>MATERIALIZED</code> in Postgres, or <code>CACHE TABLE</code> in Spark.</p>' +
   '<p>Also: a CTE cannot be referenced by a <em class="hl">later</em> statement, and in standard SQL a CTE can only reference CTEs declared before it.</p>' }
],
call: '"I structure non-trivial SQL as a chain of CTEs — filter, aggregate, enrich, select — because each step is independently testable, which is the same reason dbt models are written that way."',
warn: 'A CTE referenced five times may be computed five times. If a plan shows repeated scans of an expensive CTE, materialise it explicitly rather than assuming the optimiser will cache it.',
qf: [
 ['What is a CTE?', 'A named temporary result set defined with WITH, valid for the statement that follows.'],
 ['CTE vs derived table?', 'Same power; the CTE is named, reusable within the statement, and reads top-down.'],
 ['How do you debug a long CTE chain?', 'Replace the final SELECT with a SELECT * from any intermediate CTE.'],
 ['Is a CTE materialised?', 'Usually not — it may be inlined and recomputed per reference. Materialise deliberately when that hurts.'],
 ['Why do dbt models use CTE chains?', 'Each step is nameable and testable, and the model ends in a single final SELECT.']
]});

M.push({
code: 'S4', track: 'Track S · Subqueries & CTEs', title: 'Recursive CTEs',
sub: 'Anchor + UNION ALL + recursive member — hierarchies, date spines and graph walks.',
lede: 'A recursive CTE is the one construct in SQL that can iterate. It walks trees (org charts, category hierarchies, chart of accounts), generates sequences (date spines), and traverses graphs to a bounded depth — which is exactly the transfer-chain problem in blockchain fraud work.',
ex: [
 { t: 'Walk the org chart with depth',
   sql: "WITH RECURSIVE chain AS (\n  SELECT emp_id, name, manager_id, 1 AS lvl, name AS path\n  FROM employees WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.emp_id, e.name, e.manager_id, c.lvl + 1, CONCAT(c.path, ' > ', e.name)\n  FROM employees e\n  JOIN chain c ON e.manager_id = c.emp_id\n)\nSELECT lvl, emp_id, name, path FROM chain\nORDER BY path",
   note: 'Anchor: everyone with no manager. Recursive member: everyone reporting to a row already found. The path column accumulates the ancestry as it descends.' },
 { t: 'Generate a date spine',
   sql: "WITH RECURSIVE cal AS (\n  SELECT DATE('2026-02-01') AS d\n  UNION ALL\n  SELECT DATE_ADD(d, INTERVAL 1 DAY) FROM cal WHERE d < '2026-02-10'\n)\nSELECT d, COUNT(t.txn_id) AS transfers, COALESCE(ROUND(SUM(t.amount_usd), 2), 0) AS volume\nFROM cal LEFT JOIN transfers t ON t.ts = cal.d\nGROUP BY d ORDER BY d",
   note: 'The termination condition lives in the recursive member\'s WHERE. Without it the CTE never stops — every engine will eventually kill it, but only after burning resources.' },
 { t: 'Traverse a transfer chain',
   sql: "WITH RECURSIVE hop AS (\n  SELECT src_wallet AS origin, dst_wallet AS current_wallet, txn_id, amount_usd, ts, 1 AS depth\n  FROM transfers WHERE src_wallet = 'w-2'\n  UNION ALL\n  SELECT h.origin, t.dst_wallet, t.txn_id, t.amount_usd, t.ts, h.depth + 1\n  FROM transfers t\n  JOIN hop h ON t.src_wallet = h.current_wallet\n  WHERE h.depth < 3 AND t.ts >= h.ts\n)\nSELECT depth, origin, current_wallet, txn_id, amount_usd, ts\nFROM hop ORDER BY depth, txn_id",
   note: 'Following the money from wallet w-2 up to three hops, respecting time order. Both guards matter: the depth cap bounds the work, and the timestamp condition prevents walking backwards through a cycle forever.' }
],
body: [
 { h: 'The shape — memorise it', html:
   '<div class="pre code">WITH RECURSIVE cte AS (\n  &lt;anchor member&gt;          <i>the seed rows — no self-reference</i>\n  UNION ALL\n  &lt;recursive member&gt;       <i>joins back to cte — must shrink towards a stop</i>\n)\nSELECT … FROM cte</div>' +
   '<p>Execution: run the anchor, then repeatedly run the recursive member against <em class="hl">only the rows produced by the previous iteration</em>, until it produces none.</p>' },
 { h: 'Termination — the part that goes wrong', html:
   '<ul>' +
   '<li><strong>A depth cap</strong> (<code>WHERE depth &lt; n</code>) — always, even when the data "should" be acyclic.</li>' +
   '<li><strong>A monotonic condition</strong> — a date that increases, a path that lengthens.</li>' +
   '<li><strong>Cycle detection</strong> — carry a path string and exclude nodes already in it.</li>' +
   '</ul>' +
   '<p>Transaction graphs are genuinely cyclic: money returns to earlier wallets. A recursion with no depth guard on transfer data will not terminate.</p>' },
 { h: 'Dialect notes', html:
   '<table><thead><tr><th>Engine</th><th>Syntax</th></tr></thead><tbody>' +
   '<tr><td>MySQL 8, Postgres, SQLite</td><td><code>WITH RECURSIVE</code></td></tr>' +
   '<tr><td>SQL Server, Oracle</td><td><code>WITH</code> — the keyword RECURSIVE is not used</td></tr>' +
   '<tr><td>Spark SQL</td><td>Not supported historically; use an iterative driver loop</td></tr>' +
   '<tr><td>Athena / Trino</td><td>Limited support; prefer a generated sequence for date spines</td></tr>' +
   '</tbody></table>' }
],
call: '"Recursive CTE is anchor plus UNION ALL plus a recursive member, and on transaction graphs I always carry a depth cap and a monotonic timestamp — the wallet graph is genuinely cyclic, so without both the recursion does not terminate."',
warn: 'Spark SQL has no recursive CTE, so a hierarchy that works in your Postgres prototype will not lift into the batch job unchanged. Either flatten the hierarchy at load time or drive the iteration from the orchestrator.',
qf: [
 ['What are the three parts of a recursive CTE?', 'Anchor member, UNION ALL, and a recursive member that references the CTE.'],
 ['Where does the termination condition go?', 'In the recursive member — usually a depth cap or a monotonic predicate.'],
 ['Why is a depth cap essential on a transfer graph?', 'The graph is cyclic; money flows back to earlier wallets and the recursion never converges.'],
 ['UNION ALL or UNION?', 'UNION ALL. UNION deduplicates each round, which is slower and can mask legitimate repeats.'],
 ['Does Spark SQL support recursive CTEs?', 'Not historically — the traversal has to be flattened at load time or looped in the driver.']
]});
/* ══════════════ TRACK W · WINDOW FUNCTIONS ══════════════ */

M.push({
code: 'W1', track: 'Track W · Window functions', title: 'The window anatomy',
sub: 'PARTITION BY keeps every row; GROUP BY collapses them. That one sentence is the whole topic.',
lede: 'Window functions are the highest-yield advanced SQL topic for data roles and the most common place candidates stall. The mental model is simple: a window function attaches a group-level or running calculation to each row <em class="hl">without removing the row</em>. If a question says "show every row <b>and</b> the department average", it is a window question.',
ex: [
 { t: 'GROUP BY collapses',
   sql: "SELECT dept_id, ROUND(AVG(salary)) AS dept_avg, COUNT(*) AS headcount\nFROM employees\nGROUP BY dept_id\nORDER BY dept_id",
   note: 'Twelve employees in, four rows out. You have the averages but you have lost the people.' },
 { t: 'PARTITION BY keeps',
   sql: "SELECT name, dept_id, salary,\n       ROUND(AVG(salary) OVER (PARTITION BY dept_id)) AS dept_avg,\n       COUNT(*) OVER (PARTITION BY dept_id) AS dept_headcount,\n       salary - ROUND(AVG(salary) OVER (PARTITION BY dept_id)) AS vs_dept\nFROM employees\nORDER BY dept_id, salary DESC",
   note: 'Twelve rows out, each carrying its department average. Same aggregate, no collapse — and no self-join to get it.' },
 { t: 'Empty OVER () — the whole table as one window',
   sql: "SELECT name, salary,\n       ROUND(AVG(salary) OVER ()) AS company_avg,\n       ROUND(100.0 * salary / SUM(salary) OVER (), 2) AS pct_of_payroll\nFROM employees\nORDER BY salary DESC",
   note: 'OVER () with no PARTITION and no ORDER means the entire result set. This is the one-pass way to compute percent-of-total.' },
 { t: 'Two windows in one query',
   sql: "SELECT e.name, e.dept_id, e.salary,\n       RANK() OVER (ORDER BY e.salary DESC) AS company_rank,\n       RANK() OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS dept_rank\nFROM employees e\nORDER BY company_rank",
   note: 'Each OVER clause defines its own independent window. There is no limit on how many you use, and they cost one sort per distinct window definition.' }
],
body: [
 { h: 'The syntax', html:
   '<div class="pre code">function() OVER (\n    PARTITION BY col      <i>split rows into groups — optional</i>\n    ORDER BY col          <i>order within the partition — optional</i>\n    ROWS/RANGE …          <i>frame: which rows count — optional</i>\n)</div>' +
   '<table><thead><tr><th>Clause</th><th>Present</th><th>Absent</th></tr></thead><tbody>' +
   '<tr><td>PARTITION BY</td><td>One window per group</td><td>Whole result set is one window</td></tr>' +
   '<tr><td>ORDER BY</td><td>Aggregates become <b>cumulative</b></td><td>Aggregate covers the whole partition</td></tr>' +
   '<tr><td>Frame</td><td>Explicit row range</td><td>Defaults by whether ORDER BY is present</td></tr>' +
   '</tbody></table>' },
 { h: 'GROUP BY vs PARTITION BY', html:
   '<table><thead><tr><th></th><th>GROUP BY</th><th>PARTITION BY</th></tr></thead><tbody>' +
   '<tr><td>Output rows</td><td>One per group</td><td>One per input row</td></tr>' +
   '<tr><td>Detail columns</td><td>Lost unless aggregated</td><td>Retained</td></tr>' +
   '<tr><td>Filter on the result</td><td>HAVING, same query</td><td>Needs an outer query or CTE</td></tr>' +
   '<tr><td>Runs at</td><td>Step 3</td><td>Step 5</td></tr>' +
   '</tbody></table>' },
 { h: 'Where window functions are not allowed', html:
   '<p><code>WHERE</code>, <code>GROUP BY</code> and <code>HAVING</code> all run before <code>SELECT</code>, so none of them can see a window function. <code>ORDER BY</code> can. Everything else needs a CTE.</p>' }
],
call: '"PARTITION BY attaches a group calculation to every row; GROUP BY collapses rows into one per group. If the question asks for the detail and the aggregate together, it is a window function — no self-join needed."',
warn: 'Every distinct window definition is a sort. Five different OVER clauses can mean five sorts of the same data. Reuse one definition where you can — Postgres and Spark support a named WINDOW clause for exactly this.',
qf: [
 ['PARTITION BY vs GROUP BY?', 'PARTITION BY keeps every row and attaches a calculation; GROUP BY collapses to one row per group.'],
 ['What does OVER () with no clauses mean?', 'The whole result set is a single window — used for percent-of-total.'],
 ['What does adding ORDER BY inside OVER change?', 'Aggregates become cumulative instead of covering the whole partition.'],
 ['Can a window function go in WHERE?', 'No — WHERE runs before SELECT. Use a CTE and filter outside.'],
 ['What is the cost model?', 'Roughly one sort per distinct window definition.']
]});

M.push({
code: 'W2', track: 'Track W · Window functions', title: 'Ranking functions',
sub: 'ROW_NUMBER, RANK, DENSE_RANK, NTILE — and picking the one the question actually wants.',
lede: 'This is the most-asked window question in existence, and it is asked because the three functions differ only in how they handle ties — which is a proxy for whether you have used them on real data. Bhavin and Chetan both earn 98,000 in this dataset, so every example here exercises the tie behaviour.',
ex: [
 { t: 'All three side by side',
   sql: "SELECT name, dept_id, salary,\n       ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn,\n       RANK()       OVER (ORDER BY salary DESC) AS rnk,\n       DENSE_RANK() OVER (ORDER BY salary DESC) AS drnk\nFROM employees\nORDER BY salary DESC, name",
   note: 'Watch the two 98,000 rows and the two 64,000 rows. ROW_NUMBER gives them different numbers, RANK gives them the same number then skips, DENSE_RANK gives them the same number and continues.' },
 { t: 'Ranking within a partition',
   sql: "SELECT name, dept_id, salary,\n       DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS dept_rank\nFROM employees\nWHERE dept_id IS NOT NULL\nORDER BY dept_id, dept_rank, name",
   note: 'The ranking restarts at 1 for each department. This is the building block for every top-N-per-group answer.' },
 { t: 'ROW_NUMBER for deterministic deduplication',
   sql: "WITH d AS (\n  SELECT sale_id, emp_id, amount, sale_date,\n         ROW_NUMBER() OVER (PARTITION BY emp_id, sale_date, amount ORDER BY sale_id) AS rn\n  FROM sales\n)\nSELECT sale_id, emp_id, amount, sale_date FROM d WHERE rn = 1 ORDER BY sale_id",
   note: 'Sale 105 duplicates 102 on (emp_id, sale_date, amount). ROW_NUMBER keeps exactly one — and because the ORDER BY inside is deterministic, it keeps the same one every run.' },
 { t: 'NTILE for bucketing',
   sql: "SELECT name, salary,\n       NTILE(4) OVER (ORDER BY salary DESC) AS quartile,\n       ROUND(PERCENT_RANK() OVER (ORDER BY salary DESC), 3) AS pct_rank\nFROM employees\nORDER BY salary DESC",
   note: 'NTILE splits into n roughly equal buckets by row count, not by value — a fact that surprises people when bucket boundaries land mid-tie.' }
],
body: [
 { h: 'The four functions', html:
   '<table><thead><tr><th>Function</th><th>On ties</th><th>Sequence</th><th>Use for</th></tr></thead><tbody>' +
   '<tr><td>ROW_NUMBER()</td><td>Breaks them arbitrarily</td><td>1, 2, 3, 4</td><td>Deduplication, "pick exactly one"</td></tr>' +
   '<tr><td>RANK()</td><td>Same rank, then skips</td><td>1, 2, 2, 4</td><td>Competition ranking</td></tr>' +
   '<tr><td>DENSE_RANK()</td><td>Same rank, no gap</td><td>1, 2, 2, 3</td><td>"Top N distinct values"</td></tr>' +
   '<tr><td>NTILE(n)</td><td>Ignores them</td><td>Equal-sized buckets</td><td>Quartiles, deciles</td></tr>' +
   '</tbody></table>' },
 { h: 'Which one does the question want?', html:
   '<p><strong>"Top 3 earners"</strong> — if two people tie for third, do you want three rows or four? <code>ROW_NUMBER</code> gives three (and picks arbitrarily between the tied pair). <code>DENSE_RANK</code> gives four, keeping both. Saying this trade-off out loud is what separates a good answer from a correct one.</p>' +
   '<p><strong>"Second highest salary"</strong> — almost always means the second distinct value, so <code>DENSE_RANK</code>. See P1.</p>' +
   '<p><strong>"Deduplicate"</strong> — always <code>ROW_NUMBER</code>, because you need exactly one survivor.</p>' },
 { h: 'Determinism', html:
   '<p><code>ROW_NUMBER</code> over a non-unique ORDER BY is non-deterministic: which duplicate survives can change between runs, and in Spark it genuinely does. For any dedup that feeds a pipeline, make the inner ORDER BY unique — add the primary key or an ingestion timestamp as the final tiebreaker.</p>' }
],
call: '"ROW_NUMBER, RANK and DENSE_RANK differ only on ties — unique, gaps, no gaps. For deduplication I use ROW_NUMBER with a fully deterministic ORDER BY, because otherwise which duplicate survives changes between runs in a distributed engine."',
warn: 'NTILE divides by row count, not by value. With ties spanning a boundary, two identical salaries can land in different quartiles. If the buckets must respect value, compute the cut points explicitly.',
qf: [
 ['ROW_NUMBER vs RANK vs DENSE_RANK?', 'Unique sequential / same rank then skip (1,2,2,4) / same rank no gaps (1,2,2,3).'],
 ['Which for deduplication?', 'ROW_NUMBER, with a deterministic ORDER BY so the same row survives every run.'],
 ['Which for "top 3 distinct salaries"?', 'DENSE_RANK, filtered to <= 3.'],
 ['What does NTILE split by?', 'Row count, not value — buckets can split a tie.'],
 ['Why can a dedup be non-deterministic?', 'If the inner ORDER BY has ties, any of them may be numbered 1; add a unique tiebreaker.']
]});

M.push({
code: 'W3', track: 'Track W · Window functions', title: 'Aggregate windows and frames',
sub: 'Running totals, moving averages, and the ROWS-versus-RANGE distinction people get wrong.',
lede: 'Any aggregate becomes a window function by adding <code>OVER</code>. Add <code>ORDER BY</code> inside and it becomes cumulative; add a frame and you control exactly which rows count. Frames are where the real precision lives — and where the default behaviour surprises people.',
ex: [
 { t: 'Running total and share of partition',
   sql: "SELECT sale_date, sale_id, amount,\n       SUM(amount) OVER (ORDER BY sale_date, sale_id) AS running_total,\n       SUM(amount) OVER () AS grand_total,\n       ROUND(100.0 * SUM(amount) OVER (ORDER BY sale_date, sale_id) / SUM(amount) OVER (), 1) AS pct_cumulative\nFROM sales\nORDER BY sale_date, sale_id",
   note: 'With ORDER BY the SUM accumulates; without it, the same SUM covers the whole set. Both appear here — that contrast is the lesson.' },
 { t: 'Three-row moving average',
   sql: "SELECT sale_date, sale_id, amount,\n       ROUND(AVG(amount) OVER (ORDER BY sale_date, sale_id ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 1) AS ma3,\n       COUNT(*) OVER (ORDER BY sale_date, sale_id ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS window_rows\nFROM sales\nORDER BY sale_date, sale_id",
   note: 'The window_rows column exposes the edge effect: the first two rows average over fewer than three values. Every moving average has this warm-up, and forgetting it skews the start of a chart.' },
 { t: 'Running total per partition',
   sql: "SELECT e.name, s.sale_date, s.amount,\n       SUM(s.amount) OVER (PARTITION BY s.emp_id ORDER BY s.sale_date, s.sale_id) AS rep_running,\n       ROUND(AVG(s.amount) OVER (PARTITION BY s.emp_id), 1) AS rep_avg\nFROM sales s JOIN employees e ON e.emp_id = s.emp_id\nORDER BY e.name, s.sale_date, s.sale_id",
   note: 'The running total resets for each rep because PARTITION BY restarts the frame. The second column has no ORDER BY, so it is the whole-partition average on every row.' },
 { t: 'ROWS vs RANGE with duplicate sort keys',
   sql: "SELECT sale_date, sale_id, amount,\n       SUM(amount) OVER (ORDER BY sale_date ROWS  BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS by_rows,\n       SUM(amount) OVER (ORDER BY sale_date RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS by_range\nFROM sales\nWHERE sale_date <= '2026-01-06'\nORDER BY sale_date, sale_id",
   note: 'Three sales share 2026-01-04. ROWS counts physical rows so the total climbs one row at a time; RANGE includes all peer rows with the same date, so tied rows all show the same total. This is the single most misunderstood window detail.' }
],
body: [
 { h: 'The default frame', html:
   '<div class="pre code">OVER (ORDER BY x)\n   = OVER (ORDER BY x RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)   <b>RANGE, not ROWS</b>\n\nOVER ()\n   = the entire partition</div>' +
   '<p>Because the default is RANGE, a "running total" over a non-unique sort key already includes all tied rows. If you meant row-by-row, you must say <code>ROWS</code> explicitly.</p>' },
 { h: 'Frame vocabulary', html:
   '<table><thead><tr><th>Bound</th><th>Meaning</th></tr></thead><tbody>' +
   '<tr><td>UNBOUNDED PRECEDING</td><td>Start of the partition</td></tr>' +
   '<tr><td>n PRECEDING</td><td>n rows back (ROWS) or n units back (RANGE)</td></tr>' +
   '<tr><td>CURRENT ROW</td><td>This row — or all its peers, under RANGE</td></tr>' +
   '<tr><td>n FOLLOWING</td><td>n rows forward</td></tr>' +
   '<tr><td>UNBOUNDED FOLLOWING</td><td>End of the partition</td></tr>' +
   '</tbody></table>' },
 { h: 'Common frames', html:
   '<div class="pre code">ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW    <i>running total</i>\nROWS BETWEEN 6 PRECEDING AND CURRENT ROW            <i>7-row moving average</i>\nROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING            <i>centred smoothing</i>\nROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING    <i>remaining total</i></div>' +
   '<p>For a genuine <em class="hl">time</em> window — "the last 7 days" rather than "the last 7 rows" — you need <code>RANGE … INTERVAL 7 DAY PRECEDING</code>, supported in Postgres and Spark but not MySQL. Where it is unavailable, join to a date spine first so every day has a row.</p>' }
],
call: '"The default window frame with ORDER BY is RANGE UNBOUNDED PRECEDING to CURRENT ROW, which includes all peer rows with the same sort key — so if I want a strict row-by-row running total on a non-unique key I write ROWS explicitly."',
warn: 'A "7-day moving average" written as ROWS BETWEEN 6 PRECEDING is only correct if every day has exactly one row. Days with no activity are missing rows, so the window silently reaches further back than a week. Join to a date spine first.',
qf: [
 ['How do you make an aggregate cumulative?', 'Add ORDER BY inside the OVER clause.'],
 ['What is the default frame with ORDER BY?', 'RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW — peer rows included.'],
 ['ROWS vs RANGE?', 'ROWS counts physical rows; RANGE includes all rows tied on the sort key.'],
 ['Write a 7-row moving average.', 'AVG(x) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW).'],
 ['Why is a row-based moving average risky on daily data?', 'Missing days are missing rows, so the window spans more calendar time than intended.']
]});

M.push({
code: 'W4', track: 'Track W · Window functions', title: 'LAG and LEAD',
sub: 'Reach into the previous or next row — deltas, growth, gaps and state changes.',
lede: 'Every "compared to last month", "time since the previous event" and "did the value change?" question is <code>LAG</code>. It is also the foundation of sessionization and gaps-and-islands, so it earns its keep well beyond reporting.',
ex: [
 { t: 'Day-over-day delta',
   sql: "SELECT sale_date, sale_id, amount,\n       LAG(amount) OVER (ORDER BY sale_date, sale_id) AS prev_amount,\n       amount - LAG(amount) OVER (ORDER BY sale_date, sale_id) AS delta\nFROM sales\nORDER BY sale_date, sale_id",
   note: 'The first row has no predecessor, so LAG returns NULL and the delta is NULL. That is correct, not a bug — but it means downstream SUMs need COALESCE.' },
 { t: 'Month-over-month growth, safely',
   sql: "WITH m AS (\n  SELECT DATE_FORMAT(sale_date, '%Y-%m') AS mth, SUM(amount) AS revenue\n  FROM sales GROUP BY DATE_FORMAT(sale_date, '%Y-%m')\n)\nSELECT mth, revenue,\n       LAG(revenue) OVER (ORDER BY mth) AS prev_revenue,\n       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY mth))\n             / NULLIF(LAG(revenue) OVER (ORDER BY mth), 0), 1) AS growth_pct\nFROM m\nORDER BY mth",
   note: 'Aggregate to the month grain first, then LAG. NULLIF guards the case where the previous month was zero — a real scenario for a new product or a new merchant.' },
 { t: 'Gap since the previous event, per wallet',
   sql: "SELECT src_wallet, txn_id, ts, amount_usd,\n       LAG(ts) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id) AS prev_ts,\n       DATEDIFF(ts, LAG(ts) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id)) AS days_since_prev\nFROM transfers\nORDER BY src_wallet, ts, txn_id",
   note: 'PARTITION BY resets the lag at each wallet, so you never accidentally compare one wallet\'s transfer to another\'s. This column is the raw material for velocity features.' },
 { t: 'Detecting a state change',
   sql: "WITH banded AS (\n  SELECT wallet_id, valid_from, risk_band,\n         LAG(risk_band) OVER (PARTITION BY wallet_id ORDER BY valid_from) AS prev_band\n  FROM dim_wallet\n)\nSELECT wallet_id, valid_from AS changed_on, prev_band, risk_band AS new_band\nFROM banded\nWHERE prev_band IS NOT NULL AND prev_band <> risk_band\nORDER BY wallet_id, valid_from",
   note: 'Comparing a row to its predecessor and keeping only the differences is how you extract transitions from an SCD Type 2 history — escalations, downgrades, churn events.' }
],
body: [
 { h: 'Signature', html:
   '<div class="pre code">LAG(expr [, offset [, default]])  OVER (PARTITION BY … ORDER BY …)\nLEAD(expr [, offset [, default]]) OVER (PARTITION BY … ORDER BY …)</div>' +
   '<p>Offset defaults to 1. The third argument replaces the NULL at the boundary — <code>LAG(revenue, 1, 0)</code> gives 0 instead of NULL for the first row, which is sometimes what you want and sometimes hides a genuine gap.</p>' },
 { h: 'The patterns', html:
   '<table><thead><tr><th>Question</th><th>Shape</th></tr></thead><tbody>' +
   '<tr><td>Change vs previous</td><td><code>x - LAG(x) OVER (ORDER BY t)</code></td></tr>' +
   '<tr><td>Growth percentage</td><td><code>(x - LAG(x)) / NULLIF(LAG(x), 0)</code></td></tr>' +
   '<tr><td>Time since last event</td><td><code>DATEDIFF(t, LAG(t) OVER (PARTITION BY id ORDER BY t))</code></td></tr>' +
   '<tr><td>Value changed?</td><td><code>LAG(v) &lt;&gt; v</code>, guarding NULLs</td></tr>' +
   '<tr><td>Duration of a state</td><td><code>LEAD(t) OVER (…) - t</code></td></tr>' +
   '</tbody></table>' },
 { h: 'The comparison-to-NULL trap', html:
   '<p><code>prev_band &lt;&gt; risk_band</code> is UNKNOWN when <code>prev_band</code> is NULL, so the first row of every partition is silently dropped. Either add <code>prev_band IS NULL OR</code> explicitly, or use a null-safe comparison (<code>&lt;=&gt;</code> in MySQL, <code>IS DISTINCT FROM</code> in Postgres and Spark).</p>' }
],
call: '"LAG and LEAD give me the previous and next row within a partition, which covers period-over-period growth, time-since-last-event, and state-change detection — I aggregate to the right grain first, then lag, never the other way round."',
warn: 'LAG over an ungrouped table computes the previous *row*, not the previous *period*. If a month has three rows, LAG compares row to row inside that month. Aggregate to the reporting grain in a CTE before you lag — this is the most common month-over-month bug.',
qf: [
 ['What do LAG and LEAD return at a partition boundary?', 'NULL, unless a third default argument is supplied.'],
 ['How do you compute month-over-month growth?', 'Aggregate to month in a CTE, then (x - LAG(x)) / NULLIF(LAG(x), 0).'],
 ['Why PARTITION BY when computing a gap?', 'So the lag resets per entity instead of reaching into another entity\'s rows.'],
 ['Why does a state-change filter drop the first row?', 'prev <> current is UNKNOWN against NULL; use a null-safe comparison or an explicit IS NULL branch.'],
 ['LAG before or after aggregation?', 'After. Aggregate to the grain you want to compare, then lag.']
]});

M.push({
code: 'W5', track: 'Track W · Window functions', title: 'FIRST_VALUE, LAST_VALUE and NTH_VALUE',
sub: 'Pull a specific position from the window — and the LAST_VALUE default that catches everyone.',
lede: 'These three attach a value from a chosen position in the window onto every row: the first transfer, the latest risk band, the second-largest sale. They are also the sharpest illustration of why the default frame matters, because <code>LAST_VALUE</code> with the default frame does not return what its name promises.',
ex: [
 { t: 'FIRST_VALUE — attach the top of the partition',
   sql: "SELECT name, dept_id, salary,\n       FIRST_VALUE(name)   OVER (PARTITION BY dept_id ORDER BY salary DESC) AS top_earner,\n       FIRST_VALUE(salary) OVER (PARTITION BY dept_id ORDER BY salary DESC) AS top_salary,\n       ROUND(100.0 * salary / FIRST_VALUE(salary) OVER (PARTITION BY dept_id ORDER BY salary DESC), 1) AS pct_of_top\nFROM employees\nWHERE dept_id IS NOT NULL\nORDER BY dept_id, salary DESC",
   note: 'FIRST_VALUE works with the default frame because the frame always starts at UNBOUNDED PRECEDING — the first row is always in view.' },
 { t: 'LAST_VALUE — the trap and the fix, together',
   sql: "SELECT name, dept_id, salary,\n       LAST_VALUE(name) OVER (PARTITION BY dept_id ORDER BY salary DESC) AS looks_wrong,\n       LAST_VALUE(name) OVER (PARTITION BY dept_id ORDER BY salary DESC\n         ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS actually_last\nFROM employees\nWHERE dept_id IS NOT NULL\nORDER BY dept_id, salary DESC",
   note: 'The first column never reaches the bottom of the partition, because the default frame ends at CURRENT ROW. Watch Bhavin: it returns Chetan, not Bhavin — under the default RANGE frame, CURRENT ROW means the whole peer group tied on salary. With a unique sort key it would return the row itself. Either way it is not the last row. The second column extends the frame and gives the real answer.' },
 { t: 'The alternative fix — reverse and use FIRST_VALUE',
   sql: "SELECT name, dept_id, salary,\n       FIRST_VALUE(name) OVER (PARTITION BY dept_id ORDER BY salary ASC) AS lowest_paid\nFROM employees\nWHERE dept_id IS NOT NULL\nORDER BY dept_id, salary DESC",
   note: 'Flipping the sort direction and using FIRST_VALUE avoids the frame question entirely. Most practitioners do this; it is shorter and harder to get wrong.' },
 { t: 'NTH_VALUE and first-vs-latest state',
   sql: "SELECT wallet_id, valid_from, risk_band,\n       FIRST_VALUE(risk_band) OVER (PARTITION BY wallet_id ORDER BY valid_from) AS original_band,\n       LAST_VALUE(risk_band)  OVER (PARTITION BY wallet_id ORDER BY valid_from\n         ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS current_band,\n       NTH_VALUE(risk_band, 2) OVER (PARTITION BY wallet_id ORDER BY valid_from\n         ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS second_band\nFROM dim_wallet\nORDER BY wallet_id, valid_from",
   note: 'Reading an SCD Type 2 history: what a wallet started as, what it is now, and what it changed to first. NTH_VALUE returns NULL where the position does not exist.' }
],
body: [
 { h: 'Why LAST_VALUE misleads', html:
   '<div class="pre code">OVER (ORDER BY x)\n  defaults to RANGE BETWEEN UNBOUNDED PRECEDING AND <b>CURRENT ROW</b>\n\n→ FIRST_VALUE  : frame always starts at row 1      <i>correct by default</i>\n→ LAST_VALUE   : frame ends at the current peer group <u>never reaches the partition end</u></div>' +
   '<p>The usual shorthand is "LAST_VALUE returns the current row". That is true when the sort key is unique. Under the default <strong>RANGE</strong> frame, CURRENT ROW actually means the whole tied peer group, so with duplicate sort keys it returns the last row of that tie. Both cases are wrong for the same reason: the frame never reaches the end of the partition.</p>' +
   '<p>Two fixes: extend the frame to <code>UNBOUNDED FOLLOWING</code>, or reverse the ORDER BY and use FIRST_VALUE. The second is the one to reach for in an interview because it is self-evidently correct.</p>' },
 { h: 'When to use these vs a ranked CTE', html:
   '<table><thead><tr><th>Goal</th><th>Tool</th></tr></thead><tbody>' +
   '<tr><td>Attach the top value to every row</td><td>FIRST_VALUE</td></tr>' +
   '<tr><td>Return only the top row</td><td>ROW_NUMBER = 1 in a CTE</td></tr>' +
   '<tr><td>Attach several columns from the top row</td><td>Ranked CTE, then join — cleaner than N FIRST_VALUEs</td></tr>' +
   '</tbody></table>' }
],
call: '"LAST_VALUE with the default frame returns the current row, because the frame ends at CURRENT ROW — I either extend the frame to UNBOUNDED FOLLOWING or reverse the ORDER BY and use FIRST_VALUE."',
warn: 'If you need three columns from the top row of each group, three FIRST_VALUE calls means three windows and three sorts. Rank once in a CTE and join — one sort, and the intent is clearer to the next reader.',
qf: [
 ['Why does LAST_VALUE not return the last row?', 'The default frame ends at CURRENT ROW, so it never reaches the partition end. Under RANGE it returns the last row of the current tied peer group.'],
 ['Two ways to fix it?', 'Extend the frame to UNBOUNDED FOLLOWING, or reverse the ORDER BY and use FIRST_VALUE.'],
 ['Why is FIRST_VALUE safe by default?', 'The default frame always starts at UNBOUNDED PRECEDING.'],
 ['What does NTH_VALUE return when the position does not exist?', 'NULL.'],
 ['When would you prefer a ranked CTE?', 'When you need several columns from the top row — one sort instead of one per column.']
]});
/* ══════════════ TRACK P · INTERVIEW PATTERNS ══════════════ */

M.push({
code: 'P1', track: 'Track P · Interview patterns', title: 'Nth highest value',
sub: 'The most-asked SQL question there is — and the tie clarification that earns the marks.',
lede: '"Find the second highest salary" is asked in almost every SQL screen. There are four accepted answers and they differ on ties and on empty results. The candidate who asks <em class="hl">"second highest distinct salary, or the salary of the second-ranked person?"</em> before writing anything is signalling more than the one who writes the fastest query.',
ex: [
 { t: 'The subquery answer',
   sql: "SELECT MAX(salary) AS second_highest\nFROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees)",
   note: 'Short, portable to any dialect, and returns NULL rather than no rows when there is no second value — which is what most interviewers want.' },
 { t: 'The DENSE_RANK answer — generalises to any N',
   sql: "WITH r AS (\n  SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS dr\n  FROM employees\n)\nSELECT DISTINCT salary AS nth_highest, dr\nFROM r WHERE dr = 2",
   note: 'Change 2 to N and it answers the general question. DENSE_RANK, not RANK, because you want the second distinct value regardless of how many people hold the top one.' },
 { t: 'Why RANK gives a different answer',
   sql: "SELECT salary,\n       RANK()       OVER (ORDER BY salary DESC) AS rnk,\n       DENSE_RANK() OVER (ORDER BY salary DESC) AS drnk,\n       ROW_NUMBER() OVER (ORDER BY salary DESC) AS rn\nFROM employees\nORDER BY salary DESC",
   note: 'Look at the 98,000 pair. Asking for rank 3 with RANK returns nothing at all — the rank is skipped. That is the failure mode to be able to name.' },
 { t: 'Nth per group',
   sql: "WITH r AS (\n  SELECT dept_id, name, salary,\n         DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS dr\n  FROM employees WHERE dept_id IS NOT NULL\n)\nSELECT dept_id, name, salary FROM r WHERE dr = 2 ORDER BY dept_id, name",
   note: 'Add PARTITION BY and the same query answers "second highest in each department". Note that department 40 has only one employee, so it correctly returns no row.' },
 { t: 'OFFSET — the shortest answer, and its weakness',
   sql: "SELECT DISTINCT salary FROM employees ORDER BY salary DESC LIMIT 1 OFFSET 1",
   note: 'Correct here because of DISTINCT. Without it you would get the second *person*, not the second *salary* — and it returns zero rows rather than NULL when N exceeds the data.' }
],
body: [
 { h: 'The four answers compared', html:
   '<table><thead><tr><th>Approach</th><th>Ties</th><th>No Nth value</th><th>Generalises to N</th></tr></thead><tbody>' +
   '<tr><td>MAX with subquery</td><td>Distinct by construction</td><td>Returns NULL</td><td>No</td></tr>' +
   '<tr><td>DENSE_RANK = N</td><td>Distinct values</td><td>Zero rows</td><td>Yes</td></tr>' +
   '<tr><td>ROW_NUMBER = N</td><td>Nth <b>person</b>, arbitrary on ties</td><td>Zero rows</td><td>Yes</td></tr>' +
   '<tr><td>LIMIT 1 OFFSET N-1</td><td>Needs DISTINCT</td><td>Zero rows</td><td>Yes</td></tr>' +
   '</tbody></table>' },
 { h: 'The question behind the question', html:
   '<p>Interviewers are testing three things at once: do you know window functions, do you understand ties, and do you handle the empty case. Address all three in your answer:</p>' +
   '<div class="pre">"I\'ll assume second highest <b>distinct</b> salary, so DENSE_RANK rather than RANK\n or ROW_NUMBER. If there is no second distinct value this returns zero rows —\n if the caller needs a NULL instead, the MAX-with-subquery form gives that."</div>' }
],
call: '"I\'d use DENSE_RANK for Nth highest because the question almost always means the Nth distinct value — RANK skips ranks after a tie, so asking for rank three can return nothing at all."',
warn: 'LIMIT/OFFSET is not portable. SQL Server uses OFFSET … FETCH NEXT, and older Oracle uses ROWNUM. The window-function version is the one that runs everywhere and is the safer thing to write on a whiteboard.',
qf: [
 ['Second highest salary — which ranking function?', 'DENSE_RANK, because the question means the second distinct value.'],
 ['Why not RANK?', 'RANK skips numbers after a tie, so the rank you ask for may not exist.'],
 ['What does the MAX-subquery version return if there is no second value?', 'NULL — the others return zero rows.'],
 ['How do you extend it to Nth per group?', 'Add PARTITION BY to the window and keep the same filter.'],
 ['What clarifying question should you ask?', 'Nth distinct value, or the Nth-ranked row? They differ whenever there are ties.']
]});

M.push({
code: 'P2', track: 'Track P · Interview patterns', title: 'Top-N per group',
sub: 'The pattern that appears in every data interview, and the reason CTEs exist.',
lede: '"Top 3 earners per department", "most recent order per customer", "largest transfer per wallet" — one shape, endless phrasings. Rank inside a partition, filter outside. If you can write this from memory and explain why it needs two levels, you have covered a large fraction of the SQL that is actually asked.',
ex: [
 { t: 'Top 2 per department',
   sql: "WITH ranked AS (\n  SELECT name, dept_id, salary,\n         DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS dr\n  FROM employees WHERE dept_id IS NOT NULL\n)\nSELECT dept_id, name, salary, dr\nFROM ranked WHERE dr <= 2\nORDER BY dept_id, dr, name",
   note: 'Department 10 returns three rows for "top 2" because Bhavin and Chetan tie at rank 2. With ROW_NUMBER you would get exactly two and lose one of them arbitrarily. Say which you chose and why.' },
 { t: 'Exactly N per group',
   sql: "WITH ranked AS (\n  SELECT name, dept_id, salary,\n         ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC, emp_id) AS rn\n  FROM employees WHERE dept_id IS NOT NULL\n)\nSELECT dept_id, name, salary FROM ranked WHERE rn <= 2\nORDER BY dept_id, rn",
   note: 'ROW_NUMBER guarantees at most N rows per group. The emp_id tiebreaker makes it deterministic — without it, which of the tied pair survives can vary between runs.' },
 { t: 'Latest row per entity — the most common real use',
