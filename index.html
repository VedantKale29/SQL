   sql: "WITH latest AS (\n  SELECT wallet_id, risk_band, valid_from,\n         ROW_NUMBER() OVER (PARTITION BY wallet_id ORDER BY valid_from DESC, sk DESC) AS rn\n  FROM dim_wallet\n)\nSELECT wallet_id, risk_band, valid_from FROM latest WHERE rn = 1\nORDER BY wallet_id",
   note: 'This is the "current state from a history table" query, and it is everywhere in data engineering — latest price, latest address, current SCD row. Note it agrees with the is_current flag in the table.' },
 { t: 'Top transfer per wallet with full context',
   sql: "WITH r AS (\n  SELECT t.*, ROW_NUMBER() OVER (PARTITION BY t.src_wallet ORDER BY t.amount_usd DESC, t.txn_id) AS rn\n  FROM transfers t\n)\nSELECT r.src_wallet, w.risk_band, r.txn_id, r.amount_usd, r.ts\nFROM r JOIN wallets w ON w.wallet_id = r.src_wallet\nWHERE r.rn = 1\nORDER BY r.amount_usd DESC",
   note: 'Ranking in a CTE and joining afterwards keeps the whole row available — far cleaner than several FIRST_VALUE calls, and it is one sort rather than several.' }
],
body: [
 { h: 'The template', html:
   '<div class="pre code">WITH ranked AS (\n  SELECT …,\n         ROW_NUMBER() OVER (PARTITION BY grp ORDER BY metric DESC, tiebreak) AS rn\n  FROM t\n)\nSELECT … FROM ranked WHERE rn &lt;= N</div>' +
   '<p>Two levels are structurally required: the rank is produced at step 5 (SELECT) and <code>WHERE</code> runs at step 2. There is no single-block form.</p>' },
 { h: 'Choosing the ranking function', html:
   '<table><thead><tr><th>Requirement</th><th>Function</th><th>Rows returned per group</th></tr></thead><tbody>' +
   '<tr><td>Exactly N rows</td><td>ROW_NUMBER</td><td>N (arbitrary among ties)</td></tr>' +
   '<tr><td>N distinct values, keep all ties</td><td>DENSE_RANK</td><td>N or more</td></tr>' +
   '<tr><td>Competition ranking</td><td>RANK</td><td>Varies; ranks skip</td></tr>' +
   '</tbody></table>' },
 { h: 'Alternatives worth naming', html:
   '<p>Postgres has <code>DISTINCT ON (grp) … ORDER BY grp, metric DESC</code> for the N=1 case. Trino/Athena and recent Postgres support <code>FETCH FIRST n ROWS WITH TIES</code>. Neither is portable — mentioning them shows range, but write the window version.</p>' }
],
call: '"Top-N per group is rank inside a partition and filter outside — it needs a CTE because the window is computed in SELECT and WHERE runs before that. I pick ROW_NUMBER when I need exactly N rows and DENSE_RANK when ties should all be kept."',
warn: 'ROW_NUMBER with a non-unique ORDER BY makes the result non-deterministic. On a single-node database you may never see it change; on Spark, the same query can return different people on different runs. Always add a unique tiebreaker.',
qf: [
 ['Write top-N per group.', 'Rank with a window partitioned by the group in a CTE, then filter on the rank in the outer query.'],
 ['Why is a CTE required?', 'The window is computed in SELECT (step 5) and WHERE runs at step 2, so it cannot be filtered in the same block.'],
 ['ROW_NUMBER or DENSE_RANK?', 'ROW_NUMBER for exactly N rows; DENSE_RANK to keep all ties.'],
 ['How do you get the latest row per entity?', 'ROW_NUMBER partitioned by entity ordered by timestamp descending, filtered to rn = 1.'],
 ['Why add a tiebreaker column?', 'To make the choice among tied rows deterministic across runs and engines.']
]});

M.push({
code: 'P3', track: 'Track P · Interview patterns', title: 'Deduplication',
sub: 'Finding duplicates, counting them, and keeping exactly one — deterministically.',
lede: 'Deduplication is the most common real task in this list. Every landing zone receives replays: an at-least-once stream, a re-run backfill, a vendor file delivered twice. The interview version is "remove duplicate rows"; the production version is "make the load idempotent", and they are the same query.',
ex: [
 { t: 'Find the duplicates',
   sql: "SELECT txn_id, COUNT(*) AS copies\nFROM stg_transfers\nGROUP BY txn_id\nHAVING COUNT(*) > 1",
   note: 'The first thing to run, always. Group by what you believe is the key and see whether the belief holds. Here t-17 arrived twice.' },
 { t: 'See the duplicate rows in full',
   sql: "SELECT s.*\nFROM stg_transfers s\nJOIN (SELECT txn_id FROM stg_transfers GROUP BY txn_id HAVING COUNT(*) > 1) d\n  ON d.txn_id = s.txn_id\nORDER BY s.txn_id, s.ingested_at",
   note: 'Now you can see whether the copies are identical or differ — here they differ only on ingested_at, which tells you it is a replay rather than a genuine correction.' },
 { t: 'Keep exactly one — the canonical pattern',
   sql: "WITH d AS (\n  SELECT txn_id, src_wallet, dst_wallet, amount_usd, ts, ingested_at,\n         ROW_NUMBER() OVER (PARTITION BY txn_id ORDER BY ingested_at DESC, ts DESC) AS rn\n  FROM stg_transfers\n)\nSELECT txn_id, src_wallet, dst_wallet, amount_usd, ts, ingested_at\nFROM d WHERE rn = 1\nORDER BY txn_id",
   note: 'ORDER BY ingested_at DESC keeps the newest version — the right choice when later arrivals are corrections. Flip to ASC when the first write should win.' },
 { t: 'Duplicates on a business key, not the primary key',
   sql: "WITH d AS (\n  SELECT sale_id, emp_id, amount, sale_date,\n         COUNT(*) OVER (PARTITION BY emp_id, sale_date, amount) AS copies,\n         ROW_NUMBER() OVER (PARTITION BY emp_id, sale_date, amount ORDER BY sale_id) AS rn\n  FROM sales\n)\nSELECT sale_id, emp_id, amount, sale_date, copies, rn\nFROM d WHERE copies > 1\nORDER BY emp_id, sale_date, rn",
   note: 'Sales 102 and 105 are distinct primary keys but identical business events. This is the harder, more realistic case — the duplicate is only visible once you define the business key.' }
],
body: [
 { h: 'The three decisions', html:
   '<ol>' +
   '<li><strong>What is the key?</strong> The primary key catches replays. A business key catches genuinely duplicated events with different surrogate ids. Know which problem you have.</li>' +
   '<li><strong>Which copy wins?</strong> Latest ingestion (corrections), earliest (immutable events), or highest completeness. State it in the ORDER BY.</li>' +
   '<li><strong>Is it deterministic?</strong> If the ORDER BY has ties, the survivor can change between runs.</li>' +
   '</ol>' },
 { h: 'DELETE vs SELECT', html:
   '<div class="pre code">-- keep one, delete the rest\nWITH d AS (\n  SELECT sale_id, ROW_NUMBER() OVER (PARTITION BY emp_id, sale_date, amount\n                                     ORDER BY sale_id) AS rn\n  FROM sales\n)\nDELETE FROM sales WHERE sale_id IN (SELECT sale_id FROM d WHERE rn &gt; 1);</div>' +
   '<p>In a lakehouse you would rarely delete. The idiomatic form is a <code>MERGE</code> on the key, or writing the deduplicated set to a new snapshot — see D1.</p>' },
 { h: 'DISTINCT is not deduplication', html:
   '<p><code>SELECT DISTINCT</code> only removes rows that are identical in <em class="hl">every</em> projected column. A replay that differs in <code>ingested_at</code> survives it. Real deduplication is keyed, and that means ROW_NUMBER.</p>' }
],
call: '"I deduplicate with ROW_NUMBER partitioned by the business key and ordered by ingestion time, keeping rank one — DISTINCT does not work because replays usually differ in a metadata column, and the ordering has to be deterministic or the survivor changes between runs."',
warn: 'Deduplicating on the primary key alone is often the wrong key. Two rows with different surrogate ids can represent the same business event — that is the case an interviewer will push you towards, and the case that produces double-counted revenue in production.',
qf: [
 ['How do you find duplicates?', 'GROUP BY the candidate key with HAVING COUNT(*) > 1.'],
 ['How do you keep exactly one?', 'ROW_NUMBER partitioned by the key, ordered deterministically, filtered to rn = 1.'],
 ['Why is DISTINCT not enough?', 'It requires every column to match; a replay differing in a metadata column survives.'],
 ['Which copy should win?', 'Depends on semantics — latest for corrections, earliest for immutable events. Say it explicitly in the ORDER BY.'],
 ['What makes a dedup non-deterministic?', 'Ties in the ORDER BY inside the window — add a unique tiebreaker.']
]});

M.push({
code: 'P4', track: 'Track P · Interview patterns', title: 'Gaps and islands',
sub: 'Consecutive runs, streaks and missing sequences — the trick that looks like magic.',
lede: 'Login streaks, consecutive trading days, uninterrupted subscription periods, unbroken runs of failed transactions — all the same problem. The trick is one line: subtract a row number from the sequence value, and every consecutive run collapses to a constant you can group on.',
ex: [
 { t: 'The raw data',
   sql: "SELECT emp_id, login_date,\n       ROW_NUMBER() OVER (PARTITION BY emp_id ORDER BY login_date) AS rn\nFROM logins\nORDER BY emp_id, login_date",
   note: 'Employee 7 logs in on the 4th, 5th, 6th, then skips to the 9th. Employee 9 has an unbroken run of four. Look at how login_date and rn move together within a run.' },
 { t: 'The trick — date minus row number',
   sql: "SELECT emp_id, login_date,\n       ROW_NUMBER() OVER (PARTITION BY emp_id ORDER BY login_date) AS rn,\n       DATE_SUB(login_date, INTERVAL ROW_NUMBER() OVER (PARTITION BY emp_id ORDER BY login_date) DAY) AS grp\nFROM logins\nORDER BY emp_id, login_date",
   note: 'Inside a consecutive run both values increase by one per row, so the difference is constant. A gap breaks the constant. That constant is now a group key — that is the entire technique.' },
 { t: 'Collapse to streaks',
   sql: "WITH g AS (\n  SELECT emp_id, login_date,\n         DATE_SUB(login_date, INTERVAL ROW_NUMBER() OVER (PARTITION BY emp_id ORDER BY login_date) DAY) AS grp\n  FROM logins\n)\nSELECT emp_id, MIN(login_date) AS streak_start, MAX(login_date) AS streak_end,\n       COUNT(*) AS streak_days\nFROM g\nGROUP BY emp_id, grp\nORDER BY streak_days DESC, emp_id",
   note: 'One row per unbroken run. Add HAVING COUNT(*) >= 3 for "streaks of at least three days" — the usual phrasing of the interview question.' },
 { t: 'The LAG variant — islands defined by a threshold',
   sql: "WITH marked AS (\n  SELECT src_wallet, txn_id, ts,\n         CASE WHEN DATEDIFF(ts, LAG(ts) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id)) <= 1\n              THEN 0 ELSE 1 END AS is_new_run\n  FROM transfers\n),\nnumbered AS (\n  SELECT src_wallet, txn_id, ts,\n         SUM(is_new_run) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id) AS run_id\n  FROM marked\n)\nSELECT src_wallet, run_id, MIN(ts) AS run_start, MAX(ts) AS run_end, COUNT(*) AS txns\nFROM numbered\nGROUP BY src_wallet, run_id\nHAVING COUNT(*) > 1\nORDER BY txns DESC, src_wallet",
   note: 'More general than the row-number trick: mark where a new run starts, then take a running SUM of those markers to produce a run id. This version handles any gap rule, not just "exactly one day apart".' }
],
body: [
 { h: 'Why the trick works', html:
   '<div class="pre">login_date   rn   date - rn\n2026-01-04    1   2026-01-03   <i>run A</i>\n2026-01-05    2   2026-01-03   <i>run A</i>\n2026-01-06    3   2026-01-03   <i>run A</i>\n2026-01-09    4   <b>2026-01-05</b>   <i>gap → new group</i></div>' +
   '<p>Both columns increase in lockstep inside a run, so their difference is invariant. Any gap advances the date faster than the row number and the difference jumps.</p>' },
 { h: 'Two variants — pick the right one', html:
   '<table><thead><tr><th>Method</th><th>Works when</th><th>Note</th></tr></thead><tbody>' +
   '<tr><td>value − ROW_NUMBER</td><td>Steps are exactly regular (daily, integer ids)</td><td>Shortest; the classic answer</td></tr>' +
   '<tr><td>LAG + running SUM of markers</td><td>Any gap rule (≤ 30 min, ≤ 3 days, value change)</td><td>The general form — also how sessionization works</td></tr>' +
   '</tbody></table>' },
 { h: 'Gaps rather than islands', html:
   '<p>To report the <em class="hl">missing</em> periods instead of the present ones, use <code>LEAD</code>: where the next date is more than one step away, the interval between them is a gap. Or generate a date spine and anti-join.</p>' }
],
call: '"Gaps and islands: subtract a row number from the date and every consecutive run shares a constant, which becomes the group key. For irregular gap rules I switch to LAG plus a running SUM of new-run markers — that is the same machinery as sessionization."',
warn: 'The subtract-a-row-number trick breaks if the sequence has duplicates — two logins on the same day desynchronise the row number from the date and split a run in two. Deduplicate to one row per period first.',
qf: [
 ['What is the gaps-and-islands trick?', 'Subtract a row number from the sequence value; the difference is constant within a consecutive run.'],
 ['Why does it work?', 'Both increase by one per row inside a run, so their difference is invariant until a gap appears.'],
 ['When does it break?', 'When there are duplicate values per period — dedupe to one row per period first.'],
 ['What is the general alternative?', 'LAG to detect a new run, then a running SUM of those markers as a run id.'],
 ['How do you report gaps instead of runs?', 'LEAD to find where the next value jumps, or anti-join against a generated spine.']
]});

M.push({
code: 'P5', track: 'Track P · Interview patterns', title: 'Growth, cohorts and retention',
sub: 'Period-over-period, running totals and cohort tables — the analytics questions in a DE interview.',
lede: 'Even in a data-engineering interview you will be asked to compute month-over-month growth or a retention curve, because they test the same skills as pipeline work: getting to the right grain, handling missing periods, and not dividing by zero.',
ex: [
 { t: 'Month-over-month growth',
   sql: "WITH m AS (\n  SELECT DATE_FORMAT(sale_date, '%Y-%m') AS mth, SUM(amount) AS revenue, COUNT(*) AS orders\n  FROM sales GROUP BY DATE_FORMAT(sale_date, '%Y-%m')\n)\nSELECT mth, revenue, orders,\n       LAG(revenue) OVER (ORDER BY mth) AS prev,\n       revenue - LAG(revenue) OVER (ORDER BY mth) AS abs_change,\n       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY mth))\n             / NULLIF(LAG(revenue) OVER (ORDER BY mth), 0), 1) AS growth_pct\nFROM m ORDER BY mth",
   note: 'Aggregate first, then lag. The NULL in the first row is correct — there is no prior month — and NULLIF protects against a zero baseline.' },
 { t: 'Running total and share of the year',
   sql: "WITH m AS (\n  SELECT DATE_FORMAT(sale_date, '%Y-%m') AS mth, SUM(amount) AS revenue\n  FROM sales GROUP BY DATE_FORMAT(sale_date, '%Y-%m')\n)\nSELECT mth, revenue,\n       SUM(revenue) OVER (ORDER BY mth) AS cumulative,\n       ROUND(100.0 * SUM(revenue) OVER (ORDER BY mth) / SUM(revenue) OVER (), 1) AS pct_of_total\nFROM m ORDER BY mth",
   note: 'Two windows over the same CTE: one cumulative, one whole-set. This is the shape of every "% of year to date" chart.' },
 { t: 'Cohort assignment',
   sql: "WITH first_sale AS (\n  SELECT emp_id, MIN(sale_date) AS cohort_date\n  FROM sales GROUP BY emp_id\n),\ncohorted AS (\n  SELECT s.emp_id, s.sale_date, s.amount,\n         DATE_FORMAT(f.cohort_date, '%Y-%m') AS cohort_month,\n         DATE_FORMAT(s.sale_date, '%Y-%m') AS activity_month\n  FROM sales s JOIN first_sale f ON f.emp_id = s.emp_id\n)\nSELECT cohort_month, activity_month,\n       COUNT(DISTINCT emp_id) AS active_reps, SUM(amount) AS revenue\nFROM cohorted\nGROUP BY cohort_month, activity_month\nORDER BY cohort_month, activity_month",
   note: 'Two steps: find each entity\'s first activity to assign a cohort, then aggregate activity by cohort and period. Every retention table in existence is built this way.' },
 { t: 'Retention as a percentage of the cohort',
   sql: "WITH first_sale AS (\n  SELECT emp_id, DATE_FORMAT(MIN(sale_date), '%Y-%m') AS cohort_month\n  FROM sales GROUP BY emp_id\n),\nactivity AS (\n  SELECT f.cohort_month, DATE_FORMAT(s.sale_date, '%Y-%m') AS activity_month, s.emp_id\n  FROM sales s JOIN first_sale f ON f.emp_id = s.emp_id\n),\nsized AS (\n  SELECT cohort_month, activity_month, COUNT(DISTINCT emp_id) AS active\n  FROM activity GROUP BY cohort_month, activity_month\n)\nSELECT cohort_month, activity_month, active,\n       FIRST_VALUE(active) OVER (PARTITION BY cohort_month ORDER BY activity_month) AS cohort_size,\n       ROUND(100.0 * active / FIRST_VALUE(active) OVER (PARTITION BY cohort_month ORDER BY activity_month), 1) AS retention_pct\nFROM sized\nORDER BY cohort_month, activity_month",
   note: 'FIRST_VALUE attaches the cohort size (period zero) to every later period, which turns raw counts into a retention percentage without a self-join.' }
],
body: [
 { h: 'The order of operations', html:
   '<ol>' +
   '<li><strong>Aggregate to the reporting grain first.</strong> Lagging raw rows compares row to row, not period to period.</li>' +
   '<li><strong>Fill missing periods</strong> with a date spine if any period could be empty — otherwise LAG reaches over the gap and reports the wrong baseline.</li>' +
   '<li><strong>Guard the denominator</strong> with <code>NULLIF(x, 0)</code>.</li>' +
   '<li><strong>Force float division</strong> with <code>100.0 *</code> or a cast.</li>' +
   '</ol>' },
 { h: 'Cohort vocabulary', html:
   '<table><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>' +
   '<tr><td>Cohort</td><td>Entities grouped by the period of their first event</td></tr>' +
   '<tr><td>Cohort size</td><td>Distinct entities in period zero — the denominator</td></tr>' +
   '<tr><td>Period index</td><td>Months since the cohort month, not the calendar month</td></tr>' +
   '<tr><td>Retention</td><td>Active in period n ÷ cohort size</td></tr>' +
   '</tbody></table>' }
],
call: '"For period-over-period I aggregate to the reporting grain first and then LAG, because lagging raw rows compares row to row rather than month to month — and I join to a date spine so an empty month does not make LAG reach over the gap."',
warn: 'A month with no rows does not produce a zero — it produces no row at all, so LAG silently compares against two months ago and the growth number is wrong without any error. This is the reason date spines exist.',
qf: [
 ['How do you compute MoM growth?', 'Aggregate to month in a CTE, then (x - LAG(x)) / NULLIF(LAG(x), 0).'],
 ['Why aggregate before lagging?', 'Otherwise LAG compares individual rows, not periods.'],
 ['What is a cohort?', 'Entities grouped by the period of their first event.'],
 ['How do you get the cohort size onto every row?', 'FIRST_VALUE over the cohort partition ordered by period.'],
 ['What breaks when a period has no data?', 'The row is absent, so LAG compares against the wrong baseline. Use a date spine.']
]});

M.push({
code: 'P6', track: 'Track P · Interview patterns', title: 'Sessionization and velocity',
sub: 'Grouping events into sessions by a time gap — and the fraud features that fall out of it.',
lede: 'Sessionization is gaps-and-islands applied to timestamps: split an entity\'s event stream wherever the gap exceeds a threshold. It is asked in product analytics interviews as "web sessions with a 30-minute timeout", and it is exactly the machinery behind velocity features in fraud detection — which makes it the most directly relevant pattern to your research.',
ex: [
 { t: 'Step 1 — the gap to the previous event',
   sql: "SELECT src_wallet, txn_id, ts, amount_usd,\n       LAG(ts) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id) AS prev_ts,\n       DATEDIFF(ts, LAG(ts) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id)) AS gap_days\nFROM transfers\nORDER BY src_wallet, ts, txn_id",
   note: 'PARTITION BY the entity, ORDER BY time. The NULL gap at the start of each wallet is the first event of that wallet — it always starts a new session.' },
 { t: 'Step 2 — mark session starts, then number them',
   sql: "WITH gaps AS (\n  SELECT src_wallet, txn_id, ts, amount_usd,\n         DATEDIFF(ts, LAG(ts) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id)) AS gap_days\n  FROM transfers\n),\nmarked AS (\n  SELECT *, CASE WHEN gap_days IS NULL OR gap_days > 2 THEN 1 ELSE 0 END AS new_session\n  FROM gaps\n),\nsessioned AS (\n  SELECT *, SUM(new_session) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id) AS session_no\n  FROM marked\n)\nSELECT src_wallet, session_no, txn_id, ts, amount_usd, gap_days\nFROM sessioned\nORDER BY src_wallet, session_no, ts",
   note: 'A running SUM over a 0/1 marker is the session id. This three-CTE shape is the canonical answer and it is worth being able to write from memory.' },
 { t: 'Step 3 — one row per session',
   sql: "WITH gaps AS (\n  SELECT src_wallet, txn_id, ts, amount_usd,\n         DATEDIFF(ts, LAG(ts) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id)) AS gap_days\n  FROM transfers\n),\nsessioned AS (\n  SELECT src_wallet, txn_id, ts, amount_usd,\n         SUM(CASE WHEN gap_days IS NULL OR gap_days > 2 THEN 1 ELSE 0 END)\n           OVER (PARTITION BY src_wallet ORDER BY ts, txn_id) AS session_no\n  FROM gaps\n)\nSELECT src_wallet, session_no,\n       MIN(ts) AS session_start, MAX(ts) AS session_end,\n       COUNT(*) AS events, ROUND(SUM(amount_usd), 2) AS volume,\n       DATEDIFF(MAX(ts), MIN(ts)) AS span_days\nFROM sessioned\nGROUP BY src_wallet, session_no\nORDER BY events DESC, volume DESC",
   note: 'The session summary table. In a feature store this is exactly what you would materialise: burst length, burst volume, burst duration per entity.' },
 { t: 'A velocity feature — rolling count and volume',
   sql: "SELECT src_wallet, txn_id, ts, amount_usd,\n       COUNT(*) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id\n                      ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS txns_last_3,\n       ROUND(SUM(amount_usd) OVER (PARTITION BY src_wallet ORDER BY ts, txn_id\n                      ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS volume_last_3\nFROM transfers\nORDER BY volume_last_3 DESC, src_wallet",
   note: 'A rolling window is the other half of velocity. Note this counts rows, not time — a genuine "in the last hour" feature needs RANGE with an INTERVAL, which is why streaming engines exist.' }
],
body: [
 { h: 'The three-step recipe', html:
   '<div class="pre code">1. gap      = DATEDIFF(ts, LAG(ts) OVER (PARTITION BY id ORDER BY ts))\n2. new      = CASE WHEN gap IS NULL OR gap &gt; threshold THEN 1 ELSE 0 END\n3. session  = SUM(new) OVER (PARTITION BY id ORDER BY ts)</div>' +
   '<p>Then <code>GROUP BY id, session</code> for one row per session. The threshold is a business decision — 30 minutes for web, hours for card payments, days for on-chain layering.</p>' },
 { h: 'Batch SQL vs streaming', html:
   '<table><thead><tr><th></th><th>SQL window</th><th>Streaming (Flink / Spark Structured Streaming)</th></tr></thead><tbody>' +
   '<tr><td>Sees</td><td>The whole history at once</td><td>Events as they arrive</td></tr>' +
   '<tr><td>Late data</td><td>Naturally handled on re-run</td><td>Needs watermarks</td></tr>' +
   '<tr><td>Session support</td><td>Manual — the recipe above</td><td>Native session windows with a gap duration</td></tr>' +
   '<tr><td>Latency</td><td>Batch interval</td><td>Sub-second</td></tr>' +
   '</tbody></table>' +
   '<p>Being able to say "this is a session window with a gap duration, and in Flink or Spark I would express it directly, but the batch backfill uses the LAG recipe" is a strong answer — it connects the SQL to the platform.</p>' },
 { h: 'Why this matters for fraud', html:
   '<p>Structuring, layering and burst behaviour are all <em class="hl">temporal density</em> signals. A single 9,800 transfer is unremarkable; four of them in two days between newly-created wallets is the pattern. Sessionization turns a flat event log into the burst-level features a model can actually learn from — and doing the same computation in batch and in streaming without them diverging is the training/serving skew problem.</p>' }
],
call: '"Sessionization is LAG for the gap, a marker for a new session, and a running SUM of that marker as the session id — the same recipe gives me burst-level velocity features for fraud, and in streaming it becomes a native session window with a gap duration."',
warn: 'A rolling window written as ROWS BETWEEN n PRECEDING counts rows, not time. "Five transfers in the last hour" and "the last five transfers" are different questions, and only the second one is expressible with ROWS. For true time windows use RANGE with an INTERVAL, and check your engine supports it.',
qf: [
 ['What are the three steps of sessionization?', 'LAG for the gap, a 0/1 marker where the gap exceeds the threshold, and a running SUM of the marker as the session id.'],
 ['Why does the first event of each entity start a session?', 'Its LAG is NULL, which the marker treats as a new session.'],
 ['ROWS vs a true time window?', 'ROWS counts rows; a time window needs RANGE with an INTERVAL and is not supported everywhere.'],
 ['What is the streaming equivalent?', 'A session window with a gap duration in Flink or Spark Structured Streaming, plus watermarks for late data.'],
 ['Why does this matter for fraud detection?', 'Structuring and layering are temporal density patterns; session features expose bursts that per-transaction features cannot.']
]});

M.push({
code: 'O1', track: 'Track O · Performance', title: 'Indexes and access paths',
sub: 'What an index actually is, when it helps, and the predicates that quietly disable it.',
lede: 'An index is a sorted structure that converts a full scan into a seek. That is the whole idea — everything else is consequence. Interviewers ask about indexes because the answers reveal whether you have ever made a slow query fast, or only read about it.',
ex: [
 { t: 'The predicate shape that can seek',
   sql: "SELECT emp_id, name, hire_date\nFROM employees\nWHERE hire_date >= '2022-01-01' AND hire_date < '2023-01-01'\nORDER BY hire_date",
   note: 'With an index on hire_date this is a range seek: descend the tree once, then walk. The engine touches only the matching rows.' },
 { t: 'The same rows, written so no index can be used',
   sql: "SELECT emp_id, name, hire_date\nFROM employees\nWHERE YEAR(hire_date) = 2022\nORDER BY hire_date",
   note: 'Identical output. But the function must be evaluated on every row before the comparison, so the index on hire_date is useless and the engine scans. Same result, different access path.' },
 { t: 'Composite-key order matters',
   sql: "SELECT emp_id, name, dept_id, salary\nFROM employees\nWHERE dept_id = 10 AND salary > 90000\nORDER BY salary DESC",
   note: 'An index on (dept_id, salary) serves this perfectly — equality on the leading column, then a range on the second. An index on (salary, dept_id) does not: the leading column has no equality predicate.' },
 { t: 'A covering index candidate',
   sql: "SELECT dept_id, COUNT(*) AS headcount\nFROM employees\nWHERE dept_id IS NOT NULL\nGROUP BY dept_id\nORDER BY dept_id",
   note: 'Only dept_id is referenced, so an index on dept_id alone answers the whole query without touching the table — a covering index. That is often a ten-times improvement on a wide table.' }
],
body: [
 { h: 'The mental model', html:
   '<p>A B-tree index is the table\u2019s keys held in sorted order with pointers back to the rows. Sorted order buys three things at once: <strong>equality lookups</strong>, <strong>range scans</strong>, and <strong>pre-sorted output</strong> (so <code>ORDER BY</code> on the index key can skip the sort entirely).</p>' +
   '<p>It costs write throughput and storage. Every insert, update and delete must maintain every index on the table — which is exactly why an OLTP source system is lightly indexed and a warehouse is not indexed at all.</p>' },
 { h: 'The leftmost-prefix rule', html:
   '<div class="pre code">INDEX (dept_id, salary, hire_date)\n\nWHERE dept_id = 10                              <i>uses it</i>\nWHERE dept_id = 10 AND salary &gt; 90000            <i>uses it</i>\nWHERE dept_id = 10 AND salary = 98000 AND hire_date &gt; \'2021-01-01\'   <i>uses it fully</i>\nWHERE salary &gt; 90000                            <u>cannot use it — no leading column</u>\nWHERE dept_id = 10 AND hire_date &gt; \'2021-01-01\'  <i>partial — stops at the gap</i></div>' +
   '<p>Composite index order is a design decision: <em class="hl">equality columns first, then the range column</em>. Getting that order wrong is the most common indexing mistake.</p>' },
 { h: 'What disables an index', html:
   '<table><thead><tr><th>Pattern</th><th>Fix</th></tr></thead><tbody>' +
   '<tr><td><code>YEAR(col) = 2022</code></td><td>Rewrite as a range on <code>col</code></td></tr>' +
   '<tr><td><code>col * 12 &gt; x</code></td><td>Move the arithmetic to the other side</td></tr>' +
   '<tr><td><code>LIKE \'%abc\'</code></td><td>No fix — a leading wildcard cannot seek. Consider a full-text index</td></tr>' +
   '<tr><td>Implicit type cast (string vs int)</td><td>Match the column\u2019s declared type in the literal</td></tr>' +
   '<tr><td>Low selectivity (a boolean flag)</td><td>Often correctly ignored — a scan is cheaper</td></tr>' +
   '</tbody></table>' },
 { h: 'The warehouse translation', html:
   '<p>Redshift, Athena and Spark have no B-tree indexes. The equivalents are <strong>partitioning</strong> (skip whole directories), <strong>file layout</strong> — sort keys, clustering, Z-ordering — and <strong>column statistics</strong> that let Parquet skip row groups. The principle transfers exactly: a predicate the engine can push down reads less data. A function wrapped around a partition column defeats partition pruning for precisely the same reason it defeats an index.</p>' }
],
call: '"An index turns a scan into a seek, so I keep the indexed column bare in the predicate and order composite indexes with the equality columns first. In the lakehouse the same idea is partitioning and file layout — a function on the partition column defeats pruning exactly as it defeats an index."',
warn: 'Do not answer "add an index" reflexively. On a table with heavy writes, or a low-selectivity column, or a query that returns most of the table, an index makes things worse. The correct answer is always "look at the plan first".',
qf: [
 ['What is an index?', 'A sorted structure over the key columns that converts a full scan into a seek, and can also supply pre-sorted output.'],
 ['What is the leftmost-prefix rule?', 'A composite index can only be used from its leading column onward; a predicate on a later column alone cannot use it.'],
 ['How should you order a composite index?', 'Equality columns first, then the range column.'],
 ['Name three things that disable an index.', 'A function on the column, an expression on the column, a leading wildcard in LIKE — plus implicit type casts.'],
 ['What is a covering index?', 'One containing every column the query needs, so the table itself is never read.'],
 ['What replaces indexes in a lakehouse?', 'Partitioning, file layout (sort/cluster/Z-order), and column statistics enabling row-group skipping.']
]});

M.push({
code: 'O2', track: 'Track O · Performance', title: 'Reading a plan and choosing a join strategy',
sub: 'EXPLAIN, the three physical joins, and what "the query is slow" should actually make you do.',
lede: '"This query is slow, what do you do?" is a standard closing question, and the wrong answer is a list of tips. The right answer is a procedure: look at the plan, find the step consuming the rows, and change the access path or the join strategy. In a distributed engine, add one more question — how much data crosses the network.',
ex: [
 { t: 'Estimate the work before you optimise',
   sql: "SELECT 'employees' AS tbl, COUNT(*) AS rows_scanned FROM employees\nUNION ALL SELECT 'sales', COUNT(*) FROM sales\nUNION ALL SELECT 'transfers', COUNT(*) FROM transfers\nUNION ALL SELECT 'wallets', COUNT(*) FROM wallets",
   note: 'Cardinality first. Which side of the join is small enough to broadcast? Which is the driving table? A plan you cannot predict is a plan you cannot reason about.' },
 { t: 'Filter early — the row count that reaches the join',
   sql: "SELECT COUNT(*) AS transfers_total,\n       SUM(CASE WHEN is_flagged = 1 THEN 1 ELSE 0 END) AS after_filter\nFROM transfers",
   note: 'Pushing the is_flagged predicate below the join means the join sees a fraction of the rows. This is what "predicate pushdown" does automatically — and what a predicate the engine cannot understand prevents.' },
 { t: 'The skewed key — why one task runs forever',
   sql: "SELECT src_wallet, COUNT(*) AS txns,\n       ROUND(100.0 * COUNT(*) / (SELECT COUNT(*) FROM transfers), 1) AS pct_of_table\nFROM transfers\nGROUP BY src_wallet\nORDER BY txns DESC",
   note: 'In a shuffle join every row with the same key lands on the same worker. If one key holds a large share of the table, that worker does most of the work while the rest idle. This query is how you find the culprit before touching any config.' }
],
body: [
 { h: 'The procedure', html:
   '<ol>' +
   '<li><strong>Get the plan.</strong> <code>EXPLAIN</code>, or <code>EXPLAIN ANALYZE</code> for actual versus estimated rows.</li>' +
   '<li><strong>Find the widest step</strong> — where the row count explodes or a scan appears.</li>' +
   '<li><strong>Check estimated vs actual.</strong> A large divergence means stale statistics, and the optimiser is choosing badly on bad information.</li>' +
   '<li><strong>Change the access path</strong> (index, partition, projection) <em>or</em> the join strategy.</li>' +
   '<li><strong>Re-measure.</strong> Never ship an optimisation you did not verify.</li>' +
   '</ol>' },
 { h: 'What to look for in a plan', html:
   '<table><thead><tr><th>Sign</th><th>Meaning</th></tr></thead><tbody>' +
   '<tr><td>Full table scan on a large table</td><td>No usable index, or a non-sargable predicate</td></tr>' +
   '<tr><td>Estimated rows far from actual</td><td>Stale statistics — run ANALYZE</td></tr>' +
   '<tr><td>Nested loop over a large outer</td><td>Wrong join strategy for the cardinality</td></tr>' +
   '<tr><td>Sort where the index could supply order</td><td>ORDER BY not aligned with the index</td></tr>' +
   '<tr><td>Exchange / shuffle between every stage</td><td>Repartitioning that could be avoided</td></tr>' +
   '</tbody></table>' },
 { h: 'The three physical joins', html:
   '<table><thead><tr><th>Strategy</th><th>Best when</th><th>Cost</th></tr></thead><tbody>' +
   '<tr><td><b>Nested loop</b></td><td>Outer is tiny and inner is indexed</td><td>O(n × lookup)</td></tr>' +
   '<tr><td><b>Hash join</b></td><td>No useful index; one side fits in memory</td><td>Build + probe; spills if too large</td></tr>' +
   '<tr><td><b>Sort-merge</b></td><td>Both sides large, or already sorted</td><td>Two sorts, then a linear merge</td></tr>' +
   '</tbody></table>' +
   '<p>In Spark the same three appear as <strong>broadcast hash join</strong> (small side shipped to every executor — no shuffle), <strong>shuffle hash join</strong>, and <strong>sort-merge join</strong>, which is the default for two large sides. Broadcast is the single biggest win available: it eliminates the shuffle entirely, and Adaptive Query Execution will switch to it at runtime when the actual size turns out small.</p>' },
 { h: 'Skew', html:
   '<p>Skew is the distributed-systems failure mode with no single-node equivalent: one key dominates, so one task gets most of the data and the stage finishes at the speed of that task. Remedies are salting the hot key, broadcasting the small side to avoid the shuffle, or letting AQE split the skewed partition — it detects and handles this automatically in Spark 3.</p>' }
],
call: '"I start from the plan rather than from a checklist: find the step where the rows explode, check estimated against actual to catch stale statistics, then fix the access path or the join strategy. On Spark the first question is whether the small side can be broadcast, because that removes the shuffle entirely."',
warn: 'Plans in this bench cannot be executed — the engine here runs the SQL but has no cost-based optimiser, so any EXPLAIN output would be illustrative rather than real. Read plans on the actual engine you are targeting; MySQL, Postgres, Athena and Spark all present them differently.',
qf: [
 ['A query is slow — what first?', 'Read the plan. Find the step where row counts explode and compare estimated against actual.'],
 ['Estimated rows far from actual — what does that mean?', 'Stale statistics; the optimiser is choosing a plan on bad information. Run ANALYZE.'],
 ['Name the three physical join strategies.', 'Nested loop, hash join, sort-merge join.'],
 ['When is a broadcast join right?', 'When one side is small enough to fit in each executor\'s memory — it removes the shuffle.'],
 ['What is skew and how do you fix it?', 'One key holds a disproportionate share, so one task dominates. Salt the key, broadcast the small side, or rely on Adaptive Query Execution.']
]});

M.push({
code: 'O3', track: 'Track O · Performance', title: 'Set operations and cheap wins',
sub: 'UNION vs UNION ALL, EXCEPT, INTERSECT — and the habits that cost nothing to adopt.',
lede: 'Set operations combine result sets rather than rows. They are simple, but one of them has a hidden sort that people pay for by accident on every run of a nightly job — and the reconciliation queries built from the other two are a standard data-engineering tool.',
ex: [
 { t: 'UNION deduplicates; UNION ALL does not',
   sql: "SELECT src_wallet AS wallet_id FROM transfers WHERE amount_usd > 9000\nUNION\nSELECT dst_wallet FROM transfers WHERE amount_usd > 9000\nORDER BY wallet_id",
   note: 'A distinct list of wallets on either end of a large transfer. UNION removed the wallets that appear on both sides.' },
 { t: 'The same query with UNION ALL',
   sql: "SELECT src_wallet AS wallet_id FROM transfers WHERE amount_usd > 9000\nUNION ALL\nSELECT dst_wallet FROM transfers WHERE amount_usd > 9000\nORDER BY wallet_id",
   note: 'More rows, including duplicates — and no sort. When you know the inputs are disjoint (partitions of one dataset, for instance) UNION ALL is strictly cheaper and gives the same answer.' },
 { t: 'EXCEPT — rows on one side only',
   sql: "SELECT txn_id FROM stg_transfers\nEXCEPT\nSELECT txn_id FROM transfers\nORDER BY txn_id",
   note: 'Which staged transactions have not yet landed in the curated table. This one-liner is a genuine pipeline reconciliation check.' },
 { t: 'INTERSECT — rows on both sides',
   sql: "SELECT txn_id FROM stg_transfers\nINTERSECT\nSELECT txn_id FROM transfers\nORDER BY txn_id",
   note: 'The replayed rows: already curated, delivered again. Exactly the set a MERGE must treat as an update rather than an insert.' }
],
body: [
 { h: 'The four operations', html:
   '<table><thead><tr><th>Operation</th><th>Result</th><th>Deduplicates</th></tr></thead><tbody>' +
   '<tr><td>UNION</td><td>Rows in either</td><td>Yes — costs a sort or hash</td></tr>' +
   '<tr><td>UNION ALL</td><td>Rows in either, duplicates kept</td><td>No — cheapest</td></tr>' +
   '<tr><td>EXCEPT / MINUS</td><td>In the first, not the second</td><td>Yes</td></tr>' +
   '<tr><td>INTERSECT</td><td>In both</td><td>Yes</td></tr>' +
   '</tbody></table>' +
   '<p>All require the same number of columns with compatible types. Column <em class="hl">names</em> come from the first SELECT.</p>' },
 { h: 'Reconciliation in three queries', html:
   '<div class="pre code">SELECT k FROM source EXCEPT SELECT k FROM target     <i>missing downstream</i>\nSELECT k FROM target EXCEPT SELECT k FROM source     <i>orphaned downstream</i>\nSELECT k FROM source INTERSECT SELECT k FROM target  <i>matched — check values next</i></div>' +
   '<p>Run these as scheduled data-quality checks after a load. They catch dropped and duplicated partitions long before anyone notices a wrong number on a dashboard.</p>' },
 { h: 'Cheap wins worth the habit', html:
   '<ul>' +
   '<li><strong>UNION ALL unless you need dedup.</strong> Free, and usually correct.</li>' +
   '<li><strong>Never SELECT * in production.</strong> On a columnar store, every unused column is bytes scanned and money spent.</li>' +
   '<li><strong>Filter before joining.</strong> A predicate in a CTE is a predicate the join never sees rows for.</li>' +
   '<li><strong>Total ORDER BY when using LIMIT.</strong> Correctness, not speed.</li>' +
   '<li><strong>EXISTS instead of a join when you only need a flag.</strong> Avoids fan-out and lets the engine short-circuit.</li>' +
   '</ul>' }
],
call: '"UNION deduplicates and pays a sort for it, so I use UNION ALL whenever the inputs are disjoint — and I keep EXCEPT in both directions as a scheduled reconciliation check between staging and curated, which catches a dropped partition before a dashboard does."',
warn: 'On a columnar store, SELECT * is not a style issue — it is a bill. Athena charges by bytes scanned, so projecting every column of a wide Parquet table costs directly, and the same query with five columns can be an order of magnitude cheaper.',
qf: [
 ['UNION vs UNION ALL?', 'UNION removes duplicates and pays a sort; UNION ALL keeps everything and is faster.'],
 ['What does EXCEPT do?', 'Returns rows in the first result set that are not in the second — the basis of reconciliation checks.'],
 ['Where do the output column names come from?', 'The first SELECT in the set operation.'],
 ['Why avoid SELECT * on a columnar table?', 'Every projected column is bytes read; on Athena that is billed directly.'],
 ['How would you check a load landed correctly?', 'EXCEPT in both directions between source and target keys, plus a row-count and a sum reconciliation.']
]});

M.push({
code: 'D1', track: 'Track D · Data-engineering SQL', title: 'Upsert, MERGE and idempotency',
sub: 'Making a load safe to run twice — the property every pipeline needs and most interviews probe.',
lede: 'Every pipeline is re-run: a retry after a failure, a backfill, an at-least-once stream delivering the same event again. A load is <em class="hl">idempotent</em> if running it twice leaves the table exactly as running it once. In SQL that means <code>MERGE</code> on a key, and knowing why an <code>INSERT</code> is not good enough.',
ex: [
 { t: 'Classify the incoming rows first',
   sql: "SELECT s.txn_id, s.amount_usd AS new_amount, t.amount_usd AS existing_amount,\n       CASE WHEN t.txn_id IS NULL THEN 'INSERT'\n            WHEN t.amount_usd <> s.amount_usd THEN 'UPDATE'\n            ELSE 'NO-OP' END AS action\nFROM stg_transfers s\nLEFT JOIN transfers t ON t.txn_id = s.txn_id\nORDER BY action, s.txn_id",
   note: 'This is what a MERGE does internally, made visible. Run it before any merge you are unsure about — it tells you exactly how many rows each branch will touch.' },
 { t: 'Deduplicate the source before merging',
   sql: "WITH deduped AS (\n  SELECT txn_id, src_wallet, dst_wallet, amount_usd, ts,\n         ROW_NUMBER() OVER (PARTITION BY txn_id ORDER BY ingested_at DESC) AS rn\n  FROM stg_transfers\n)\nSELECT txn_id, src_wallet, dst_wallet, amount_usd, ts\nFROM deduped WHERE rn = 1\nORDER BY txn_id",
   note: 'Mandatory. A MERGE whose source contains two rows for the same key fails in Delta, Iceberg and most warehouses — "multiple source rows matched a target row". This dedup is the fix, and t-17 is the row that would trigger it.' },
 { t: 'Verify the merge would be safe',
   sql: "SELECT COUNT(*) AS source_rows, COUNT(DISTINCT txn_id) AS distinct_keys,\n       COUNT(*) - COUNT(DISTINCT txn_id) AS duplicate_keys\nFROM stg_transfers",
   note: 'A one-line pre-merge gate. If duplicate_keys is not zero, the merge will fail or corrupt — fail the task here rather than downstream.' }
],
body: [
 { h: 'The MERGE statement', html:
   '<p>Reference form — not executable in this bench, which supports SELECT only:</p>' +
   '<div class="pre code">MERGE INTO transfers AS t\nUSING (SELECT … FROM stg_transfers WHERE rn = 1) AS s\n  ON t.txn_id = s.txn_id\nWHEN MATCHED AND t.amount_usd &lt;&gt; s.amount_usd THEN\n  UPDATE SET t.amount_usd = s.amount_usd, t.ts = s.ts\nWHEN NOT MATCHED THEN\n  INSERT (txn_id, src_wallet, dst_wallet, amount_usd, ts)\n  VALUES (s.txn_id, s.src_wallet, s.dst_wallet, s.amount_usd, s.ts);</div>' +
   '<p>Supported by Iceberg, Delta Lake, Hudi, Redshift, Snowflake, Postgres 15+ and SQL Server. MySQL uses <code>INSERT … ON DUPLICATE KEY UPDATE</code>; Postgres before 15 uses <code>INSERT … ON CONFLICT DO UPDATE</code>.</p>' },
 { h: 'The three idempotency strategies', html:
   '<table><thead><tr><th>Strategy</th><th>How</th><th>Right for</th></tr></thead><tbody>' +
   '<tr><td><b>Merge on key</b></td><td>MERGE / upsert</td><td>Mutable dimensions, CDC targets</td></tr>' +
   '<tr><td><b>Delete-insert partition</b></td><td>Overwrite the affected partition wholesale</td><td>Immutable daily facts — the most common lakehouse pattern</td></tr>' +
   '<tr><td><b>Append + dedup on read</b></td><td>Append everything, ROW_NUMBER in the view</td><td>High-throughput streams where write latency matters</td></tr>' +
   '</tbody></table>' },
 { h: 'Write-Audit-Publish', html:
   '<p>The pattern that makes a bad load invisible to consumers: write to a branch or staging location, run the quality checks against it, and only then publish by swapping the pointer. Iceberg branches and Delta transactions both give you the atomic swap. Naming this unprompted is a strong signal in a governance-heavy interview.</p>' +
   '<div class="pre">WRITE   → new data to an isolated branch/snapshot\nAUDIT   → row counts, null rates, referential checks, reconciliation\nPUBLISH → atomic fast-forward; consumers never see a partial state</div>' }
],
call: '"I make loads idempotent by merging on a business key after deduplicating the source, because at-least-once delivery and backfills both replay rows. For immutable daily facts I overwrite the partition instead, which is simpler and cheaper than a merge."',
warn: 'A MERGE with duplicate keys in the source is a runtime failure in Delta and Iceberg, not a silent overwrite. Always deduplicate the source in a CTE first, and gate the task on a distinct-key check — that gate is one query and it saves a 3 a.m. page.',
qf: [
 ['What does idempotent mean here?', 'Running the load twice leaves the table identical to running it once.'],
 ['Why is INSERT not idempotent?', 'A replay inserts the rows again, duplicating them.'],
 ['What breaks a MERGE?', 'Duplicate keys in the source — most engines raise an error rather than picking one.'],
 ['Name three idempotency strategies.', 'Merge on key; delete-and-insert the affected partition; append and deduplicate on read.'],
 ['What is Write-Audit-Publish?', 'Write to an isolated branch, run quality checks, then atomically publish — consumers never see a partial or failed load.']
]});

M.push({
code: 'D2', track: 'Track D · Data-engineering SQL', title: 'Slowly changing dimensions',
sub: 'Type 1 versus Type 2, and the SQL for querying history correctly.',
lede: 'The most-asked dimensional-modelling question is "how do you preserve history?" and the answer is SCD Type 2. What separates a rehearsed answer from a real one is being able to write the queries: current state, point-in-time state, and the change log — and knowing why joining a fact to a Type 2 dimension without a date predicate multiplies your rows.',
ex: [
 { t: 'The history table',
   sql: "SELECT sk, wallet_id, risk_band, valid_from, valid_to, is_current\nFROM dim_wallet\nORDER BY wallet_id, valid_from",
   note: 'Two rows for w-2 and two for w-4: each was re-banded, so the old row was closed off and a new one opened. One row per wallet per state period — that is the Type 2 grain.' },
 { t: 'Current state',
   sql: "SELECT wallet_id, risk_band, valid_from\nFROM dim_wallet\nWHERE is_current = 1\nORDER BY wallet_id",
   note: 'The flag is a convenience. The equivalent without it is WHERE valid_to = \'9999-12-31\', or a ROW_NUMBER on valid_from DESC — worth knowing all three since not every model carries the flag.' },
 { t: 'Point-in-time — what was true on a given date',
   sql: "SELECT wallet_id, risk_band, valid_from, valid_to\nFROM dim_wallet\nWHERE '2026-02-02' >= valid_from AND '2026-02-02' < valid_to\nORDER BY wallet_id",
   note: 'On 2 February, w-4 was still low risk — it was upgraded on the 3rd. Note the half-open interval: >= on the start, < on the end. Using <= on both would return two rows on a changeover date.' },
 { t: 'The correct fact-to-dimension join',
   sql: "SELECT t.txn_id, t.ts, t.src_wallet, d.risk_band AS band_at_txn_time, t.amount_usd\nFROM transfers t\nJOIN dim_wallet d\n  ON d.wallet_id = t.src_wallet\n AND t.ts >= d.valid_from AND t.ts < d.valid_to\nORDER BY t.ts, t.txn_id",
   note: 'The date predicate is part of the join, not an afterthought. It picks exactly one dimension row per fact — without it, every transfer from w-2 or w-4 would appear twice.' },
 { t: 'The change log',
   sql: "WITH x AS (\n  SELECT wallet_id, valid_from, risk_band,\n         LAG(risk_band) OVER (PARTITION BY wallet_id ORDER BY valid_from) AS prev_band\n  FROM dim_wallet\n)\nSELECT wallet_id, valid_from AS changed_on, prev_band, risk_band AS new_band\nFROM x\nWHERE prev_band IS NOT NULL AND prev_band <> risk_band\nORDER BY changed_on, wallet_id",
   note: 'Every escalation and downgrade, with dates. This is the query a compliance reviewer actually asks for — "when did this wallet become high risk, and what was it before?"' }
],
body: [
 { h: 'The types that matter', html:
   '<table><thead><tr><th>Type</th><th>Behaviour</th><th>History</th><th>Use for</th></tr></thead><tbody>' +
   '<tr><td><b>Type 1</b></td><td>Overwrite in place</td><td>Lost</td><td>Corrections — a misspelled name</td></tr>' +
   '<tr><td><b>Type 2</b></td><td>Close the old row, insert a new one</td><td>Full</td><td>Anything a report must reproduce as-of a date</td></tr>' +
   '<tr><td>Type 3</td><td>Add a previous_value column</td><td>One step</td><td>Rare — a single known reorganisation</td></tr>' +
   '<tr><td>Type 6</td><td>1 + 2 + 3 combined</td><td>Full + current on every row</td><td>When both as-of and current are queried constantly</td></tr>' +
   '</tbody></table>' },
 { h: 'The Type 2 mechanics', html:
   '<div class="pre">surrogate key   <i>unique per row — the fact table joins on this, not the business key</i>\nbusiness key    <i>wallet_id — repeats across versions</i>\nvalid_from      <i>inclusive</i>\nvalid_to        <i>exclusive — 9999-12-31 for the open row</i>\nis_current      <i>convenience flag, must stay consistent with valid_to</i></div>' +
   '<p>Half-open intervals (<code>[from, to)</code>) are the detail that prevents double-counting on a changeover date. If both bounds are inclusive, a fact dated exactly on the boundary matches two dimension rows.</p>' },
 { h: 'On a lakehouse', html:
   '<p>Type 2 needs an <code>UPDATE</code> to close the old row, which plain Parquet on S3 cannot do — this is one of the concrete reasons the table format exists. Iceberg, Delta and Hudi all support <code>MERGE</code>, so the standard implementation is a single merge that closes the expired row and inserts the new one.</p>' }
],
call: '"Type 2 preserves history by closing the old row and opening a new one with half-open validity dates, and the fact joins on the surrogate key with a date predicate — without that predicate the join fans out and every metric doubles for any entity that ever changed."',
warn: 'Inclusive validity on both ends is the classic SCD bug. A fact dated exactly on a changeover matches two dimension rows, so it is counted twice — and it only affects the entities that changed, so the totals look almost right.',
qf: [
 ['How do you preserve dimension history?', 'SCD Type 2 — close the current row and insert a new version with its own surrogate key and validity dates.'],
 ['Type 1 vs Type 2?', 'Type 1 overwrites and loses history; Type 2 versions the row and keeps it.'],
 ['Why half-open validity intervals?', 'So a fact dated on a changeover date matches exactly one version.'],
 ['How do you join a fact to a Type 2 dimension?', 'On the business key plus ts >= valid_from AND ts < valid_to, then use the surrogate key.'],
 ['What happens without the date predicate?', 'Fan-out — every fact for a changed entity matches every version, doubling the metrics.'],
 ['Why does Type 2 need Iceberg or Delta?', 'Closing the old row is an UPDATE, which raw Parquet on object storage cannot do.']
]});

M.push({
code: 'D3', track: 'Track D · Data-engineering SQL', title: 'Incremental loads and watermarks',
sub: 'Loading only what changed — and the late-arrival bug that silently loses rows.',
lede: 'Full reloads stop being viable long before the data gets genuinely big. Incremental loading means keeping a watermark — the high-water mark of what you have already processed — and pulling only what is newer. The whole difficulty is that "newer" is ambiguous when events arrive late.',
ex: [
 { t: 'Find the current watermark',
   sql: "SELECT MAX(ts) AS max_event_time, COUNT(*) AS rows_loaded\nFROM transfers",
   note: 'The high-water mark of the curated table. The naive incremental load is "give me everything with ts greater than this".' },
 { t: 'The naive incremental pull — and what it misses',
   sql: "SELECT txn_id, ts, ingested_at, amount_usd\nFROM stg_transfers\nWHERE ts > (SELECT MAX(ts) FROM transfers)\nORDER BY ts, txn_id",
   note: 'Transaction t-11 has an event time of 2026-02-06 but was ingested on the 14th — a late arrival. Filtering on event time skips it entirely, and it is lost with no error.' },
 { t: 'Watermark on ingestion time instead',
   sql: "SELECT txn_id, ts, ingested_at, amount_usd\nFROM stg_transfers\nWHERE ingested_at > '2026-02-13'\nORDER BY ingested_at, txn_id",
   note: 'Now the late arrival is picked up, because ingestion time is monotonic even when event time is not. This is why pipelines carry both timestamps.' },
 { t: 'A lookback window — the pragmatic compromise',
   sql: "SELECT txn_id, ts, ingested_at, amount_usd\nFROM stg_transfers\nWHERE ts >= DATE_SUB((SELECT MAX(ts) FROM transfers), INTERVAL 7 DAY)\nORDER BY ts, txn_id",
   note: 'Reprocess the last seven days on every run and merge on the key. Slightly more work, but late arrivals inside the window are absorbed automatically. Idempotency is what makes this safe.' }
],
body: [
 { h: 'Two clocks, and why you need both', html:
   '<table><thead><tr><th></th><th>Event time</th><th>Ingestion time</th></tr></thead><tbody>' +
   '<tr><td>Means</td><td>When it happened</td><td>When you received it</td></tr>' +
   '<tr><td>Monotonic</td><td>No — arrivals can be late or out of order</td><td>Yes</td></tr>' +
   '<tr><td>Correct for analysis</td><td><b>Yes</b> — partition and report on this</td><td>No</td></tr>' +
   '<tr><td>Correct for the watermark</td><td>No — skips late rows</td><td><b>Yes</b></td></tr>' +
   '</tbody></table>' +
   '<p>Store both. Partition on event time so reports are correct; drive the incremental read from ingestion time so nothing is missed.</p>' },
 { h: 'The four strategies', html:
   '<table><thead><tr><th>Strategy</th><th>Mechanism</th><th>Trade-off</th></tr></thead><tbody>' +
   '<tr><td>Full reload</td><td>Truncate and rewrite</td><td>Always correct, does not scale</td></tr>' +
   '<tr><td>Watermark on ingestion time</td><td><code>WHERE ingested_at &gt; last_run</code></td><td>Needs the column and a reliable clock</td></tr>' +
   '<tr><td>Lookback window</td><td>Reprocess the last N days, merge</td><td>Simple and robust; extra compute</td></tr>' +
   '<tr><td>CDC</td><td>Read the database log</td><td>Exact, catches deletes, most infrastructure</td></tr>' +
   '</tbody></table>' },
 { h: 'Deletes', html:
   '<p>An incremental pull based on a timestamp cannot see a delete — the row simply stops existing and nothing marks it. If deletes matter, you need CDC, a soft-delete flag, or a periodic full reconciliation. Raising this unprompted is a strong signal, because it is the gap most candidates miss.</p>' },
 { h: 'Streaming watermarks', html:
   '<p>The same word in Spark Structured Streaming and Flink means something more precise: a threshold declaring how late an event may be before its window is closed and its state dropped. <code>withWatermark("ts", "10 minutes")</code> trades correctness for bounded state — events later than the watermark are dropped. Batch lookback windows are the same trade-off made explicit.</p>' }
],
call: '"I watermark on ingestion time and partition on event time, because event time is not monotonic — a transaction dated the sixth can arrive on the fourteenth, and an event-time watermark drops it silently. A lookback window plus an idempotent merge absorbs late arrivals safely."',
warn: 'Late arrivals fail silently. There is no error, no failed task — just rows that never load. The only defence is a scheduled reconciliation between source and target counts, because the pipeline itself cannot tell you about data it never saw.',
qf: [
 ['What is a watermark in a batch pipeline?', 'The high-water mark of what has been processed, used to pull only newer rows.'],
 ['Event time or ingestion time for the watermark?', 'Ingestion time — it is monotonic. Event time is for partitioning and reporting.'],
 ['What is a lookback window?', 'Reprocessing the last N periods every run and merging, so late arrivals are absorbed.'],
 ['Why does that require idempotency?', 'The same rows are reprocessed each run; without a keyed merge they would duplicate.'],
 ['Why can timestamp-based incremental loads miss deletes?', 'A deleted row leaves no trace to filter on — you need CDC, soft deletes, or periodic reconciliation.']
]});

M.push({
code: 'D4', track: 'Track D · Data-engineering SQL', title: 'Data quality checks in SQL',
sub: 'The assertions that belong in every pipeline, expressed as queries that must return zero rows.',
lede: 'Data quality is not a framework, it is a set of queries with expected answers. Great Expectations and Soda are convenient wrappers, but knowing the underlying SQL is what lets you write a check for the thing your framework does not cover — and in an interview it is far more convincing than naming tools.',
ex: [
 { t: 'Uniqueness — must return zero rows',
   sql: "SELECT txn_id, COUNT(*) AS copies\nFROM stg_transfers\nGROUP BY txn_id\nHAVING COUNT(*) > 1",
   note: 'The primary-key assertion. It returns one row here, so the check fails — as it should, because staging genuinely contains a replay of t-17.' },
 { t: 'Referential integrity — orphaned keys',
   sql: "SELECT t.txn_id, t.src_wallet\nFROM transfers t\nLEFT JOIN wallets w ON w.wallet_id = t.src_wallet\nWHERE w.wallet_id IS NULL",
   note: 'Every transfer should reference a known wallet. Zero rows means the foreign key holds. This is the check that catches a dimension load that failed while the fact load succeeded.' },
 { t: 'Null rates and ranges in one profile',
   sql: "SELECT COUNT(*) AS rows_total,\n       SUM(CASE WHEN risk_band IS NULL THEN 1 ELSE 0 END) AS null_risk_band,\n       ROUND(100.0 * SUM(CASE WHEN risk_band IS NULL THEN 1 ELSE 0 END) / COUNT(*), 1) AS null_pct,\n       COUNT(DISTINCT chain) AS distinct_chains,\n       MIN(first_seen) AS earliest, MAX(first_seen) AS latest\nFROM wallets",
   note: 'A profile query rather than a pass/fail assertion. Run it every load and alert on the delta — a null rate that jumps from 12% to 60% is an upstream schema change, and it will not fail any type check.' },
 { t: 'Business-rule assertion',
   sql: "SELECT txn_id, amount_usd, ts\nFROM transfers\nWHERE amount_usd <= 0 OR ts > '2026-12-31' OR src_wallet = dst_wallet",
   note: 'Non-positive amounts, impossible dates, self-transfers. Zero rows means the domain rules hold. These are the checks that catch a bad parse long before a model trains on it.' },
 { t: 'Reconciliation between layers',
   sql: "SELECT (SELECT COUNT(*) FROM stg_transfers) AS staging_rows,\n       (SELECT COUNT(DISTINCT txn_id) FROM stg_transfers) AS staging_keys,\n       (SELECT COUNT(*) FROM transfers) AS curated_rows,\n       (SELECT COUNT(DISTINCT txn_id) FROM stg_transfers)\n     - (SELECT COUNT(*) FROM (SELECT DISTINCT s.txn_id FROM stg_transfers s JOIN transfers t ON t.txn_id = s.txn_id) x) AS keys_not_yet_curated",
   note: 'Counts at each layer plus the gap between them. Cheap, and it catches a dropped partition — the failure mode that produces a plausible-looking dashboard with a slice of the data missing.' }
],
body: [
 { h: 'The six checks worth having everywhere', html:
   '<table><thead><tr><th>Check</th><th>Expressed as</th><th>Catches</th></tr></thead><tbody>' +
   '<tr><td>Uniqueness</td><td>GROUP BY key HAVING COUNT(*) &gt; 1</td><td>Replays, broken merges</td></tr>' +
   '<tr><td>Not null</td><td>WHERE col IS NULL</td><td>Upstream schema drift</td></tr>' +
   '<tr><td>Referential</td><td>Anti-join to the dimension</td><td>Load-order failures</td></tr>' +
   '<tr><td>Range / domain</td><td>WHERE value outside bounds</td><td>Parse errors, unit changes</td></tr>' +
   '<tr><td>Freshness</td><td>MAX(ts) vs now</td><td>A silently stopped pipeline</td></tr>' +
   '<tr><td>Volume</td><td>Row count vs the trailing average</td><td>Partial loads</td></tr>' +
   '</tbody></table>' },
 { h: 'Assertion style', html:
   '<p>Write every check so that <strong>zero rows means pass</strong>. It composes: the orchestrator only has to check whether the result is empty, the failing rows are the debugging output, and the same query works in dbt tests, Great Expectations, Soda or a bare Airflow task.</p>' +
   '<div class="pre code">-- dbt test: any returned row fails the build\nSELECT txn_id FROM {{ ref(\'transfers\') }}\nGROUP BY txn_id HAVING COUNT(*) &gt; 1</div>' },
 { h: 'Where the checks run', html:
   '<p>In Write-Audit-Publish they run between the write and the publish, against the isolated branch. A failed check aborts the publish and consumers never see the bad data. That is the difference between a quality check and a quality <em class="hl">gate</em> — and it is the answer to "how do you stop bad data reaching the warehouse?"</p>' }
],
call: '"I write quality checks as queries that must return zero rows — uniqueness, referential integrity, domain ranges, freshness and volume — and run them between the write and the publish, so a failure aborts the publish rather than being detected on a dashboard the next morning."',
warn: 'Freshness and volume checks catch the failures that type checks never will. A pipeline that silently stops producing rows passes every schema and null assertion perfectly — the table is simply not growing, and nobody notices until someone asks why last week looks flat.',
qf: [
 ['Name the core data quality checks.', 'Uniqueness, not-null, referential integrity, range/domain, freshness, volume.'],
 ['How should an assertion be written?', 'So that zero rows means pass — the returned rows are the failures and the debugging output.'],
 ['Where do checks belong in a pipeline?', 'Between write and publish, so a failure blocks publication rather than being found downstream.'],
 ['What does a volume check catch that a schema check cannot?', 'Partial loads and silently stopped pipelines — the data is valid, there is just not enough of it.'],
 ['How do you check referential integrity?', 'Anti-join the fact to the dimension and assert no orphaned keys.']
]});

M.push({
code: 'D5', track: 'Track D · Data-engineering SQL', title: 'Warehouse SQL: pruning, dialects and cost',
sub: 'The same SQL on Athena, Redshift and Spark — what changes, and what you get billed for.',
lede: 'Interview SQL is written against a single database. Production SQL runs on a columnar engine over object storage, where the cost model is bytes scanned rather than rows examined. The syntax is nearly the same; the things that make a query fast are completely different, and being able to say which is a data-engineering answer rather than an analyst one.',
ex: [
 { t: 'Partition-friendly predicate',
   sql: "SELECT COUNT(*) AS txns, ROUND(SUM(amount_usd), 2) AS volume\nFROM transfers\nWHERE ts >= '2026-02-01' AND ts < '2026-03-01'",
   note: 'If the table is partitioned by date, this predicate lets the engine skip whole directories — it never opens the files. This is partition pruning, and it is the single biggest cost lever on Athena.' },
 { t: 'The version that defeats pruning',
   sql: "SELECT COUNT(*) AS txns, ROUND(SUM(amount_usd), 2) AS volume\nFROM transfers\nWHERE YEAR(ts) = 2026 AND MONTH(ts) = 2",
   note: 'Same answer. But the function must be applied to every partition value, so the engine reads everything and filters afterwards. Identical result, an order of magnitude more bytes scanned on a real table.' },
 { t: 'Project only what you need',
   sql: "SELECT src_wallet, ROUND(SUM(amount_usd), 2) AS volume\nFROM transfers\nWHERE is_flagged = 1\nGROUP BY src_wallet\nORDER BY volume DESC",
   note: 'Two columns out of six. On a columnar format the engine reads only those column chunks — the narrower the projection, the smaller the bill. This is why SELECT * is a cost decision, not a style one.' },
 { t: 'The aggregate a warehouse can push down',
   sql: "SELECT w.chain, COUNT(*) AS txns, ROUND(SUM(t.amount_usd), 2) AS volume,\n       COUNT(DISTINCT t.src_wallet) AS senders\nFROM transfers t\nJOIN wallets w ON w.wallet_id = t.src_wallet\nGROUP BY w.chain\nORDER BY volume DESC",
   note: 'COUNT and SUM are decomposable — each worker computes a partial and the results merge. COUNT(DISTINCT) is not, which is why it forces a shuffle and why an approximate variant exists.' }
],
body: [
 { h: 'What actually makes a lakehouse query fast', html:
   '<ol>' +
   '<li><strong>Partition pruning</strong> — a predicate on the partition column skips whole directories. Biggest single lever.</li>' +
   '<li><strong>Column projection</strong> — columnar formats read only the columns you name.</li>' +
   '<li><strong>Row-group / file skipping</strong> — Parquet min/max statistics let the reader skip chunks that cannot match.</li>' +
   '<li><strong>File sizing</strong> — many tiny files means per-file overhead dominates. Compaction to roughly 128–512 MB is the standard remedy.</li>' +
   '<li><strong>Join strategy</strong> — broadcast the small side to avoid the shuffle.</li>' +
   '</ol>' },
 { h: 'Dialect differences that catch people', html:
   '<table><thead><tr><th>Thing</th><th>MySQL</th><th>Athena / Trino</th><th>Spark SQL</th></tr></thead><tbody>' +
   '<tr><td>String concat</td><td>CONCAT()</td><td>|| or concat()</td><td>concat()</td></tr>' +
   '<tr><td>Date format</td><td>DATE_FORMAT</td><td>date_format / format_datetime</td><td>date_format</td></tr>' +
   '<tr><td>Date arithmetic</td><td>DATE_ADD(d, INTERVAL n DAY)</td><td>d + INTERVAL \'n\' DAY</td><td>date_add(d, n)</td></tr>' +
   '<tr><td>Recursive CTE</td><td>Yes</td><td>Limited</td><td>No</td></tr>' +
   '<tr><td>Approx distinct</td><td>—</td><td>approx_distinct()</td><td>approx_count_distinct()</td></tr>' +
   '<tr><td>Arrays / structs</td><td>JSON functions</td><td>Native, UNNEST</td><td>Native, explode()</td></tr>' +
   '</tbody></table>' },
 { h: 'The cost sentence worth having ready', html:
   '<p>Athena bills per terabyte scanned. Converting a CSV table to partitioned, compressed Parquet and projecting only the needed columns routinely cuts a query\u2019s scanned bytes by an order of magnitude — and it is the first thing to check when someone reports a surprising bill. Redshift is different again: cost is cluster time, so the levers are distribution and sort keys rather than bytes scanned.</p>' }
],
call: '"On Athena the cost model is bytes scanned, so the levers are partition pruning, column projection and file sizing rather than indexes — and a function wrapped around the partition column defeats pruning exactly the way it defeats an index in Postgres."',
warn: 'The small-file problem is the one that surprises people. A streaming job writing a file per micro-batch can leave a table with hundreds of thousands of tiny objects, and per-file overhead then dominates every query. Compaction is a scheduled maintenance job, not an optional optimisation.',
qf: [
 ['What is partition pruning?', 'Skipping whole partitions because the predicate on the partition column excludes them.'],
 ['What defeats it?', 'Wrapping the partition column in a function, or comparing against a non-constant expression.'],
 ['Why is SELECT * expensive on a columnar store?', 'It reads every column chunk; Athena bills by bytes scanned.'],
 ['What is the small-file problem?', 'Per-file overhead dominates when a table has very many tiny objects; compaction fixes it.'],
 ['Which aggregates push down cleanly?', 'COUNT, SUM, MIN, MAX — decomposable into partials. COUNT(DISTINCT) is not.'],
 ['Redshift vs Athena cost levers?', 'Athena: bytes scanned — partitioning and projection. Redshift: cluster time — distribution and sort keys.']
]});
